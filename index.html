o Esposito","image":"https://images.ctfassets.net/22n7d68fswlw/5MTieBzC3yJBOZEy2TWRen/080d0d85842501d174aa64a2dc4c17b4/Your-Mother-Your-Mother-Your-Mother_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5MTieBzC3yJBOZEy2TWRen/080d0d85842501d174aa64a2dc4c17b4/Your-Mother-Your-Mother-Your-Mother_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Oscar winner Mahershala Ali (TIFF ’18 People’s Choice Award winner \u003cem\u003eGreen Book\u003c/em\u003e) stars as a devout Muslim, loving family man, and contract killer in this audaciously inventive Texas-set action thriller from writer-director Bassam Tariq (\u003cem\u003eMogul Mowgli\u003c/em\u003e).","synopsis":"After his beloved wife dies, Latif resolves to end his criminal career and focus on caring for his three children — but his longtime employer Mike (Laith Nakli, TIFF ’25’s Lucky Lu ) has other plans. Latif is having a hard enough time finding breast milk for his baby girl and wants no part in Mike and cowboy Haun Yoon’s (John Cho) rapidly escalating feud but, as his bloodstained past comes back to haunt him, he may have no choice in the matter.","screenings":[{"Title":"Your Mother Your Mother Your Mother","Director":"Bassam Tariq","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"08:30","EndTime":"10:22","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Your Mother Your Mother Your Mother","Director":"Bassam Tariq","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"21:30","EndTime":"23:52","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Your Mother Your Mother Your Mother","Director":"Bassam Tariq","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"11:15","EndTime":"13:37","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"Your Mother Your Mother Your Mother","Director":"Bassam Tariq","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"14:30","EndTime":"16:52","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Ken Russell\u0027s The Devils","slug":"ken-russell-s-the-devils","category":"TIFF Classics","categorySlug":"tiff-classics","director":"Ken Russell","premiere":"","cast":"Vanessa Redgrave, Oliver Reed, Dudley Sutton, Gemma Jones","image":"https://images.ctfassets.net/22n7d68fswlw/1FEFSNl1sQ0nrjUtfVGprD/03062df05910fd53e68d38d74fd3a317/Ken-Russell-s-The-Devils_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1FEFSNl1sQ0nrjUtfVGprD/03062df05910fd53e68d38d74fd3a317/Ken-Russell-s-The-Devils_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"North American Premiere of 4K restoration!","synopsis":"Ken Russell’s 1971 The Devils remains one of cinema’s most transgressive and incendiary provocations, a feverish account of the Loudun possessions witchcraft trial in 17th-century France. Oliver Reed stars as Urbain Grandier, a wildly charismatic libertine priest who defies Cardinal Richelieu’s consolidation of power. Vanessa Redgrave’s Sister Jeanne is a sexually repressed, hunchbacked Abbess obsessed with Grandier with an intensity that ignites accusations of demonic possession among her convent’s nuns. Already a target for reprisals due to his political resistance, Grandier’s promiscuity eventually lands him on the wrong side of a powerful family.","screenings":[{"Title":"Ken Russell\u0027s The Devils","Director":"Ken Russell","Blurb":"","Category":"TIFF Classics","Date":"Thu Sep 10","StartTime":"13:30","EndTime":"15:34","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Ken Russell\u0027s The Devils","Director":"Ken Russell","Blurb":"","Category":"TIFF Classics","Date":"Mon Sep 14","StartTime":"10:00","EndTime":"11:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Kissed","slug":"kissed","category":"TIFF Classics","categorySlug":"tiff-classics","director":"Lynne Stopkewich","premiere":"","cast":"Molly Parker, Peter Outerbridge, Jay Brazeau, Natasha Morley","image":"https://images.ctfassets.net/22n7d68fswlw/1GqjIM8IHJSgqCgSWlDopW/70dbb2703b3871a5bccecde55cd04edd/Kissed_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1GqjIM8IHJSgqCgSWlDopW/70dbb2703b3871a5bccecde55cd04edd/Kissed_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eWorld Premiere of 4K restoration!\u003c/p\u003e\n\n\u003cp\u003eInitially a controversial outlier, Lynne Stopkewich’s singular debut \u003cem\u003eKissed\u003c/em\u003e (TIFF ’96) is a subversive, tender drama about sexual awakening that shares the same ethereal atmosphere as erotic Canadian classics David Cronenberg’s \u003cem\u003eCrash\u003c/em\u003e (1996) and Atom Egoyan’s \u003cem\u003eExotica\u003c/em\u003e (1994).\u003c/p\u003e","synopsis":"In a breakout role that won her a Genie Award, Molly Parker plays Sandra, a young woman who becomes enraptured by the sensory experience of death. As a child, Sandra performs rituals in the woods, giving dead animals a sacred burial and examining their lifeless bodies with a trace-like focus. This lifelong fascination leads Sandra to study as an embalmer at a mortuary school, where her feelings about death develop into necrophilia. She describes the act as “crossing over,” straddling the realm between the living and the dead as she reaches a newfound sexual satisfaction with the cadavers. A fellow student, Matt (Peter Outerbridge), becomes obsessed with Sandra and her sexual preferences, projecting his own selfish desires onto her while desperately attempting to seduce her so he too can be treated like one of her deceased lovers.","screenings":[{"Title":"Kissed","Director":"Lynne Stopkewich","Blurb":"","Category":"TIFF Classics","Date":"Tue Sep 15","StartTime":"18:30","EndTime":"20:18","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Pelechian Project","slug":"pelechian-project","category":"TIFF Classics","categorySlug":"tiff-classics","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/4aXFBcUZHhdR7x5UMLALUO/cb2574ee2eb6f57f21d8c05a463cbc02/WE_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4aXFBcUZHhdR7x5UMLALUO/cb2574ee2eb6f57f21d8c05a463cbc02/WE_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eNorth American premiere of 4K restorations!\u003c/p\u003e\n\n\u003cp\u003eOne of the year’s greatest cinematic gifts, this programme brings together five newly restored films by the pioneering Armenian filmmaker Artavazd Pelechian, each a harrowing ode to humanity, and its natural cycles of existence.\u003c/p\u003e","synopsis":"Mixing archival images with documentary footage, Pelechian’s films are wordless, though visually and musically maximalist. This programme comprises five of his major works, each a harrowing ode to humanity, and its natural cycles of existence. They include the city symphony Land of the People (1966); The Beginning (1967), which employs a novel staccato effect to conjure the rush of the October Revolution; We (1969) , a masterpiece portrait of Armenian resistance that transforms “we” from the localized to the universal; and his best-known work, The Seasons (1975), which includes the oft-referenced scenes of Armenian shepherds embracing their herds as they sluice down snowy hills. We conclude with The End (1992), a gentle hymn to travel and faces filmed during a train ride from Moscow to Yerevan.","screenings":[{"Title":"Pelechian Project","Director":"","Blurb":"","Category":"TIFF Classics","Date":"Mon Sep 14","StartTime":"19:15","EndTime":"21:11","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Report to Mother","slug":"report-to-mother","category":"TIFF Classics","categorySlug":"tiff-classics","director":"John Abraham","premiere":"","cast":"Joy Mathew, Maji Venkatesh, Kunhilakshmi Amma, Harinarayanan, Nilambur Balan, Ramachandran Mokeri, Naseem, Venu K. Menon, Anand, Rashid, Hamsa, Sathian, The people of Wayanad, Kozhikode, Kodungalloor, Fort Kochi, Kottapuram, Iringal Quarry Workers, Vadakara Karate Students","image":"https://images.ctfassets.net/22n7d68fswlw/2UH1kGU0saV6ibzfnlBHoU/f01762c1755a4502993704367ff2bc10/Report-to-Mother_02.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2UH1kGU0saV6ibzfnlBHoU/f01762c1755a4502993704367ff2bc10/Report-to-Mother_02.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eNorth American Premiere of 4K restoration!\u003c/p\u003e\n\n\u003cp\u003eA daring clarion call and one of the most significant works of Indian political cinema, John Abraham’s extraordinary final film \u003cem\u003eAmma Ariyan\u003c/em\u003e (\u003cem\u003eReport to Mother\u003c/em\u003e) follows a young man in 1970s Kerala as he journeys — with a progressive swell of companions — to inform a mother of her son’s death, amid widespread unrest.\u003c/p\u003e","synopsis":"Shot in black and white with all natural light and seamlessly incorporating cinéma vérité reports of ongoing and historical workers’ struggles in the region, the film is a rich mix of documentary realism and fiction, with structural rhythms that emanate a moving lyricism. Independently produced by the Odessa Collective, an itinerant cinema club that screened films with a 16mm projector and radically challenged the systems of film production, exhibition, and community outside of the capitalist industry, Amma Ariyan ’s spirit of rebellion and solidarity is also reflected in the conditions of its making — and remains a timely inspiration today.","screenings":[{"Title":"Report to Mother","Director":"John Abraham","Blurb":"","Category":"TIFF Classics","Date":"Sun Sep 13","StartTime":"15:30","EndTime":"17:55","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Spring in a Small Town","slug":"spring-in-a-small-town","category":"TIFF Classics","categorySlug":"tiff-classics","director":"Fei Mu","premiere":"","cast":"Shi Yu, Wei Wei, Li Wei, Zhang Hongmei","image":"https://images.ctfassets.net/22n7d68fswlw/6cXCVSr2N1MwuDzV8fbeKR/1d330857d9d26b9cf15303019cc5fde4/Spring-in-a-Small-Town_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6cXCVSr2N1MwuDzV8fbeKR/1d330857d9d26b9cf15303019cc5fde4/Spring-in-a-Small-Town_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eWorld Premiere of 4K restoration!\u003c/p\u003e\u003cp\u003e\n\n\u003c/p\u003e\u003cp\u003eCrowned the greatest Chinese film ever made by the Hong Kong Film Critics Society, director Fei Mu’s poetic, romantic 1948 masterpiece observes a bored wife enlivened by a surprise visit from an old flame, whose presence threatens to upend the matrimonial home.\u003c/p\u003e","synopsis":"Yuwen (Wei Wei) has spent six of her eight married years nursing Liyan (Shi Yu) through vague, undefined illnesses, possibly compounded by a hypochondriac neurosis. Yuwen is an ideal wife — she also looks after her husband’s younger sister — but she is terribly bored. Into this stasis comes Liyan’s old friend Zhichen (Li Wei), now a doctor. It is revealed that he and Yuwen were once adolescent sweethearts. Urbane and vital, Zhichen awakens something in Yuwen. But Liyan’s  dawning awareness of the romantic history between Yuwen and Zhichen creates tension, jarring the couple from their romantic fever dream.","screenings":[{"Title":"Spring in a Small Town","Director":"Fei Mu","Blurb":"","Category":"TIFF Classics","Date":"Wed Sep 16","StartTime":"13:00","EndTime":"15:08","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Ten Dark Women","slug":"ten-dark-women","category":"TIFF Classics","categorySlug":"tiff-classics","director":"Kon Ichikawa","premiere":"","cast":"Eiji Funakoshi, Fujiko Yamamoto, Mariko Miyagi, Tamao Nakamura, Kyoko Kishida, Keiko Kishi","image":"https://images.ctfassets.net/22n7d68fswlw/6rFg8zTNvKWGwjGWoAHSFf/ae25afe53d4946280f89971b61e1b576/Ten-Dark-Women_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6rFg8zTNvKWGwjGWoAHSFf/ae25afe53d4946280f89971b61e1b576/Ten-Dark-Women_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eNorth American Premiere of 4K restoration!\u003c/p\u003e\n\n\u003cp\u003eIn the stylish, satirical, and ahead-of-its-time \u003cem\u003eTen Dark Women\u003c/em\u003e (\u003cem\u003eKuroi jûnin no onna\u003c/em\u003e, 1961), by legendary Japanese director Kon Ichikawa, 10 women discover they are sharing the same pathologically unfaithful man, and temporarily abandon jealousy to meticulously orchestrate a collective revenge.\u003c/p\u003e","synopsis":"In Ten Dark Women ( Kuroi jûnin no onna , 1961) by legendary Japanese director Kon Ichikawa, 10 women discover they are sharing the same pathologically unfaithful man, and temporarily abandon jealousy to meticulously orchestrate a collective revenge. Kaze (Eiji Funakoshi) is the pathetic cad at the centre of all of the hoopla, a philandering television producer who falls so easily in love that he can’t keep track of how many times he has cheated on his long suffering wife, Futaba (Fujiko Yamamoto), a successful restaurateur who has reached her limit. Refusing to remain a victim, Futaba forms a pact with nine of her husband’s mistresses (played by an unparalleled ensemble of studio divas) to kill him off — though she has a secret plan of her own that leads to unexpected twists.","screenings":[{"Title":"Ten Dark Women","Director":"Kon Ichikawa","Blurb":"","Category":"TIFF Classics","Date":"Thu Sep 17","StartTime":"17:30","EndTime":"19:43","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Ba\u0027s Book","slug":"ba-s-book","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Ashley Duong","premiere":"World Premiere","cast":"Ashley Duong, Anh Duong, Duy Nguyen","image":"https://images.ctfassets.net/22n7d68fswlw/6n6Uc4NDuLMNKHfcKwnzcY/9738bc90745254bb85a66cda45baa3bc/BasBook_hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6n6Uc4NDuLMNKHfcKwnzcY/9738bc90745254bb85a66cda45baa3bc/BasBook_hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"In a hybrid documentary retelling, documentary filmmaker Ashley Duong takes her father’s memoir and stages a recreation of it in Vietnam alongside her family.","synopsis":"After the stops and starts of convincing him and her mother to go back to Vietnam, something they’ve never done as a family, they journey to his former village for a heartwarming reunion with his siblings. The family members are actively involved in bringing his memoir to life, helping to cast the younger versions of themselves, giving notes to the actors, and assisting in the building of the set (a recreation of the home they grew up in.) The doc cleverly uses the process of the recreation to pull out even more memories, particularly in a beautiful scene when the filmmaker’s father and the actor portraying him connect about the character.","screenings":[{"Title":"Ba\u0027s Book","Director":"Ashley Duong","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"09:30","EndTime":"11:03","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Ba\u0027s Book","Director":"Ashley Duong","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"18:40","EndTime":"20:43","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Ba\u0027s Book","Director":"Ashley Duong","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"12:35","EndTime":"14:38","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Ba\u0027s Book","Director":"Ashley Duong","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"17:30","EndTime":"19:03","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Ba\u0027s Book","Director":"Ashley Duong","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 19","StartTime":"12:45","EndTime":"14:48","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Black Sunflowers","slug":"black-sunflowers","category":"TIFF Docs","categorySlug":"tiff-docs","director":"James Marcus Haney","premiere":"World Premiere","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/2BUgbzsjrcrGjwegg4Iwuf/719af405a670a8bf6288fa3d7d477207/Black-Sunflowers_Still_Hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2BUgbzsjrcrGjwegg4Iwuf/719af405a670a8bf6288fa3d7d477207/Black-Sunflowers_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eBlack Sunflowers\u003c/em\u003e is a mosaic of Ukrainian youth, shuttling between the frontlines and civilian life, captured by the gifted American filmmaker James Marcus Haney (\u003cem\u003eNo Cameras Allowed\u003c/em\u003e) collaborating with an esteemed Ukrainian crew.","synopsis":"The American filmmaker James Marcus Haney teams with an esteemed crew of Ukrainian producers including Volodymyr Yatsenko (behind last year’s TIFF Platform winner To the Victory! ). Haney is a gifted visualist known for working with musicians such as Mumford \u0026 Sons, Elton John, and Coldplay. He first visited Ukraine to film for an NGO. “I was surprised to see how much normal life carried on, despite the war,” he wrote in a director’s statement. “I couldn’t help but think that mainstream media is missing half of the story.”","screenings":[{"Title":"Black Sunflowers","Director":"James Marcus Haney","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 11","StartTime":"18:45","EndTime":"20:52","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Black Sunflowers","Director":"James Marcus Haney","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"08:55","EndTime":"10:32","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPrem ss. Beau is giving up other opportunities to make Chaparelle work while friends question if that’s a good idea. Offstage can be chaotic. But when Zella and Jesse get on-stage together, the chemistry is as potent as any movie stars. Music documentaries are plentiful these days, but this one soars high above the rest.","screenings":[{"Title":"Bleeding Hearts","Director":"Andrew Morgan","Blurb":"","Category":"TIFF Docs","Date":"Mon Sep 14","StartTime":"14:15","EndTime":"15:52","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bleeding Hearts","Director":"Andrew Morgan","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"15:20","EndTime":"17:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bleeding Hearts","Director":"Andrew Morgan","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 18","StartTime":"14:00","EndTime":"16:07","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bleeding Hearts","Director":"Andrew Morgan","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 20","StartTime":"19:35","EndTime":"21:42","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Cheyenne","slug":"cheyenne","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Taimi Arvidson","premiere":"World Premiere","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/6mt8ll18ezo9aXEFIZB7j8/5c42a17a0f5e93cd8e92219045a75f4e/Cheyenne_Still_04.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6mt8ll18ezo9aXEFIZB7j8/5c42a17a0f5e93cd8e92219045a75f4e/Cheyenne_Still_04.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eCheyenne \u003c/em\u003efollows a group of fearless cowgirls who compete at riding wild broncos on the rodeo circuit after nearly a century of being excluded because of their gender.","synopsis":"Each of these women enters the arena for different reasons. Bee, a seasoned veteran, is trying to provide for her son. Brooke, a relative newbie, is learning how to manage the pain that comes with the job. Lake seeks a distraction from past trauma. Ally wants the life-changing payout. We follow them for several months on the circuit as they push their physical and mental limits to win a coveted spot at the showdown known as the Daddy of ’em All: Cheyenne Frontier Days.","screenings":[{"Title":"Cheyenne","Director":"Taimi Arvidson","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"15:15","EndTime":"16:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Cheyenne","Director":"Taimi Arvidson","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"12:15","EndTime":"14:29","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Cheyenne","Director":"Taimi Arvidson","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"15:30","EndTime":"17:44","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Cheyenne","Director":"Taimi Arvidson","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 20","StartTime":"13:05","EndTime":"15:19","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushSco urb":"Palestinian scholar Edward Said is profiled in his own words, drawing upon decades of archives, to explore the legacy of his groundbreaking works including \u003cem\u003eOrientalism\u003c/em\u003e and \u003cem\u003eThe Question of Palestine\u003c/em\u003e.","synopsis":"Edward Said: Between Worlds provides the opportunity to reengage that voice and share it with new generations, which feels as timely as I Am Not Your Negro was for James Baldwin. Filmmaker Maiken Baird teams with Palestinian-American producers Sarah Mowaswes and Razan Ghalayini along with the scholar’s daughter Najla Said as a consulting producer. They have combed the world’s archives to uncover hundreds of hours of interviews, public talks, and documentaries that capture Said in his prime. The film team skilfully braids these eclectic sources together to deliver a moving portrait in Said’s own words.","screenings":[{"Title":"Edward Said: Between Worlds","Director":"Maiken Baird","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"18:10","EndTime":"20:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Edward Said: Between Worlds","Director":"Maiken Baird","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"14:30","EndTime":"16:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Edward Said: Between Worlds","Director":"Maiken Baird","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"20:50","EndTime":"23:07","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Edward Said: Between Worlds","Director":"Maiken Baird","Blurb":"","Category":"TIFF Docs","Date":"Sun =thumb","blurb":"The Indigenous painter Sara Flores gets discovered by the international art world in her 70s, setting her off on an adventure as she travels from her home in the Peruvian Amazon to be fȇted in galleries from New York to Paris.","synopsis":"The juxtapositions between the worlds Flores moves in are stark. At home, her community is waging an existential battle against illegal loggers. She joins local patrols armed with bows and arrows. When she’s being fȇted in art capitals, she quietly accepts praise from admirers while sipping champagne and making small talk. The filmmakers practice a poetic and experiential style, leaving viewers to draw their own interpretations. While honouring Flores’ talents, they’ve made their own work of art.","screenings":[{"Title":"The Hummingbird Paints Fragrant Songs","Director":"Èlia Gasull Balada, Matteo Norzi","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"12:45","EndTime":"14:43","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Hummingbird Paints Fragrant Songs","Director":"Èlia Gasull Balada, Matteo Norzi","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"20:50","EndTime":"22:18","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Hummingbird Paints Fragrant Songs","Director":"Èlia Gasull Balada, Matteo Norzi","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"20:45","EndTime":"22:43","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Hummingbird Paints Fragrant Songs","Director":"Èlia Gasull Balada, Matteo Norzi","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 19","StartTim sk immediately denounced it on Twitter and refused to participate. But that didn’t impede Gibney, who draws upon countless hours of interviews that Musk has given over the years. Even more revealingly, Gibney conducts new interviews with figures who have known Musk up close and personal, including the mogul’s father, Errol Musk.","screenings":[{"Title":"Musk","Director":"Alex Gibney","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"09:00","EndTime":"12:50","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Musk","Director":"Alex Gibney","Blurb":"","Category":"TIFF Docs","Date":"Mon Sep 14","StartTime":"15:20","EndTime":"19:40","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Musk","Director":"Alex Gibney","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"11:50","EndTime":"16:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Musk","Director":"Alex Gibney","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 19","StartTime":"09:45","EndTime":"14:05","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Pervert\u0027s Guide to Utopias","slug":"the-pervert-s-guide-to-utopias","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Sophie Fiennes","premiere":"North American Premiere","cast":"Slavoj Žižek","image":"https://images.ctfassets.net/22n7d68fswlw/2SXZ27nRs1XtjOQxW6yJ5n/25ac0999a2b598fb9af44955b59753bb/The-Pervert-s-Guide-to-Utopias_Still_Hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2SXZ27nRs1XtjOQxW6yJ5n/25ac0999a2b598fb9af44955b59753bb/The-Pervert-s-Guide-to-Utopias_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Twenty years after \u003cem\u003eThe Pervert’s Guide to Cinema\u003c/em\u003e, the renowned intellectual Slavoj Žižek reunites with director Sophie Fiennes for a fresh meditation on movies and ideas that crackles with energy.","synopsis":"If you love talking about movies, decoding a director’s intent or extrapolating on your own interpretations, then we’ve got the ultimate aphrodisiac for you in The Pervert’s Guide to Utopias . Slavoj Žižek, a professor of philosophy and psychoanalysis, is an academic rock star renowned for riffing on cultural theory. Twenty years ago, he embarked on a collaboration with filmmaker Sophie Fiennes that started with The Pervert’s Guide to Cinema (TIFF ’06) in which they created a free-flowing essay interpreting film clips from a psychoanalytic perspective. They reprised the method in The Pervert’s Guide to Ideology (TIFF ’12). Don’t worry if you missed those; you can start fresh with this third installment that applies their lively approach to a new filmography that interweaves ideas about utopias, dystopias, faith, fascism, revolution, environmentalism, vampires, zombies, cloning, and more.","screenings":[{"Title":"The Pervert\u0027s Guide to Utopias","Director":"Sophie Fiennes","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"08:00","EndTime":"10:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Pervert\u0027s Guide to Utopias","Director":"Sophie Fiennes","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"17:15","EndTime":"19:58","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"" of the common causes these communities once found. Now how do we process divisive moments that trigger deep hurt, including the polarizing debates around Israel and Palestine? Today, as hateful demagogues push ideas like “replacement theory,” we can see how racism and antisemitism are continually twinned together. Re/Pair doesn’t offer simple solutions. But it does demonstrate the need for us to move away from our social media feedback loops and hold our own dialogues where listening is as important as speaking.","screenings":[{"Title":"Re/Pair","Director":"Lacey Schwartz Delgado","Blurb":"","Category":"TIFF Docs","Date":"Mon Sep 14","StartTime":"15:45","EndTime":"17:56","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Re/Pair","Director":"Lacey Schwartz Delgado","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"14:15","EndTime":"15:56","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Re/Pair","Director":"Lacey Schwartz Delgado","Blurb":"","Category":"TIFF Docs","Date":"Wed Sep 16","StartTime":"21:55","EndTime":"00:06","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Re/Pair","Director":"Lacey Schwartz Delgado","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 18","StartTime":"21:00","EndTime":"23:11","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Rescue","slug":"rescue","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Sine Plambech","premiere":"World Premiere","cast":"Rawa Mohammed Hazaea Ahmed Qasem, Hani Ghaleb Othman Al-Shehab, Nejma","image":"https://images.ctfassets.net/22n7d68fswlw/1uhMhalk7kUuymAVgs7xzp/214cf1a5090fabe5b2164230e1a79de5/Rescue_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1uhMhalk7kUuymAVgs7xzp/214cf1a5090fabe5b2164230e1a79de5/Rescue_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Director Sine Plambech (\u003cem\u003eHeartbound\u003c/em\u003e, TIFF ’18) documents the kidnapping of a mother and her long quest to be reunited with her husband, illuminating a mass crisis experienced by migrants in the Mediterranean.","synopsis":"Rescue opens with a harrowing abduction in the waters of the Mediterranean close to the Libyan coast. Director Sine Plambech and her film crew are accompanying the Geo Barents, a rescue ship operated by Doctors Without Borders that’s trying to save a rubber boat packed with migrants in distress. Suddenly, a third vessel approaches, piloted by Libyan militia members. During a frantic scramble in the open water, some migrants are snatched by the militias, while others reach the Geo Barents. One of the rescued migrants, Hani, tells the film crew he has just been separated from his family. His wife Roro, his young son, and their two-month old daughter have been kidnapped by the militia.","screenings":[{"Title":"Rescue","Director":"Sine Plambech","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"17:30","EndTime":"19:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Rescue","Director":"Sine Plambech","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"12:15","EndTime":"14:15","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Rescue","Director":"Sine Plambech","Blurb" less gory than The Pitt . Plastic surgery might feel superficial in times when Iranians take to the streets to protest fundamentalism and suffer U.S. and Israeli bombardment. Those threats of violence lurk in the background. But one achievement of the film is to treat Iranians as individuals, not as the monolith portrayed in western media. They are as preoccupied with identity, agency, and pressures placed on the body as anyone else. Salari gets under their skin while holding up a mirror to any viewer.","screenings":[{"Title":"Tehran, Under the Skin","Director":"Afsaneh Salari","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 11","StartTime":"20:30","EndTime":"21:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Tehran, Under the Skin","Director":"Afsaneh Salari","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"17:15","EndTime":"19:09","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Tehran, Under the Skin","Director":"Afsaneh Salari","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"17:00","EndTime":"18:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Turtle Island Rap","slug":"turtle-island-rap","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Alexandra Lazarowich","premiere":"World Premiere","cast":"A$h Da Hunter, Travis Thompson, Wiidaaseh","image":"https://images.ctfassets.net/22n7d68fswlw/5GzS5BWMuvB6YomC15ENuI/7a9e9c7d3592e6ca65349450d2ca049b/Turtle-Island-Rap_Still_Hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5GzS5BWMuvB6YomC15ENuI/7a9e9c7d3592e6ca65349450d2ca049b/Turtle-Island-Rap_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"The bumpy road to success experienced by three aspiring Indigenous hip-hop artists is the focus of Alexandra Lazarowich’s (\u003cem\u003eFast Horse\u003c/em\u003e) verité-style feature documentary debut.","synopsis":"Turtle Island Rap tracks the journey of three young Indigenous artists, Wiidaaseh, A$h Da Hunter, and Travis Thompson, from the hustle to the stage. In cinema verité style, the hard-won triumphs and trials are seen as their individual journeys are taken with warmth and humour, even when things are tough.","screenings":[{"Title":"Turtle Island Rap","Director":"Alexandra Lazarowich","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 11","StartTime":"18:25","EndTime":"20:02","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Turtle Island Rap","Director":"Alexandra Lazarowich","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 13","StartTime":"18:20","EndTime":"20:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Turtle Island Rap","Director":"Alexandra Lazarowich","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"18:35","EndTime":"20:42","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Turtle Island Rap","Director":"Alexandra Lazarowich","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"14:50","EndTime":"16:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Ultra Runner","slug":"the-ultra-runner","category":"TIFF Docs","categorySlug":"tiff-docs","director":"Mila Aung-Thwin","premiere":"World Premiere","cast":"Tiberiu Ușeriu, Alin Uhlmann Ușeriu, Maria Mihaela Ștefănuț, David Ușeriu, Eftina Moeșan, Ana Szekely","image":"https://images.ctfassets.net/22n7d68fswlw/2ht1MQbRi0VDrhhGATOKK1/33403eb821a2921ca32e30cd66d24deb/The-Ultra-Runner_Still_Hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2ht1MQbRi0VDrhhGATOKK1/33403eb821a2921ca32e30cd66d24deb/The-Ultra-Runner_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Punishing tests of human endurance become a means of escaping past demons for the unforgettable subject of Mila Aung-Thwin’s superb new film.","synopsis":"Thankfully, viewers of director Mila Aung-Thwin’s superb documentary do not have to go out in the cold themselves to witness Uşeriu compete in the 6633 Arctic Ultra, an infamously brutal footrace across over 600 kilometres in the Canadian north. Along with riveting footage of the athlete weathering the subzero temperatures and trying to survive the race’s most punishing effects, Aung-Thwin’s film makes highly skilful and stylish use of re-enactments to convey key moments from Uşeriu’s difficult childhood in Romania and the downward spiral that led to a years-long stint for armed robbery in a high-security German prison. It’s there in the tight confines of a prison yard where Ușeriu began to find a way out of his darkness.","screenings":[{"Title":"The Ultra Runner","Director":"Mila Aung-Thwin","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 11","StartTime":"17:30","EndTime":"19:38","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Ultra Runner","Director":"Mila Aung-Thwin","Blurb":"","Category":"TIFF Docs","Date":"Sat Sep 12","StartTime":"09:10","EndTime":"10:48","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":" the weather is blizzarding or blazing. Over the course of several years, Kopple follows three campaigns for better pay and conditions. Lined up in opposition are corporations that spend millions to bully and undermine the union efforts. The intimidation is fierce, but as one organizer reminds her comrades, “We shouldn’t be fearful of demanding what we deserve.” This film is a testament to their courage.","screenings":[{"Title":"Union Town","Director":"Barbara Kopple","Blurb":"","Category":"TIFF Docs","Date":"Fri Sep 11","StartTime":"12:10","EndTime":"13:56","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Union Town","Director":"Barbara Kopple","Blurb":"","Category":"TIFF Docs","Date":"Tue Sep 15","StartTime":"14:45","EndTime":"17:01","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Union Town","Director":"Barbara Kopple","Blurb":"","Category":"TIFF Docs","Date":"Thu Sep 17","StartTime":"15:30","EndTime":"17:46","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Union Town","Director":"Barbara Kopple","Blurb":"","Category":"TIFF Docs","Date":"Sun Sep 20","StartTime":"12:40","EndTime":"14:56","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"REDEFINED | Short Film Showcase","slug":"redefined-short-film-showcase","category":"TIFF Next Wave Selects","categorySlug":"tiff-next-wave-selects","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/2OT2NTcgolVYhX4NR9pgp1/211111cbee0bcfdc2e772ba71a1455bf/Redefined_TIFF?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2OT2NTcgolVYhX4NR9pgp1/211111cbee0bcfdc2e772ba71a1455bf/Redefined_TIFF?w=1280\u0026h=720\u0026fit=thumb","blurb":"Catch the premiere of REDEFINED at the Toronto International Film Festival and streaming worldwide on the NFB. Following the screening, join us for a Q\u0026amp;A with the filmmakers.","synopsis":"Created by the NFB and TIFF, REDEFINED brings together five Canadian and Indigenous filmmakers from across the country to celebrate the differences that unite us and to explore culture, belonging, identity, and sovereign(ties) through personal storytelling. Produced over the course of a year and supported by the NFB’s state-of-the-art tools and mentorship resources, the films offer a powerful portrait of a generation reimagining what Canada is — and what it could become.","screenings":[{"Title":"REDEFINED | Short Film Showcase","Director":"","Blurb":"","Category":"TIFF Next Wave Selects","Date":"Wed Sep 16","StartTime":"18:00","EndTime":"19:31","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"At Night","slug":"at-night","category":"Wavelengths","categorySlug":"wavelengths","director":"Beatrice Gibson","premiere":"North American Premiere","cast":"Diocouda Diaoune, Kátia Belo Cardoso, Sophie Robinson, Amy Gwatkin, Lily McMenamy, Adam Christensen, Laida Lertxundi, Pauline Curnier Jardin, Alice Notley, Beatrice Gibson","image":"https://images.ctfassets.net/22n7d68fswlw/2Mo7TFzBkwrHLRLGMUJTm8/c918f782632de49d60ed04ca169e6f54/At-Night_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2Mo7TFzBkwrHLRLGMUJTm8/c918f782632de49d60ed04ca169e6f54/At-Night_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Mesmerizing and melancholic, the much-anticipated debut feature by British filmmaker and artist Beatrice Gibson is a work of choral autofiction that shifts from narrative to documentary to dream over a single night in Paris, reflecting on the nature of womanhood, privilege, and solidarity.","synopsis":"Central to the configuration is B (director Gibson, performing with brave vulnerability), a filmmaker in the midst of losing her grasp on her current project, and wanting to reconnect with her now-distant friend Didi (Diocouda Diaoune), a single mother defiantly resisting society’s systemic attempts to confine her. Other women include a former sex worker reflecting on the complexities of her past and a poet who confronts the unspoken grief caused by infertility. Together, these nocturnal denizens give voice to a rare and liberating dialogue, exploring womanhood, motherhood, sexual desire, isolation, class privilege, race, societal malaise, and the delicate nature of family and care.","screenings":[{"Title":"At Night","Director":"Beatrice Gibson","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 10","StartTime":"15:45","EndTime":"17:12","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"At Night","Director":"Beatrice Gibson","Blurb":"","Category":"Wavelengths","Date":"Sat Sep 12","StartTime":"18:45","EndTime":"20:42","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"At Night","Director":"Beatrice Gibson","Blurb":"","Category":"Wavelengths","Date":"Mon Sep 14","StartTime":"21:20","EndTime":"23:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Black Box is Orange","slug":"the-black-box-is-orange","category":"Wavelengths","categorySlug":"wavelengths","director":"Yuula Benivolski","premiere":"World Premiere","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/3og2l60wyo7OHuRzKdtgI1/0407c5db8ed6aa3d7d82e97ab732c780/The-Black-Box-is-Orange_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3og2l60wyo7OHuRzKdtgI1/0407c5db8ed6aa3d7d82e97ab732c780/The-Black-Box-is-Orange_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"The debut feature by Toronto artist and filmmaker Yuula Benivolski, \u003cem\u003eThe Black Box is Orange\u003c/em\u003e is a multimodal, autobiographical essay film that deploys both personal memory and incomplete archives to reflect on a childhood in a militarized border town.","synopsis":"The film’s ambitious structure consists of 10 dynamic and stylistically distinct chapters. These range from first-person, guided investigations into lingering traces of pre-Israeli infrastructure, to formal plays with contrapuntal sound and image, to hand-processed experiments that wordlessly invoke the colossal weight held in the image of the landscape. While certain chapters are deeply researched and nearly scholarly in nature, the majority are raw, personal, and bravely confessional. One constant, however, is an astute balance between a sense of politics and poetics, with the latter elevated through the use of textured 16mm and an exceptionally refined sound design.","screenings":[{"Title":"The Black Box is Orange","Director":"Yuula Benivolski","Blurb":"","Category":"Wavelengths","Date":"Sun Sep 13","StartTime":"18:45","EndTime":"20:45","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Black Box is Orange","Director":"Yuula Benivolski","Blurb":"","Category":"Wavelengths","Date":"Tue Sep 15","StartTime":"09:00","EndTime":"10:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Black Box is Orange","Director":"Yuula Benivolski","Blurb":"","Category":"Wavelengths","Date":"Tue Sep 15","StartTime":"17:30","EndTime":"19:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Diary of a Chambermaid","slug":"the-diary-of-a-chambermaid","category":"Wavelengths","categorySlug":"wavelengths","director":"Radu Jude","premiere":"North American Premiere","cast":"Ana Dumitrașcu, Mélanie Thierry, Vincent Macaigne, Marie Rivière","image":"https://images.ctfassets.net/22n7d68fswlw/MltfieLmPYbpBCDW0YhyO/04a586af07ca9263dcf7a240cdbadace/The-Diary-of-a-Chambermaid_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/MltfieLmPYbpBCDW0YhyO/04a586af07ca9263dcf7a240cdbadace/The-Diary-of-a-Chambermaid_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Offering his most provocative work yet, the latest from Romanian provocateur Radu Jude is a surprisingly tender socioeconomic satire.","synopsis":"Set in present-day Paris, Radu Jude’s The Diary of a Chambermaid is a variation on Octave Mirbeau’s Decadent-era novel. The anarchist writer’s text gained prominence during the infamous Dreyfus affair, a momentous scandal that exposed deeply seeded, systemic prejudices and reshaped European politics. First published in serialized form from 1891 to 1892, the original was reworked before appearing in the Dreyfusard journal La Revue blanche in 1900 and has since been revived in several significant adaptations (including by Jean Renoir and Luis Buñuel). While no foreknowledge of Mirbeau’s turn-of-the–19th century work (or its high-stakes landscape) is required to sink into Jude’s version, the source material provides fascinating historical parallels for this slapstick skewering of modern-day slavery.","screenings":[{"Title":"The Diary of a Chambermaid","Director":"Radu Jude","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 17","StartTime":"08:30","EndTime":"10:04","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Diary of a Chambermaid","Director":"Radu Jude","Blurb":"","Category":"Wavelengths","Date":"Sat Sep 19","StartTime":"15:45","EndTime":"17:49","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Diary of a Chambermaid","Director":"Radu Jude","Blurb":"","Category":"Wavelengths","Date":"Sun Sep 20","StartTime":"18:40","EndTime":"20:44","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Double Freedom","slug":"double-freedom","category":"Wavelengths","categorySlug":"wavelengths","director":"Lisandro Alonso","premiere":"North American Premiere","cast":"Catalina Saavedra, Misael Saavedra, Adrián Fondari, Alcides Fink","image":"https://images.ctfassets.net/22n7d68fswlw/58aBIzmtYkpPdwIsvEXWXT/1cc9b2cb4174342d721bee0dca081e67/Double-Freedom_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/58aBIzmtYkpPdwIsvEXWXT/1cc9b2cb4174342d721bee0dca081e67/Double-Freedom_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Less follow-up or sequel to his breakout debut than a sly and clever echo, Lisandro Alonso’s graceful and extraordinarily beautiful \u003cem\u003eDouble Freedom\u003c/em\u003e returns us to the daily life of Misael, a solitary labourer in Argentina’s rural La Pampa.","synopsis":"Now, with Double Freedom ( La libertad doble ), Alonso rejoins the stoic, noticeably older Misael (non-professional Misael Saavedra), still living the same life of cutting and supplying wood, and sheltering in a makeshift abode, surrounded by tall trees shimmering in the blazing sun. Less follow-up or sequel than a sly and clever echo — one need not have seen the first one to experience the wonders here — the film begins where La libertad looped in on itself, with a shirtless Misael enjoying wild game over an open flame. Shot on 35mm in both instances by Cobi Migliora (this time in widescreen), there is a pervasive uncanniness that attends Double Freedom , tethered not only to the large gap in time but also to cinematic memory.","screenings":[{"Title":"Double Freedom","Director":"Lisandro Alonso","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 10","StartTime":"21:15","EndTime":"22:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Double Freedom","Director":"Lisandro Alonso","Blurb":"","Category":"Wavelengths","Date":"Mon Sep 14","StartTime":"16:00","EndTime":"18:10","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Double Freedom","Director":"Lisandro Alonso","Blurb":"","Category":"Wavelengths","Date":"Wed Sep 16","StartTime":"21:50","EndTime":"00:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Everything Else is Noise","slug":"everything-else-is-noise","category":"Wavelengths","categorySlug":"wavelengths","director":"Nicolás Pereda","premiere":"North American Premiere","cast":"Rosa Estela Juárez Vargas, Teresita Sanchez, Luisa Pardo, Lázaro G. Rodríguez, Francisco Barreiro","image":"https://images.ctfassets.net/22n7d68fswlw/2VNzSUXF2ZYjrDlVs7mxqR/166667fafa7ab3f3761ce8b15045dfcb/Everything-Else-is-Noise_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2VNzSUXF2ZYjrDlVs7mxqR/166667fafa7ab3f3761ce8b15045dfcb/Everything-Else-is-Noise_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Prolific Mexican-Canadian auteur Nicolás Pereda has delivered his sharpest and most amusing film yet with \u003cem\u003eEverything Else is Noise\u003c/em\u003e, a sly, self-reflexive comedy of manners and mishaps involving a trio of women classical composers and musicians.","synopsis":"However, upon the arrival of journalist Lázaro (Lázaro G. Rodríguez) and cameraman Paco (Francisco Barreiro), the production is quickly derailed by the banality of the crew\u0027s questions and an escalating series of everyday annoyances, including a cacophony of gridlocked traffic and an interminable barking dog that pervades the otherwise tranquil space. Teresa’s aimless daughter Luisa (Luisa Pardo) is also lurking about, complicating the interlocutors’ lines of enquiry with as much relish as exasperation.","screenings":[{"Title":"Everything Else is Noise","Director":"Nicolás Pereda","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 10","StartTime":"20:30","EndTime":"22:11","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everything Else is Noise","Director":"Nicolás Pereda","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 11","StartTime":"12:15","EndTime":"13:26","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everything Else is Noise","Director":"Nicolás Pereda","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 18","StartTime":"22:00","EndTime":"23:41","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Life of Jorge Luis Borges","slug":"life-of-jorge-luis-borges","category":"Wavelengths","categorySlug":"wavelengths","director":"Mariano Llinás","premiere":"North American Premiere","cast":"Ernesto Montequín, Laura Paredes, Milva Leonardi","image":"https://images.ctfassets.net/22n7d68fswlw/3c36Sjq8oM1B2CAWDKAB39/336f7346914bdcbc66acbcc1c73cae02/Life-of-Jorge-Luis-Borges_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3c36Sjq8oM1B2CAWDKAB39/336f7346914bdcbc66acbcc1c73cae02/Life-of-Jorge-Luis-Borges_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"With the erudition and insight of a literary scholar and the gumption of an amateur detective, Argentinian auteur (and raconteur) Mariano Llinás (\u003cem\u003eLa Flor\u003c/em\u003e, TIFF ’18) explores the life and fiction of the legendary writer Jorge Luis Borges through objects and places.","synopsis":"With the erudition and insight of a literary scholar and the gumption of an amateur detective, the filmmaker travels to New York, Texas, Geneva, Reykjavik, and the rural border of Uruguay and Brazil, working through both biographical episodes as well as major texts like “El Aleph,” “Tlön, Uqbar, Orbis Tertius,” and “Death and the Compass.” The film simultaneously broadens to consider Borges’ expanded artistic demimonde — which included writers like Adolfo Bioy Casares and Silvina Ocampo, as well as filmmaker Hugo Santiago — while mapping the writer’s life within Argentina’s political history and in doing so, admirably rises above hagiography to confront Borges’ racism and dalliances with the far right.","screenings":[{"Title":"Life of Jorge Luis Borges","Director":"Mariano Llinás","Blurb":"","Category":"Wavelengths","Date":"Mon Sep 14","StartTime":"08:50","EndTime":"14:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Life of Jorge Luis Borges","Director":"Mariano Llinás","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 17","StartTime":"11:00","EndTime":"17:10","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Life of Jorge Luis Borges","Director":"Mariano Llinás","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 18","StartTime":"14:00","EndTime":"20:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"London","slug":"london","category":"Wavelengths","categorySlug":"wavelengths","director":"Sebastian Brameshuber","premiere":"North American Premiere","cast":"Bobby Sommer, Clifford Agu, Lana Prerad","image":"https://images.ctfassets.net/22n7d68fswlw/H5qDxaX1sTpWBiiN3OUfS/0141006c8fbef1d501cdca2651b8968a/London_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/H5qDxaX1sTpWBiiN3OUfS/0141006c8fbef1d501cdca2651b8968a/London_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"An experimental yet tender road movie about an enigmatic man’s shared commutes across Austria’s scenic West Autobahn — shot in-studio with vintage rear-projection techniques — Sebastian Brameshuber’s award-winning \u003cem\u003eLondon\u003c/em\u003e is a rare work of technical prowess that never belies its emotional core.","synopsis":"Here the liminal zone of the car variously evolves into a confessional, a waiting room, or a refuge, where strangers — played mostly by non-professionals — meet in circumstances that are at once anonymous and intimate. They include an unsettled soldier; a woman preparing for a wedding that her parents reject; and an academic (played by filmmaker Ted Fendt) researching the highway’s Nazi past. With each new passenger, the vehicle becomes a shifting social landscape of existential colloquy, revealing lives shaped by loneliness, hope, grief, desire for freedom, and the uncertainties of the present.","screenings":[{"Title":"London","Director":"Sebastian Brameshuber","Blurb":"","Category":"Wavelengths","Date":"Tue Sep 15","StartTime":"11:00","EndTime":"13:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"London","Director":"Sebastian Brameshuber","Blurb":"","Category":"Wavelengths","Date":"Wed Sep 16","StartTime":"20:30","EndTime":"23:00","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"London","Director":"Sebastian Brameshuber","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 17","StartTime":"18:40","EndTime":"21:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"My Wife Cries","slug":"my-wife-cries","category":"Wavelengths","categorySlug":"wavelengths","director":"Angela Schanelec","premiere":"North American Premiere","cast":"Vladimir Vulevic, Agathe Bonitzer, Birte Schnöink","image":"https://images.ctfassets.net/22n7d68fswlw/1iAbCmlgxEEK58sva0VW6j/6af342a650506ed6768e3af86ffd1f4e/My-Wife-Cries_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1iAbCmlgxEEK58sva0VW6j/6af342a650506ed6768e3af86ffd1f4e/My-Wife-Cries_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"With \u003cem\u003eMy Wife Cries\u003c/em\u003e — a startling, minimalist study in romantic misalignment — German auteur and Festival favourite Angela Schanelec employs her singular style to portray the crushing anguish and vertiginous confusion brought forth by marital crisis.","synopsis":"Shot on wonderfully textured 35mm by talented cinematographer Marius Panduru (who also shot Radu Jude’s Festival selection The Diary of a Chambermaid ), My Wife Cries is austere and solemn in tone, yet filled with surprising bursts of life, as the mix of painterly still life compositions and hypnotic tracking shots are punctuated by delightful, eccentric intrusions, such as a rehearsing orchestra in the middle of a park or a choreographed dance scene. As in all of Schanelec’s films, any study of life’s intricacies and disappointments leaves room for unexpected moments of pleasure and beauty.","screenings":[{"Title":"My Wife Cries","Director":"Angela Schanelec","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 10","StartTime":"21:45","EndTime":"23:18","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"My Wife Cries","Director":"Angela Schanelec","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 18","StartTime":"18:00","EndTime":"20:03","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"My Wife Cries","Director":"Angela Schanelec","Blurb":"","Category":"Wavelengths","Date":"Sun Sep 20","StartTime":"13:15","EndTime":"15:18","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Nobody\u0027s Violence","slug":"nobody-s-violence","category":"Wavelengths","categorySlug":"wavelengths","director":"Denis Côté","premiere":"North American Premiere","cast":"Larissa Corriveau, Philippe Rebbot, Xavier Bergeron, Gabrielle Lazure, Pierrette Robitaille, Eve Pressault, Amélie Dallaire, Christian Lapointe","image":"https://images.ctfassets.net/22n7d68fswlw/6Fe6UwG260Zrr60ypYFmjz/4f8d3bf557ec9c35dbe75160935f32b3/Nobody-s-Violence_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6Fe6UwG260Zrr60ypYFmjz/4f8d3bf557ec9c35dbe75160935f32b3/Nobody-s-Violence_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Larissa Corriveau delivers a striking performance as an enigmatic death-dealer in this bold, bracing, and Buñuelian feature by Denis Côté.","synopsis":"It also boasts an exceptionally striking lead performance by Larissa Corriveau, the actor whose previous collaborations with the director include Mademoiselle Kenopsia (TIFF ‘23). Corriveau stars as Mira, an enigmatic and largely silent young woman who works for an equally mysterious organization that facilitates requests for euthanasia. Seemingly stone-hearted as she travels from client to client in the film’s eerie dystopian society, Mira nevertheless comes to question her mission after encounters with two unconventional men: Pierric (Xavier Bergeron), a free spirit she meets at a wintry outdoor rave party, and Ludo (Philippe Rebbot), her charismatic and hedonistic boss.","screenings":[{"Title":"Nobody\u0027s Violence","Director":"Denis Côté","Blurb":"","Category":"Wavelengths","Date":"Thu Sep 10","StartTime":"18:25","EndTime":"20:23","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Nobody\u0027s Violence","Director":"Denis Côté","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 11","StartTime":"21:30","EndTime":"23:58","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Nobody\u0027s Violence","Director":"Denis Côté","Blurb":"","Category":"Wavelengths","Date":"Sun Sep 13","StartTime":"15:15","EndTime":"17:43","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Nobody\u0027s Violence","Director":"Denis Côté","Blurb":"","Category":"Wavelengths","Date":"Sat Sep 19","StartTime":"11:00","EndTime":"13:28","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Once Upon a Time in Harlem","slug":"once-upon-a-time-in-harlem","category":"Wavelengths","categorySlug":"wavelengths","director":"William Greaves, David Greaves","premiere":"Canadian Premiere","cast":"Arna Bontemps, Ida Mae Cullen, James Van Der Zee, Richard Bruce Nugent, Aaron Douglas, Ernest Crichlow, Romare Bearden, Noble Sissle, Leigh Whipper, Richard B. Moore, Louise Thompson Patterson","image":"https://images.ctfassets.net/22n7d68fswlw/4GgPIUBmDbICjx503C9EdL/b853df8245a05da3be104265b3b50d66/Once-Upon-a-Time-in-Harlem_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4GgPIUBmDbICjx503C9EdL/b853df8245a05da3be104265b3b50d66/Once-Upon-a-Time-in-Harlem_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Conceived in 1972 by legendary filmmaker William Greaves and completed 50 years later by his son David, \u003cem\u003eOnce Upon a Time in Harlem\u003c/em\u003e is an essential work of living archive, documenting a lively gathering of luminaries from the Harlem Renaissance during a cocktail party at Duke Ellington’s home.","synopsis":"A towering constellation of artists, poets, painters, musicians, scholars, and other notables appear throughout — among them Aaron Douglas, Arna Bontemps, Richard Bruce Nugent, James Van Der Zee, and Countee Cullen’s widow, Ida Mae Cullen. Free from any institutionalized gaze and structure, they congregate around a large punch bowl to drink, reminisce, banter, and passionately debate their legacy. The conversations we’re privy to flow naturally and candidly, marked variously by humour, fervour, reflexive insight, and not a bit of melancholy, as they take stock of their achievements in their older age.","screenings":[{"Title":"Once Upon a Time in Harlem","Director":"William Greaves, David Greaves","Blurb":"","Category":"Wavelengths","Date":"Mon Sep 14","StartTime":"16:10","EndTime":"17:50","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Once Upon a Time in Harlem","Director":"William Greaves, David Greaves","Blurb":"","Category":"Wavelengths","Date":"Tue Sep 15","StartTime":"18:20","EndTime":"20:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Once Upon a Time in Harlem","Director":"William Greaves, David Greaves","Blurb":"","Category":"Wavelengths","Date":"Wed Sep 16","StartTime":"10:00","EndTime":"12:10","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Remotes","slug":"the-remotes","category":"Wavelengths","categorySlug":"wavelengths","director":"John Torres","premiere":"World Premiere","cast":"Alchris Galura, Gabby Padilla, Julia Richards, Enchong Dee","image":"https://images.ctfassets.net/22n7d68fswlw/2h6B1c7tOUFeTySC2bGCW1/33c6c78461c2d6a1260896d2be779511/The-Remotes_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2h6B1c7tOUFeTySC2bGCW1/33c6c78461c2d6a1260896d2be779511/The-Remotes_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"This ambitious, beguiling narrative debut from acclaimed Filipino filmmaker and experimentalist John Torres follows a grieving detective who finds himself increasingly ensnared while investigating a case involving a sinister navigation app causing physical and psychological debris.","synopsis":"Largely taking place after dark and replete with sinuous, hypnotic night drives, the film captures the spectral neon regions just beyond Manil e nature of abodes, both fixed and temporary, and the limit of refuge.","synopsis":"A coda to his 2024 Festival selection Being John Smith and a rumination-in-miniature, Two Pids is English avant-garde legend John Smith’s reflection on the fleeting roles we play and the temporary places we occupy. In the elegant, dreamlike After Image , local filmmaker Rita Ferrando similarly considers her family’s history of migration from Argentina to Canada by way of archival fragments and a conversation across time with her artist grandfather.","screenings":[{"Title":"Wavelengths 1: House and Home","Director":"","Blurb":"","Category":"Wavelengths","Date":"Fri Sep 11","StartTime":"14:30","EndTime":"16:21","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Wavelengths 2: This Suffocating Now","slug":"wavelengths-2-this-suffocating-now","category":"Wavelengths","categorySlug":"wavelengths","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/53A8qHU7mpJRvLGmLNvdjh/dfe248c0fbee632d81674e044a291fbc/Fire-Flies_Still_PROGRAMME-HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/53A8qHU7mpJRvLGmLNvdjh/dfe248c0fbee632d81674e044a291fbc/Fire-Flies_Still_PROGRAMME-HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Featuring new films by Maryam Tafakory, Zheng Lu Xinyuan, Simon Liu, and Vika Kirchenbauer, alongside a rediscovered and restored short by Takehisa Kosugi, the films in this programme speak to the political potential of creative work, creative scenes, and companionship.","synopsis":"In TM , a newly rediscovered 8mm gem by legendary Fluxus artist and composer Takehisa Kosugi, the skies and trees in a Tokyo park are filmed through playful, lyrical in-camera effects. Effectively unseen since 1974, this new restoration by Collaborative Cataloging Japan reveals Kosugi as an unsung polymath who regrettably never pursued the form further.","screenings":[{"Title":"Wavelengths 2: This Suffocating Now","Director":"","Blurb":"","Category":"Wavelengths","Date":"Sat Sep 12","StartTime":"16:15","EndTime":"17:55","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Wavelengths 3: Time and Tide","slug":"wavelengths-3-time-and-tide","category":"Wavelengths","categorySlug":"wavelengths","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/2fVEOysJOnrvztIQySgY7n/e0a0804577b6c56fa2ca9c7133171d94/Forever-Forever_Still_PROGRAMME-HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2fVEOysJOnrvztIQySgY7n/e0a0804577b6c56fa2ca9c7133171d94/Forever-Forever_Still_PROGRAMME-HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Featuring new work by James Richards and Ben Russell, a rare 70mm projection by Johann Lurf, and a tribute to the recently departed Yervant Gianikian, the films of Time and Tide bend eras, epochs, and the cosmos with both verve and grace.","synopsis":"Shot on 65mm film using a self-constructed camera and projected on a 70mm print, Forever…Forever by Austrian experimentalist Johann Lurf captures a year of days, nights, passing clouds, and flowing water. Dedicated at once to the artist’s late father and newborn son, the film rises above formalism to offer a deeply felt reflection on time as fleeting and eternal. Perspective and permanence also inform Ben Russell’s playful La Prospettiva (1653) , filmed in the Colonnade at the Palazzo Spada in Rome, capturing the central composition of the Baroque illusionism masterpiece but also modest moments of the labour  dedicated to its upkeep.","screenings":[{"Title":"Wavelengths 3: Time and Tide","Director":"","Blurb":"","Category":"Wavelengths","Date":"Tue Sep 15","StartTime":"12:00","EndTime":"13:42","Venue":"TIFF Ligh function fmt12(t){ var p=String(t).split(":"); var h=parseInt(p[0],10); var m=p[1]; var ap=h>=12?"pm":"am"; h=h%12||12; return h+":"+m+ap; }

// ---------- lazy images ----------
function bindLazy(root){
  var imgs = root.querySelectorAll("img[data-src]");
  if(!("IntersectionObserver" in window)){
    imgs.forEach(function(im){ im.src = im.dataset.src; im.onload=function(){im.classList.add("loaded");}; });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var im = e.target;
        im.src = im.dataset.src;
        im.onload = function(){ im.classList.add("loaded"); };
        io.unobserve(im);
      }
    });
  }, {rootMargin:"200px"});
  imgs.forEach(function(im){ io.observe(im); });
}

// ---------- planning (shared timetable engine) ----------
function parseDateNum(d){
  var m = String(d).match(/[A-Za-z]+\s+([A-Za-z]+)\s+(\d+)/);
  if(!m) return 9999;
  var mo = MONTHS[m[1]]||"09";
  return parseInt(mo+m[2].padStart(2,"0"),10);
}
function dowShort(d){ var m=String(d).match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)/); return m?m[1]:""; }

var MOBILE = typeof window.matchMedia === "function" && window.matchMedia("(max-width:720px)").matches;

  "Scotiabank Theatre Toronto": "#f59331",
  "TIFF Lightbox": "#3ec97f",
  "John Bassett Theatre": "#f7c948"
};
function venueColor(v){ return VENUE_COLORS[v] || "#8a8fb0"; }
function venueShort(v){ return String(v).replace("Scotiabank Theatre Toronto","Scotiabank").replace("VISA Screening Room at the Princess of Wales Theatre","Princess of Wales").replace("TIFF Lightbox","Lightbox").replace("Royal Alexandra Theatre","Royal Alex").replace("Roy Thomson Hall","Roy Thomson").replace("John Bassett Theatre","Bassett"); }

// all public screenings of picks → [{film,s}]
function pickEvents(){
  var chosen = FILMS.filter(f => picks.has(f.slug));
  var events = [];
  chosen.forEach(function(f){ publicScreenings(f).forEach(function(s){ events.push({film:f, s:s}); }); });
  return events;
}
// all public screenings of every film
function allEvents(){
  var events = [];
  FILMS.forEach(function(f){ publicScreenings(f).forEach(function(s){ events.push({film:f, s:s}); }); });
  return events;
}

function buildDays(events){
  var map = {};
  events.forEach(function(ev){ var k = parseDateNum(ev.s.Date); if(!map[k]) map[k] = ev.s.Date; });
  var ks = Object.keys(map).sort(function(a,b){ return a<b?-1:1; });
  return ks.map(function(k){ return {num:k, label:map[k]}; });
}
function buildVenues(events){
  var set = {};
  events.forEach(function(ev){ set[ev.s.Venue] = 1; });
  return Object.keys(set).sort();
}
function dayEvents(events, k){ return events.filter(function(ev){ return parseDateNum(ev.s.Date)===parseInt(k,10); }); }
function applyVenue(events, venue){ return venue==="all" ? events : events.filter(function(ev){ return ev.s.Venue===venue; }); }

function activeConflicts(evs){
  var flagged = new Set();
  for(var i=0;i<evs.length;i++){
    for(var j=i+1;j<evs.length;j++){
      var a=evs[i], b=evs[j];
      if(a.film.slug===b.film.slug) continue;
      var as=timeMin(a.s.StartTime), ae=timeMin(a.s.EndTime);
      var bs=timeMin(b.s.StartTime), be=timeMin(b.s.EndTime);
      if(ae<=as) ae+=1440;
      if(be<=bs) be+=1440;
      if(as<be && bs<ae){ flagged.add(a.film.slug); flagged.add(b.film.slug); }
    }
  }
  return flagged;
}
