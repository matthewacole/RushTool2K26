-Night_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eNaomi Watts, Sarah Paulson, and Odessa A’zion deliver powerhouse performances in Cody Fern’s sensational feature debut, where a hardened movie star reunites with the deliciously messy family she left behind decades earlier.\u003c/p\u003e","synopsis":"Actor Cody Fern ( American Horror Story , The Great Darkened Days , TIFF ’18) makes a sensational directorial debut with this sharp, emotionally astute story about family bonds and buried truths. When an internationally renowned movie star (Sarah Paulson) invites her estranged family to the opening night of her Broadway play after decades of silence, old wounds resurface almost as quickly as old habits. Her emotionally fragile sister (Naomi Watts, The Friend , TIFF ’24) remains determined to hold onto a lifetime of resentment, while her nephew (Toby Wallace, Finestkind , TIFF ’23) sees an opportunity to forge a relationship with his famous aunt.","screenings":[{"Title":"Closing Night","Director":"Cody Fern","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"14:45","EndTime":"17:10","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Closing Night","Director":"Cody Fern","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"08:50","EndTime":"10:45","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Closing Night","Director":"Cody Fern","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"14:45","EndTime":"17:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0"  director captures here all make Coward a film to be treasured.","screenings":[{"Title":"Coward","Director":"Lukas Dhont","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"08:30","EndTime":"10:35","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Coward","Director":"Lukas Dhont","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"17:45","EndTime":"20:20","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Coward","Director":"Lukas Dhont","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"17:45","EndTime":"20:20","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Debut","slug":"the-debut","category":"Special Presentations","categorySlug":"special-presentations","director":"Jesse Eisenberg","premiere":"International Premiere","cast":"Julianne Moore, Paul Giamatti, Halle Bailey, Jesse Eisenberg, Cara Buono, Craig Bierko, Eldar Isgandarov, Bernadette Peters","image":"https://images.ctfassets.net/22n7d68fswlw/2wpEesFSp2fr9ppKXjB2do/8d35856850f55a2f71f987e6d8070687/The-Debut_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2wpEesFSp2fr9ppKXjB2do/8d35856850f55a2f71f987e6d8070687/The-Debut_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Jesse Eisenberg directs Academy Award winner Julianne Moore and Paul Giamatti in a dark comedy about a bored suburban housewife who finds purpose acting in community theatre.","synopsis":"Moore is tremendous as Mona, mirroring the depth and devotion Mona gives to the character she is portraying. Brilliantly riffing on the Constantin Stanislavski chestnut that “there are no small parts, only small actors,” The Debut examines just what that maxim looks like when taken to the extreme.","screenings":[{"Title":"The Debut","Director":"Jesse Eisenberg","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"18:15","EndTime":"20:30","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"The Debut","Director":"Jesse Eisenberg","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"18:30","EndTime":"20:15","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Debut","Director":"Jesse Eisenberg","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"20:45","EndTime":"23:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Debut","Director":"Jesse Eisenberg","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"14:00","EndTime":"16:15","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Elsinore","slug":"elsinore","category":"Special Presentations","categorySlug":"special-presentations","director":"Simon Stone","premiere":"Canadian Premiere","cast":"Andrew Scott, Olivia Colman, Billie Piper, Peter Mullan, Paul Chahidi, Johnny Flynn","image":"https://images.ctfassets.net/22n7d68fswlw/2eap3k3ZAC58Y5sQBwF2NA/96aeab21f0a0a328946864d4260147a1/ELSINORE_STILL_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2eap3k3ZAC58Y5sQBwF2NA/96aeab21f0a0a328946864d4260147a1/ELSINORE_STILL_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Andrew Scott (TIFF ’25’s \u003cem\u003eBlue Moon\u003c/em\u003e and \u003cem\u003eWake Up Dead Man\u003c/em\u003e) delivers his strongest performance honouring the real-life story of Ian Charleson, the \u003cem\u003eChariots of Fire\u003c/em\u003e actor who courageously pushed through AIDS to play Hamlet at London’s National Theatre.","synopsis":"Ian Charleson is widely known as the real-life star of TIFF ’81’s Chariots of Fire , the first People’s Choice Award winner to receive the Oscar for Best Picture. Its piano-led ubiquity in pop culture follows the Scottish actor everywhere, making him yearn less for Hollywood and more for his theatre roots. When Daniel Day-Lewis walks off stage as Hamlet at London’s National Theatre, the role of a lifetime appears for Charleson — but so does an AIDS diagnosis. Dream and nightmare collide as Charleson strives to command the stage and survive as long as possible.","screenings":[{"Title":"Elsinore","Director":"Simon Stone","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"18:30","EndTime":"20:14","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elsinore","Director":"Simon Stone","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"12:00","EndTime":"14:14","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elsinore","Director":"Simon Stone","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"18:30","EndTime":"20:44","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elsinore","Director":"Simon Stone","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"13:00","EndTime":"15:14","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elsinore","Director":"Simon Stone","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 20","StartTime":"16:00","EndTime":"18:14","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Everest: The Other Side","slug":"everest-the-other-side","category":"Special Presentations","categorySlug":"special-presentations","director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","premiere":"Canadian Premiere","cast":"Jim Morrison, Hilaree Nelson","image":"https://images.ctfassets.net/22n7d68fswlw/1ARijkq0lXWUad6tYMBE7h/8e56ff49dbd79adde21b64d39549dbcd/Everest-The-Other-Side_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1ARijkq0lXWUad6tYMBE7h/8e56ff49dbd79adde21b64d39549dbcd/Everest-The-Other-Side_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Professional ski mountaineers Jim Morrison and Hilaree Nelson seek to ski down the North Face of Mount Everest, a feat never achieved, as the Oscar-winning filmmakers Elizabeth Chai Vasarhelyi and Jimmy Chin (\u003cem\u003eFree Solo\u003c/em\u003e, TIFF ’18) follow their journey, shooting for the IMAX screen.","synopsis":"What’s undeniable is the determination shared by Morrison and Nelson. They gained recognition separately for their outdoor adventuring, then came together each having been in a prior marriage. As they both approach age 50, they’ve already set records and are well acquainted with tragedy. Their goal for the North Face will require many exhausting days of climbing, followed by a descent on skis that will take several hours. One false move is the difference between mortality and immortality. The film is its own achievement of spectacle and emotion in capturing what took place.","screenings":[{"Title":"Everest: The Other Side","Director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"10:00","EndTime":"11:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everest: The Other Side","Director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"19:30","EndTime":"21:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everest: The Other Side","Director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"19:30","EndTime":"21:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everest: The Other Side","Director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"19:30","EndTime":"21:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everest: The Other Side","Director":"Jimmy Chin, Elizabeth Chai Vasarhelyi","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"14:15","EndTime":"16:40","Venue":"Scotiabank Theatre Toronto","Room":"Sc res both the unimaginable weight of grief and the fragile hope that can survive even our darkest moments. Known for his powerful portraits of ordinary lives under extraordinary pressure, Williams brings a new tenderness to Faith , blending grounded realism with subtle touches that expand the emotional world of the film. Doherty delivers a staggering performance, palpably capturing love, despair, and resilience while McAvoy commands a character whose true motivations remain elusive.","screenings":[{"Title":"Faith","Director":"Paul Andrew Williams","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"14:15","EndTime":"16:34","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Faith","Director":"Paul Andrew Williams","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"08:30","EndTime":"10:19","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Faith","Director":"Paul Andrew Williams","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"11:20","EndTime":"13:39","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Faith","Director":"Paul Andrew Williams","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"12:25","EndTime":"14:44","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Le Faux Soir","slug":"le-faux-soir","category":"Special Presentations","categorySlug":"special-presentations","director":"Michaël R. Roskam","premiere":"World Premiere","cast":"Arieh Worthalter, Mélanie Thierry, Karim Leklou, Mara Taquin, Bouli Lanners, Julien Frison, François Damiens","image":"https://images.ctfassets.net/22n7d68fswlw/57xYrLtm0uPEV6Zyr8VztW/1b2678656f1309f4e49057c981aca9fc/Le-Faux-Soir-01?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/57xYrLtm0uPEV6Zyr8VztW/1b2678656f1309f4e49057c981aca9fc/Le-Faux-Soir-01?w=1280\u0026h=720\u0026fit=thumb","blurb":"Inspired by a fact-based act of subversive irreverence in Nazi-occupied Brussels, Michaël R. Roskam’s thriller delivers a historical drama that feels more like a heist movie.","synopsis":"Inspired by the true story of a uniquely daring operation in Brussels in November of 1943, Le Faux Soir follows a group of resistance fighters as they proceed step-by-step through a scheme that the Nazis in charge most definitely did not see coming. These crafty conspirators’ goal: to turn the Germans’ propaganda tools against them by printing and distributing a spoof edition of the newspaper Le Soir .","screenings":[{"Title":"Le Faux Soir","Director":"Michaël R. Roskam","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"11:00","EndTime":"13:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Le Faux Soir","Director":"Michaël R. Roskam","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"14:45","EndTime":"17:28","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Le Faux Soir","Director":"Michaël R. Roskam","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"21:10","EndTime":"23:53","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0", arcelo Subiotto, Esteban Bigliardi, Manu Fanego, Alan Sabbagh, Esteban Lamothe, Joaquin Bonadeo","image":"https://images.ctfassets.net/22n7d68fswlw/3REeTJsB8LLc7wDUe9NwGq/5d2efe7e07f1313c9b1c2d013b8510dd/Glaxo.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3REeTJsB8LLc7wDUe9NwGq/5d2efe7e07f1313c9b1c2d013b8510dd/Glaxo.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eGlaxo\u003c/em\u003e, Benjamín Naishtat’s riveting adaptation of Hernán Ronsino’s novel, transforms a single betrayal into an absorbing tale of guilt, loyalty, and memory, weaving personal tragedy with Argentina’s turbulent twentieth-century history through an atmosphere of mounting mystery and suspense.","synopsis":"Flaco is sent to prison, framed for a crime he did not commit by Ramón Folcada, an ex-policeman with a violent past. The injustice stems from a lie told by Miguelito, who falsely identified Flaco as the lover of Folcada’s wife. In return, Folcada helps him avoid military service and secures him a coveted position at Glaxo, the town’s only factory.","screenings":[{"Title":"Glaxo","Director":"Benjamín Naishtat","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"17:30","EndTime":"19:47","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Glaxo","Director":"Benjamín Naishtat","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"09:25","EndTime":"11:12","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Glaxo","Director":"Benjamín Naishtat","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"21:30","EndTime":"23:47","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Glaxo","Director":"Benjamín Naishtat","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"18:30","EndTime":"20:47","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"A Good Little Soldier","slug":"a-good-little-soldier","category":"Special Presentations","categorySlug":"special-presentations","director":"Stéphane Brizé","premiere":"North American Premiere","cast":"Alba Rohrwacher, Vincent Lindon","image":"https://images.ctfassets.net/22n7d68fswlw/1WwGwljtzZFFg8DrAfJy51/25bcaaa3bbbcc1ffbcb727b17b57c16b/A-Good-Little-Soldier_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1WwGwljtzZFFg8DrAfJy51/25bcaaa3bbbcc1ffbcb727b17b57c16b/A-Good-Little-Soldier_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"In Stéphane Brizé’s latest capitalist critique, Carla (Alba Rohrwacher) is pushed to her moral limits when she is recruited to rebrand a company’s image, compromising people for profit to serve her corporate supervisors.","synopsis":"Known for his portraits of individuals struggling against capitalism in films such as At War (2018) and The Measure of a Man (2015), Stéphane Brizé continues the tradition of French social realism with a story set within the skyscrapers and glass offices of the corporate world. Carla (Alba Rohrwacher, also at the Festival with A Common Story ) is a high-powered executive in Human Resources with a successful career, having risen the ranks in the private sector by trading time at home with her son for long nights at work. Just recruited to a new position, she’s tasked by her demanding boss Arnaud (Vincent Lindon, Couture , TIFF ’25) with the responsibility of reconciling performance goals and employee well-being with a strategic campaign.","screenings":[{"Title":"A Good Little Soldier","Director":"Stéphane Brizé","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"15:00","EndTime":"16:42","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"A Good Little Soldier","Director":"Stéphane Brizé","Blurb":"","Category":"Special Presentations","Date":"Wed Sep 16","StartTime":"15:00","EndTime":"17:12","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"A Good Little Soldier","Director":"Stéphane Brizé","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"11:50","EndTime":"14:02","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"A Good Little Soldier","Director":"Stéphane Brizé","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"15:45","EndTime":"17:57","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Growth of the Soil","slug":"growth-of-the-soil","category":"Special Presentations","categorySlug":"special-presentations","director":"Hans Petter Moland","premiere":"World Premiere","cast":"Herbert Nordrum, Asta Kamma August, Gard B Eidsvold, Anders Baasmo","image":"https://images.ctfassets.net/22n7d68fswlw/3NCg87TCPEtzuyfIKi0a8J/6298a5401a63f9fca1af43eb7096877a/Growth-of-the-Soil_still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3NCg87TCPEtzuyfIKi0a8J/6298a5401a63f9fca1af43eb7096877a/Growth-of-the-Soil_still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Nobel Prize-winner Knut Hamsun’s novel about a farmer’s struggles in early 20th-century Norway gets a powerful and richly textured adaptation by director Hans Petter Moland and his superb cast.","synopsis":"Sharing the original’s fervently realistic style and reverence for the natural world, Moland’s latest feature opens as the captivating story of one man’s battle with a dauntingly rugged environment. Herbert Nordrum — familiar to Festival audiences for his role in Trier’s The Worst Person in the World (TIFF 2021) — stars as Isak, a solitary man who stubbornly struggles to start a farm in a remote patch of land in northern Norway in the early 20th century. He finds an ally — and eventually a wife — in Inger (Asta Kamma August, also at the Festival in What Lies Between Us ), a woman with her own reasons for being on the edge of their society. They build a life together piece by piece. But the inexorable march of modernity brings changes and challenges of many kinds.","screenings":[{"Title":"Growth of the Soil","Director":"Hans Petter Moland","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"17:15","EndTime":"20:20","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Growth of the Soil","Director":"Hans Petter Moland","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"09:00","EndTime":"11:35","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Growth of the Soil","Director":"Hans Petter Moland","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"12:00","EndTime":"15:05","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Happily Ever After","slug":"happily-ever-after","category":"Special Presentations","categorySlug":"special-presentations","director":"Feng-I Fiona Roan","premiere":"World Premiere","cast":"Shuhua","image":"https://images.ctfassets.net/22n7d68fswlw/1GN00HFE1AuZLJxAgRAr2R/3dd8cd9a53bcb74ef6c5adf407022225/Happily-Ever-After_Still_01.JPG?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1GN00HFE1AuZLJxAgRAr2R/3dd8cd9a53bcb74ef6c5adf407022225/Happily-Ever-After_Still_01.JPG?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eAmerican Girl\u003c/em\u003e director Feng-I Fiona Roan’s sophomore film explores the definition of happiness through the lens of two sisters, backed by breakout performances from Xuan Chen and singer-turned-actress Shu-hua of i-dle.","synopsis":"Kitty (Shu-hua) and Claire (Xuan Chen) are two very different sisters. Kitty, the younger of the two, is the textbook daughter and the mother’s favourite — she’s about to get a promotion and is engaged to a wealthy man. Meanwhile, Claire is far from traditional. She disappoints her parents in both career and love, but is working towards what she wants. One has it all, and one is on her way to freedom, but contrary to what meets the eye, their quest for fulfilment is complicated. When an abandoned cat enters their lives, it becomes the catalyst for unveiling their deep emotional wounds.","screenings":[{"Title":"Happily Ever After","Director":"Feng-I Fiona Roan","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"10:00","EndTime":"11:35","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Happily Ever After","Director":"Feng-I Fiona Roan","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"19:30","EndTime":"21:35","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatr  the woman who did her best to lift him up in spite of himself. Wood and Flynn provide enigmatic and bold performances bringing depth and heartfelt honesty to two people consumed by art but entangled in a chaotic relationship. While Fyodor had more notoriety, this is a fully realized portrait of Anna, who went on to become a powerful figure in her own right.","screenings":[{"Title":"The Idiot(s)","Director":"Michał Englert, Małgorzata Szumowska","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"14:50","EndTime":"16:48","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Idiot(s)","Director":"Michał Englert, Małgorzata Szumowska","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"21:30","EndTime":"23:58","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Idiot(s)","Director":"Michał Englert, Małgorzata Szumowska","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"17:00","EndTime":"19:28","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Idiot(s)","Director":"Michał Englert, Małgorzata Szumowska","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"10:45","EndTime":"13:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"In Alaska","slug":"in-alaska","category":"Special Presentations","categorySlug":"special-presentations","director":"Vinnie Karetak, Jaap van Heusden","premiere":"World Premiere","cast":"Noomi Rapace, Leo Matthew Temela","image":"https://images.ctfassets.net/22n7d68fswlw/X8eYiV5r1VFtmKPWL5YXL/d358a5c47e7fd29a05cd2f733cf1f96e/In-Alaska_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/X8eYiV5r1VFtmKPWL5YXL/d358a5c47e7fd29a05cd2f733cf1f96e/In-Alaska_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"When a suicidal Inuk teen accidentally pierces an oil pipeline with a bullet, the FBI launches a full-scale manhunt across the northern wilderness in this drama starring Noomi Rapace (\u003cem\u003eThe Girl with the Dragon Tattoo\u003c/em\u003e) and newcomer Leo Matthew Temela.","synopsis":"Woody (Leo Matthew Temela, in his first starring role) is a young, depressed Inuk teen whose life is upended by a single, desperate mistake. When his attempt at self-harm fails and an errant bullet pierces the Trans-Alaska Pipeline, there are huge ramifications: he’s suddenly labelled an eco-terrorist and forced to go on the run. Abandoning the small Alaskan village he grew up in, he sets out towards Nunavut, where he has family he doesn’t know but who he hopes will take him in.","screenings":[{"Title":"In Alaska","Director":"Vinnie Karetak, Jaap van Heusden","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"11:45","EndTime":"14:03","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"In Alaska","Director":"Vinnie Karetak, Jaap van Heusden","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"11:30","EndTime":"13:18","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"In Alaska","Director":"Vinnie Karetak, Jaap van Heusden","Blurb":"","Category":"Special Presentations","Date":"Sun enceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Liberation","slug":"the-liberation","category":"Special Presentations","categorySlug":"special-presentations","director":"Guy Nattiv","premiere":"Canadian Premiere","cast":"Carrie Coon, Lily James, Bella Ramsey, Odessa Young, Tracy Letts, Jaime Ray Newman","image":"https://images.ctfassets.net/22n7d68fswlw/5DAcSrUMlUGYodOL6c18oB/7ff11ca1bd0f3ffa86491c943cedfaca/Carrie-Coon-in-The-Liberation_FINAL-Key-Still-courtesy-Bleecker-Street.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5DAcSrUMlUGYodOL6c18oB/7ff11ca1bd0f3ffa86491c943cedfaca/Carrie-Coon-in-The-Liberation_FINAL-Key-Still-courtesy-Bleecker-Street.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Carrie Coon soars in the riveting true story of filmmaker Guy Nattiv’s grandmother, whose humdrum day-to-day life is upended by a mysterious and entrancing young woman (Lily James) offering the promise of escape to something better.","synopsis":"Carrie Coon ( His Three Daughters , TIFF ’23) gives an incredibly powerful performance as Rita, who is based on filmmaker Guy Nattiv’s own grandmother. As Ricki, Lily James ( Swiped , TIFF ’25) embodies cunning and charm. Ricki\u0027s remarkable ability to quickly read the insecurities of potential recruits allows her to exploit their vulnerabilities with unsettling precision. Bella Ramsey ( Catherine Called Birdy , TIFF ’22) and Odessa Young ( Mothering Sunday , TIFF ’21) play Rita’s daughters, who search for their mother and find themselves dangerously entangled in the rituals and delusions of the cult.  The Liberation is a devastating look at how easily seemingly ordinary people can succumb to physical and psychological manipulation when running from grief and anxiety.","screenings":[{"Title":"The Liberation","Director":"Guy Nattiv","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"11:30","EndTime":"13:34","Venue":"Scotia ty":"","Premiere":"","OffSale":"True"},{"Title":"A Long Winter","Director":"Andrew Haigh","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"11:15","EndTime":"13:42","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"Look Back","slug":"look-back","category":"Special Presentations","categorySlug":"special-presentations","director":"Hirokazu Kore-eda","premiere":"North American Premiere","cast":"Natsuki Deguchi, Aju Makita, Furi Nanase, Rokka Okada","image":"https://images.ctfassets.net/22n7d68fswlw/5GVvnbrqZx6D6t2E0yrfxH/efcf578c6fa5471b8ea1409863686f91/Look-Back_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5GVvnbrqZx6D6t2E0yrfxH/efcf578c6fa5471b8ea1409863686f91/Look-Back_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Visionary auteur Hirokazu Kore-eda helms this tender and slow-burning adaptation of manga creator Tatsuki Fujimoto’s acclaimed story, following two young artists whose friendship and bond become the engine of their art.","synopsis":"Fourth-grader Fujino (Furi Nanase) is admired for the comics she makes for her school newspaper. Her world is upended when asked to share the space with her reclusive classmate Kyomoto (Rokka Okada), whose stunning artwork is better than anything she can make. When the girls finally meet, Fujino discovers Kyomoto has been idolizing her from afar all along. Her one-sided rivalry abates, and the two are pulled into an all-consuming love of drawing that carries them into adulthood as aspiring manga artists. The adult Fujino (Natsuki Deguchi) and Kyomoto (Aju Makita) embark on a shared journey where the joys of artistic expression collide with the unpredictability of life.","screenings":[{"Title":"Look Back","Director":"Hirokazu Kore-eda","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 97e39e9e869533877ce/love_of_your_life_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/18lYUQtws3tNCnmKNCsdhh/954b4affabc8697e39e9e869533877ce/love_of_your_life_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eFeaturing a beautifully understated performance from Margaret Qualley (TIFF ’24’s \u003cem\u003eThe Substance\u003c/em\u003e), this sweeping romantic character study from director Rachel Morrison (TIFF ’24’s \u003cem\u003eThe Fire Inside\u003c/em\u003e) is an exhilarating testament to loving fully, making amends, and moving on.\u003c/p\u003e","synopsis":"Maya (Qualley) is a 26-year-old Boston nurse when she falls in love with Charlie ( A House of Dynamite ’s Gabriel Basso). Emotions deepen quickly, the couple marries, but all things fall tragically apart with the onset of the pandemic. Maya abruptly flees her life in the US, severing all her connections — including her best friend Jason (Patrick Schwarzenegger, TIFF ’26’s Bunker ). She becomes a digital nomad in Portugal, where she meets Felix (Aaron Pierre, TIFF ’22’s Brother ), who revives her capacity for intimacy and prompts a move to England. But can any amount of transformation or new beginnings stave off the ghosts Maya seems determined to run from?","screenings":[{"Title":"Love of Your Life","Director":"Rachel Morrison","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"20:30","EndTime":"22:46","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Love of Your Life","Director":"Rachel Morrison","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"09:30","EndTime":"11:16","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Love of You 68fswlw/1gD1cPiyHLlkG5xopN8UDV/4e0b39a3e2556446ffa28b66134d6c29/Minotaur_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1gD1cPiyHLlkG5xopN8UDV/4e0b39a3e2556446ffa28b66134d6c29/Minotaur_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"After a nine-year hiatus, during which he fled his native Russia into exile, Andrey Zvyagintsev (\u003cem\u003eThe Return\u003c/em\u003e, TIFF ’03, \u003cem\u003eLeviathan\u003c/em\u003e, TIFF ’14) returns with a reworking of Claude Chabrol\u0027s \u003cem\u003eLa femme infidèle\u003c/em\u003e, adapted to his homeland\u0027s current rhetoric of patriarchy and warmongering.","synopsis":"Director Andrey Zvyagintsev ( The Return , TIFF ’03; Leviathan, TIFF ’14; Loveless , TIFF ’17), is back in full form, reuniting with cinematographer Mikhail Krichman for his sixth feature, based on Claude Chabrol’s 1969 classic La femme infidèle ( The Unfaithful Wife) . When the film won the Grand Prix at the Cannes Film Festival, Zvyagintsev used his acceptance speech to issue a direct, personal plea to President Vladimir Putin to bring the war on Ukraine to an end.","screenings":[{"Title":"Minotaur","Director":"Andrey Zvyagintsev","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"14:00","EndTime":"16:21","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Minotaur","Director":"Andrey Zvyagintsev","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"16:45","EndTime":"19:36","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Minotaur","Director":"Andrey Zvyagintsev","Blurb":"","Category":"Special Presentations","Date":"Wed Sep 16","StartTime":"18:15","EndTime":"21:06","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Mr. Nelson, Did You Kill People?","slug":"mr-nelson-did-you-kill-people","category":"Special Presentations","categorySlug":"special-presentations","director":"Shinya Tsukamoto","premiere":"North American Premiere","cast":"Rodney Hicks, Geoffrey Rush, Mark Merphy, Tatyana Ali, Lily Franky","image":"https://images.ctfassets.net/22n7d68fswlw/6XnecCCLBz38mFPRCv7L5s/0f9d71f3fb4a8848e1e8ffeef823748c/Mr-Nelson-Did-You-Kill-People_Still_Hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6XnecCCLBz38mFPRCv7L5s/0f9d71f3fb4a8848e1e8ffeef823748c/Mr-Nelson-Did-You-Kill-People_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Cult Japanese filmmaker Shinya Tsukamoto directs acclaimed Broadway actor Rodney Hicks and Oscar winner Geoffrey Rush in a harrowing, visceral, and morally urgent portrait of Vietnam veteran Allen Nelson.","synopsis":"Years in the making, the film recounts the experiences of Vietnam War veteran Allen Nelson (Rodney Hicks, with newcomer Mark Merphy portraying the younger Allen). Born into poverty in Brooklyn, Nelson joins the Marines at eighteen and is sent to Vietnam. Combat destroys his belief in military heroism and leaves him profoundly traumatized. Decades later, after losing his family and becoming homeless, he is forced to confront the memories he has tried to suppress, aided by a Veterans Affairs psychologist and challenged by a child’s devastating question: “Mr. Nelson, did you kill people?”","screenings":[{"Title":"Mr. Nelson, Did You Kill People?","Director":"Shinya Tsukamoto","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"18:10","EndTime":"20:06","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDiff gful to listen in on the conversations — musical and otherwise — that fill co-directors Scot McFadyen and Sam Dunn’s note-perfect documentary about Peart and his surviving bandmates’ celebration of their friend’s life, legacy, and artistry. In exhilarating performance sequences, Geddy Lee and Alex Lifeson revisit some of Rush’s greatest songs with Peart’s chair filled by four of his musical “brothers”: The Police’s Stewart Copeland, Tool’s Danny Carey, Chad Smith of the Red Hot Chili Peppers, and Gavin Harrison of Porcupine Tree and King Crimson.","screenings":[{"Title":"Neil Peart: No One\u0027s Disciple","Director":"Sam Dunn, Scot McFadyen","Blurb":"","Category":"Special Presentations","Date":"Wed Sep 16","StartTime":"21:30","EndTime":"23:46","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Neil Peart: No One\u0027s Disciple","Director":"Sam Dunn, Scot McFadyen","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"09:00","EndTime":"10:46","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Neil Peart: No One\u0027s Disciple","Director":"Sam Dunn, Scot McFadyen","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"21:00","EndTime":"23:16","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Paradise Lost","slug":"paradise-lost","category":"Special Presentations","categorySlug":"special-presentations","director":"Yeon Sang-ho","premiere":"World Premiere","cast":"Kim Hyun-joo, Bae Hyeon-seong","image":"https://images.ctfassets.net/22n7d68fswlw/A2Tnel4k0TxDWCKaHJ73Y/0ba0d25bef43c2e6278151335d64be43/Paradise-Lost_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/A2Tnel4k0TxDWCKaHJ73Y/0ba0d25bef43c2e6278151335d64be43/Paradise-Lost_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"A bus full of children mysteriously vanishes. When an altered version of a grieving mother’s son returns years later, she must grapple with the technologically revised reality she has created in this sharp thriller from Yeon Sang-ho.","synopsis":"A new technology company offers unusual comfort with augmented reality glasses able to create a near-lifelike version of the missing children, giving grieving parents simulated interactions with those they lost. But living with angelic memories of Ryu’s son conjured by the glasses are disrupted by strange new events linked to the bus tragedy. The artificial reality she created is shattered with the arrival of disturbing truths about her real son.","screenings":[{"Title":"Paradise Lost","Director":"Yeon Sang-ho","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"17:30","EndTime":"19:41","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Paradise Lost","Director":"Yeon Sang-ho","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"08:50","EndTime":"10:31","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Paradise Lost","Director":"Yeon Sang-ho","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"14:45","EndTime":"16:56","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Paradise Lost","Director":"Yeon Sang-ho","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"18:20","EndTime":"20:31","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Paradise Lost","Director":"Yeon Sang-ho","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"21:45","EndTime":"23:56","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Phoolan","slug":"phoolan","category":"Special Presentations","categorySlug":"special-presentations","director":"Richie Mehta","premiere":"World Premiere","cast":"Sneha Kumari, Anurag Thakur, Vikram Pratap Singh, Aakash Dahiya, Prateek Pachouri, Devdutt Banodiya","image":"https://images.ctfassets.net/22n7d68fswlw/1nXIXb9LtGslpGj2b2GXjH/351fc05f4271d0060f88dd701a4a90c0/Phoolan_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1nXIXb9LtGslpGj2b2GXjH/351fc05f4271d0060f88dd701a4a90c0/Phoolan_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"In the heartland of India, a young Phoolan Devi becomes one of the most famous outlaws in Indian history and the target of 2,000 heavily armed men sent to kill her over a gruelling 48-hour siege.","synopsis":"Mehta ( Amal , TIFF ’07) brings his restrained and realistic true-crime sensibilities from Delhi Crime to this biopic, heavily inspired by her 1996 autobiography, I, Phoolan Devi: The Autobiography of India’s Bandit Queen . In the book, Devi recounts the trauma of her child marriage, the caste discrimination she experienced, and her journey to becoming the Bandit Queen. Devi eventually surrendered, served a prison sentence, and ultimately grew to political power as a Member of Parliament before she was assassinated in 2001. Those familiar with her life story will appreciate this immersive, taut thriller that highlights her moment of becoming.","screenings":[{"Title":"Phoolan","Director":"Richie Mehta","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"10:45","EndTime":"12:38","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Phoolan","Director":"Richie Mehta","Blurb":"","Category":"Special Presentations","Date":"Wed Sep 16","StartTime":"18:00","EndTime":"20:23","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Phoolan","Director":"Richie Mehta","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"12:15","EndTime":"14:38","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Phoolan","Director":"Richie Mehta","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"14:30","EndTime":"16:53","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Possible Love","slug":"possible-love","category":"Special Presentations","categorySlug":"special-presentations","director":"Lee Chang-dong","premiere":"North American Premiere","cast":"Jeon Do-yeon, Sul Kyung-gu, Zo In-sung, Cho Yeo-jeong","image":"https://images.ctfassets.net/22n7d68fswlw/4JvatG3QQGurncEmOjqQ5y/385749668d9ad16c8b5ea064fb5a86e0/PossibleLove_Still.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4JvatG3QQGurncEmOjqQ5y/385749668d9ad16c8b5ea064fb5a86e0/PossibleLove_Still.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Lee Chang-dong’s eagerly anticipated new film brings stories of relationships, generational and class divides, in this gripping tale of two couples playing games with themselves and one another.","synopsis":"Award-winning filmmaker Lee Chang-dong’s (TIFF ’02’s Oasis , TIFF ’10’s Poetry , TIFF ’18’s Burning ) heavily anticipated new film is a tale of deep yearning, envy, and grief. Every couple wants to find some sense of happiness. For Ho-seok (Sul Kyung-gu, Good New s. TIFF ’25) and Mi-ok (Jeon Do-yeon, Good New s. TIFF ’25) the hope is to move on from the trauma caused by the disastrous outcome of a labour dispute. When they are approached by young, ambitious documentary filmmaker Ye-ji (Cho Yeo-jeong, Parasite , TIFF ’19) to take part in her latest project, they become intimately intertwined with her and her business mogul husband, Sang-woo (Zo In-sung, Smugglers , TIFF ’23).","screenings":[{"Title":"Possible Love","Director":"Lee Chang-dong","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"18:00","EndTime":"21:14","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Possible Love","Director":"Lee Chang-dong","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"11:15","EndTime":"14:29","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Possible Love","Director":"Lee Chang-dong","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"18:15","EndTime":"20:59","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Possible Love","Director":"Le d carefully constructed identities slowly begin to fall away.","screenings":[{"Title":"The Road Not Taken","Director":"Peter Ho-Sun Chan","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"09:15","EndTime":"11:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Road Not Taken","Director":"Peter Ho-Sun Chan","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"18:00","EndTime":"20:45","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Road Not Taken","Director":"Peter Ho-Sun Chan","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"15:15","EndTime":"18:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Road Not Taken","Director":"Peter Ho-Sun Chan","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 20","StartTime":"19:45","EndTime":"22:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Stunt Driver","slug":"the-stunt-driver","category":"Special Presentations","categorySlug":"special-presentations","director":"Michael Dowse","premiere":"World Premiere","cast":"Jay Baruchel, Ed Helms, Laurence Leboeuf, Ben Foster, Dan Bakkedahl, Joe Cobden, Marc Beaupré","image":"https://images.ctfassets.net/22n7d68fswlw/5cXwtVVYPC1MCIfKmOk5E5/b6012bed40cc0cb2101da1ee47bb7107/The-Stunt-Driver_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5cXwtVVYPC1MCIfKmOk5E5/b6012bed40cc0cb2101da1ee47bb7107/The-Stunt-Driver_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eJay Baruchel and director Michael Dowse re-team for a raucous yet heartfelt comedy about a Canadian stuntman who dared to dream big and fly (very) high.\u003c/p\u003e","synopsis":"Powered by Jay Baruchel’s all-out performance as the man behind the wheel, Michael Dowse’s endearingly scrappy comedy honours its inspiration by portraying all the steps and missteps over the course of Carter’s years-long quest. The fact that The Stunt Driver frequently matches the anarchic energy of Baruchel and Dowse’s previous teaming on Goon (TIFF ’11) is no surprise. What’s more unexpected is the poignancy that the actor brings to his take on a man whose displays of bravado conceal a welter of fears and insecurities. It’s easy to see why he relies on steadfast allies like his wife Gloria (Laurence Leboeuf) and his car designer and technician Dick Keller (Ed Helms) — and why he’s so easily undermined by the machinations of his American nemesis, the legendary Evel Knievel (Ben Foster).","screenings":[{"Title":"The Stunt Driver","Director":"Michael Dowse","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"14:15","EndTime":"15:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 12","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Stunt Driver","Director":"Michael Dowse","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"20:45","EndTime":"22:54","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Stunt Driver","Director":"Michael Dowse","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"21:55","EndTime":"00:04","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Stunt Driver","Director":"Michael Dowse","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"15:10","EndTime":"16:49","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Tender Loving Care","slug":"tender-loving-care","category":"Special Presentations","categorySlug":"special-presentations","director":"Mike Leigh","premiere":"Canadian Premiere","cast":"Marion Bailey, Paul Jesson, Kate O\u0026#39;Flynn, Alice Bailey Johnson","image":"https://images.ctfassets.net/22n7d68fswlw/LZwi8txvEUEmoXeJCEZUR/2c13be5d6d120feccca4f77124807f4d/tender_loving_care_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/LZwi8txvEUEmoXeJCEZUR/2c13be5d6d120feccca4f77124807f4d/tender_loving_care_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Seven-time Academy Award nominee Mike Leigh returns with an uplifting story of family and how to deal with grief, featuring remarkably emotional performances from Kate O’Flynn and Alice Bailey Johnson.","synopsis":"Academy award nominated writer-director and Palme d’Or and BAFTA winner Mike Leigh ( Mr. Turner , TIFF ’14; Hard Truths, TIFF ’24) returns to the Festival with another astute portrait of ordinary lives, examining the complexities of aging, family, and learning to embrace life’s inevitable changes. Amy (Kate O’Flynn, Widow’s Bay ) is a devoted social service worker who puts her heart and soul into her job to care for those in need. At home, however, she finds herself confronting new challenges as her beloved father begins to show the early signs of dementia, and she and her mother must begin to make peace with their new reality. Through it all, Amy finds comfort, perspective, and plenty of laughter through sips of wine with her lifelong friend Rosie (Alice Bailey Johnson), whose warmth and wit become a vital anchor as both women navigate the shifting rhythms of approaching middle age.","screenings":[{"Title":"Tender Loving Care","Director":"Mike Leigh","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"08:40","EndTime":"10:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Tender Loving Care","Director":"Mike Leigh","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"11:30","EndTime":"13:47","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"Tender Loving Care","Director":"Mike Leigh","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"12:00","EndTime":"14:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Tender Loving Care","Director":"Mike Leigh","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"15:00","EndTime":"17:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Unknown","slug":"the-unknown","category":"Special Presentations","categorySlug":"special-presentations","director":"Arthur Harari","premiere":"Canadian Premiere","cast":"Léa Seydoux, Niels Schneider, Victoire Du Bois","image":"https://images.ctfassets.net/22n7d68fswlw/6iHzYgv2C1dkKcrI5ZUVAF/6a8ea86a8b2795cf248218a82253139c/The-Unknown_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6iHzYgv2C1dkKcrI5ZUVAF/6a8ea86a8b2795cf248218a82253139c/The-Unknown_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"A highlight of this year’s Cannes Competition, the third feature by acclaimed French filmmaker, actor, and screenwriter Arthur Harari (co-writer of \u003cem\u003eAnatomy of a Fall\u003c/em\u003e) is a moody, existential body-swap puzzler starring an extraordinary Léa Seydoux and a near-unrecognizable Niels Schneider.","synopsis":"After David (Niels Schneider), a withdrawn photographer, attends a raucous party and tries a mysterious pill, he locks eyes with a woman he vaguely recognizes (Léa Seydoux), leading to a backroom hookup. The next morning’s hangover, however, reveals that he has somehow come to occupy the woman’s body, setting him on a frantic search for answers. He manages to learn that she is a German actor named Eva, and discovers that rather than a traditional swap, a young terrified woman named Malia (Lilith Grasmug) is, in fact, now housed in David’s body. As David/Eva and Malia/David are forced to grapple with the psychological toll of a disembodied existence, the film’s daring narrative grows evermore labyrinthine and unsettling.","screenings":[{"Title":"The Unknown","Director":"Arthur Harari","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"15:15","EndTime":"17:35","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Unknown","Director":"Arthur Harari","Blurb":"","Category":"Special Presentations","Date":"Tue Sep 15","StartTime":"15:15","EndTime":"18:05","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"The Unknown","Director":"Arthur Harari","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 17","StartTime":"19:00","EndTime":"21:50","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"Whatcha Want","slug":"whatcha-want","category":"Special Presentations","categorySlug":"special-presentations","director":"Mina Shum","premiere":"World Premiere","cast":"Isabella Wei, Ming-Na Wen, Tzi Ma, Helen Dang, Russell Lee, Hugh Tran","image":"https://images.ctfassets.net/22n7d68fswlw/2QJwG0xeQGcV3E3PvS9hu9/dd32eb54cb30ce3a4664f9675177da10/Whatcha-Want_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2QJwG0xeQGcV3E3PvS9hu9/dd32eb54cb30ce3a4664f9675177da10/Whatcha-Want_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"The latest comedy from writer-director Mina Shum (\u003cem\u003eDouble Happiness\u003c/em\u003e, TIFF ’17’s \u003cem\u003eMeditation Park\u003c/em\u003e) tells the story of a young woman from Hong Kong whose marriage to an affluent businessman is beginning to resemble a gilded cage.","synopsis":"Yin (Isabella Wei) hasn’t seen BT (Hugh Tran) in five months. While he claims to be under great professional stress back in their native Hong Kong, she spends her days in their new hometown of Vancouver, where she is chauffeured by the charming Ming (Tzi Ma, TIFF ’16’s Arrival ) and kept company by her older and wiser friend (Ming-Na Wen, Joy Luck Club, TIFF ’93), who advises Yin to stop worrying about her less than ideal marriage and enjoy her life of privilege.","screenings":[{"Title":"Whatcha Want","Director":"Mina Shum","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 12","StartTime":"17:30","EndTime":"19:30","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Whatcha Want","Director":"Mina Shum","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","Sta
