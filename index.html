// ---- the calendar itself: rows = screens, X = time ----
function gridHTML(evs, cfg){
  var state = cfg.state;
  if(!evs.length) return '<div class="no-plan"><b>Nothing this day</b>No screenings match the selected day + venue filter.</div>';

  // time bounds across the day's events, clamped 6:00–1:00, floored/ceiled to hour
  var lo = 24*60, hi = 0;
  evs.forEach(function(ev){
    var s = timeMin(ev.s.StartTime), e = timeMin(ev.s.EndTime); if(e<=s) e+=1440;
    if(s<lo) lo=s; if(e>hi) hi=e;
  });
  lo = Math.max(6*60, Math.floor(lo/60)*60);
  hi = Math.min(25*60, Math.ceil(hi/60)*60);
  var PX = 1.9, trackW = Math.round((hi-lo)*PX);
  var ROWH = 64;

  // distinct screens (venue + room) for today, sorted by venue then room
  var screens = {};
  evs.forEach(function(ev){ screens[ev.s.Venue+"|"+(ev.s.Room||"")] = ev.s; });
  var screenKeys = Object.keys(screens).sort(function(a,b){
    var A=screens[a], B=screens[b];
    if(A.Venue!==B.Venue) return A.Venue<B.Venue?-1:1;
    return (A.Room||"")<(B.Room||"")?-1:1;
  });

  var flagged = cfg.flagOverlaps ? activeConflicts(evs) : new Set();

  var head = '<div class="sched-head"><div class="shed-corner">Theatre</div><div class="shed-hours">';
  for(var t=lo; t<=hi; t+=60){
    var mm = t%1440, hh = Math.floor(mm/60);
    var lbl = (hh>12? hh-12 : hh? hh : 12) + (hh>=12?'pm':'am');
    head += '<div class="hour" style="left:'+Math.round((t-lo)*PX)+'px">'+lbl+'</div>';
  }
  head += '</div></div>';

  var body = '';
  screenKeys.forEach(function(key){
    var v = screens[key];
    var rowEvs = evs.filter(function(ev){ return (ev.s.Venue+"|"+(ev.s.Room||""))===key; });
    var track = '';
    rowEvs.forEach(function(ev){
      var s = timeMin(ev.s.StartTime), e = timeMin(ev.s.EndTime); if(e<=s) e+=1440;
      var left = Math.round((Math.max(s,lo)-lo)*PX);
      var width = Math.round((Math.min(e,hi)-Math.max(s,lo))*PX);
      width = Math.max(26, width);
      var isC = flagged.has(ev.film.slug);
      var isPick = picks.has(ev.film.slug);
      var isOff = String(ev.s.OffSale)==="True";
      var small = width < 110 ? ' small' : '';
      var offStyle = isOff ? ';border:2px solid #c23b3b' : '';
      var body =
        (small?'':'<div class="sb-time">'+fmt12(ev.s.StartTime)+'–'+fmt12(ev.s.EndTime)+'</div>')+
        '<div class="sb-title">'+esc(ev.film.title)+
          (cfg.markPicks && isPick ? '<span class="sb-heart" style="color:#0a0a0a">♥</span>':'')+
          (isC?'<span class="sb-cf">OVERLAP</span>':'')+'</div>'+
        (small?'':'<div class="sb-venue">'+esc(ev.s.Room||"")+(String(ev.s.IsPremium)==="True"?' · ★':'')+'</div>');
      track += '<div class="sblock'+(isC?' conflict':'')+small+'" data-slug="'+esc(ev.film.slug)+'" data-date="'+esc(ev.s.Date)+'" data-start="'+esc(ev.s.StartTime)+'" data-venue="'+esc(ev.s.Venue)+'" data-room="'+esc(ev.s.Room||"")+'" style="left:'+left+'px;width:'+width+'px;top:4px;bottom:4px;background:'+catColor(ev.film.category)+offStyle+'">'+body+'</div>';
    });
    body += '<div class="sched-row"><div class="srow-lbl"><span class="rv-name">'+esc(venueShort(v.Venue))+'</span><span class="rv-room">'+esc(v.Room||"")+'</span></div><div class="srow-track" style="width:'+trackW+'px">'+track+'</div></div>';
  });

  var legend = buildLegend(evs);
  return '<div class="sched-grid"><div class="sched-scroll"><div class="sched-inner">'+head+body+'</div></div></div>'+legend;
}

function buildLegend(evs){
  var cats = {};
  evs.forEach(function(ev){ if(!cats[ev.film.category]) cats[ev.film.category] = catColor(ev.film.category); });
  var list = Object.keys(cats);

function listHTML(evs, cfg){

        (isOff?'<span style="color:#c23b3b;font-size:.68rem;font-weight:700">SOLD OUT</span>':'')+
        '<span style="color:var(--muted)">'+esc(ev.s.Room||"")+'</span></div>'+
    '</div>';
  }).join("");
  return '<div class="day-group"><div class="day-head"><h3>'+esc(evs[0].s.Date)+'</h3><span class="picks">'+evs.length+' screening'+(evs.length===1?"":"s")+'</span></div>'+conflictMsg+rows+'</div>';
}

function renderCalendar(cfg){
  var events = cfg.events();
  var days = buildDays(events);

function weatherRushDeltaFor(s, out){
  var ds = wxDateFor(s);
  var wx = ds && weatherCache[ds];
  if(!wx) return 0;
  var hr = findHour(wx, wxHourIdx(s));
  if(!hr) return 0;
  var code = hr.code, t = hr.temp!=null?Number(hr.temp):null;
  var heavy = (code>=65&&code<=67)||code===82||code>=95;
  var rain  = (code>=61&&code<=64)||code===80||code===81;
  var driz  = code>=51&&code<=55;
  var d = 0;
  if(rain||driz) d = heavy ? 10 : (driz ? 4 : 8);
  if(hr.precip!=null && Number(hr.precip)>=40 && d<8) d = 8;
  if(t!=null){ if(t>=22) d+=6; else if(t>=18) d+=3; }
  var res = Math.min(14, d);
  if(out){
    out.label = "Weather helps ("+wxCond(code)[1]+(t!=null?", "+Math.round(t)+"°":"")+")";
    out.precip = hr.precip;
  }
  return res;
}

var AWARDS = {
  "fjord":-10, "the-debut":-10, "being-heumann":-10, "musk":-10,
  "wild-horse-nine":-10, "la-bola-negra":-10,
  "club-kid":-6, "ink":-6, "tender-loving-care":-6, "tenzing":-6,
  "i-play-rocky":-6, "elsinore":-6, "obsession":-6, "misty-green":-6,
  "clarissa":-6, "the-only-living-pickpocket-in-new-york":-6,
  "all-of-a-sudden":-6, "minotaur":-6, "possible-love":-6,
  "once-upon-a-time-in-harlem":-6
};
function awardsDelta(f){ return AWARDS[f.slug]||0; }
function interestDeltaFor(f){ return BUZZ[f.slug]||0; }
function starPowerDelta(f){
  var d = STARS[f.slug];
  if(d!=null) return d;
  var cat = String(f.category||""), cs = String(f.cast||"").length;
  if(/gala|special presentation/i.test(cat)) return cs>=55 ? -2 : 0;
  if(/discovery/i.test(cat)) return cs>=40 ? 0 : 2;
  if(/wavelengths|tiff docs|short cuts|tiff classics|next wave/i.test(cat)) return 2;
  return 0;
}
function publicScreenings(f){
  return (f.screenings||[]).filter(function(x){ return /general public/i.test(x.AudienceType); })
    .sort(function(a,b){
      return parseDateNum(a.Date)-parseDateNum(b.Date) || timeMin(a.StartTime)-timeMin(b.StartTime);
    });
}
function screeningIndex(pubs, s){
  for(var i=0;i<pubs.length;i++){
    if(String(pubs[i].Date)===String(s.Date)&&String(pubs[i].StartTime)===String(s.StartTime)&&
       String(pubs[i].Venue)===String(s.Venue)&&String(pubs[i].Room||"")===String(s.Room||"")) return i;
  }
  return -1;
}
function rushFactors(f, s){
  var prem = String(s.Premiere||f.premiere||"None");
  var gala = /gala/i.test(f.category);
  var rows = [];
  var d = 0, pLabel = null, pWhy = null;
  if(/world prem/i.test(prem)||/canadian prem/i.test(prem)){
    d = gala?-20:-15;
    pLabel = /world/i.test(prem) ? "World premiere" : "Canadian premiere";
    pWhy = /world/i.test(prem) ? "First screening anywhere — biggest rush line of the festival." : "Canadian debut — strong hometown demand.";
  }
  else if(/north american prem/i.test(prem)){ d = gala?-11:-8; pLabel = "North American premiere"; pWhy = "First North American screening — draws extra attention."; }
  else if(/international prem/i.test(prem)){ d = gala?-7:-5; pLabel = "International premiere"; pWhy = "First time outside its home country."; }
  else if(/premiere/i.test(prem) && !/^none$/i.test(prem)){ d = gala?-3:-2; pLabel = prem.replace(/\s+Premiere$/i,"")+" premiere"; pWhy = "Premiere status adds demand."; }
  if(d) rows.push({label:pLabel||"Premiere", why:pWhy, n:d});
  if(CANNES_SET.has(f.slug)) rows.push({label:"Cannes 2026 selection", why:"Festival darling — built-in buzz before Toronto ever starts.", n:-12});
  if(f.categorySlug==="wavelengths") rows.push({label:"Wavelengths lineup", why:"Avant-garde program — thin crowds, easier walk-in.", n:16});
  else if(f.categorySlug==="tiff-docs") rows.push({label:"Documentary", why:"Niche audience — fewer competing fans per show.", n:16});
  var bz = interestDeltaFor(f);
  if(bz) rows.push({label:"Live interest (tiffr leaderboard)", why:"One of the most-anticipated titles on TIFFR — demand runs hot.", n:bz});
  var sd = starPowerDelta(f);
  if(sd) rows.push({label:"Star power", why: sd<0 ? "A-list cast — names pull crowds." : "Low-key cast — lighter draw.", n:sd});
  var awd = awardsDelta(f);
  if(awd) rows.push({label: awd<=-8 ? "Awards frontrunner (Oscars/Golden Globes)" : "Awards contender (Oscars/Golden Globes)",
    why: awd<=-8 ? "Predicted winner on Variety's 2027 Oscars chart — campaign buzz makes it one of the hottest tickets." : "On Variety's 2027 Oscars predictions list — awards buzz keeps the rush line long.", n:awd});
  var pubs = publicScreenings(f);
  var cntD = Math.min(4, Math.max(0, pubs.length-1));
  if(cntD) rows.push({label:"Public showings ("+pubs.length+")", why:"More chances to catch it — each show sells less.", n:cntD});
  var ix = screeningIndex(pubs, s);
  if(ix>0) rows.push({label:"Later of "+pubs.length+" public showings", why:"Later slots fill more slowly.", n:Math.min(3,ix)});
  var seats = rushSeats(s.Venue);
  var vd = Math.min(10, Math.round(5.5*Math.log2(seats/10)));
  rows.push({label:"Venue rush seats (~"+seats+")", why:"Rush seats freed at this venue make walk-in realistic.", n:vd});
  if(parseInt(s.StartTime,10)>=18) rows.push({label:"Evening screening", why:"Evening slots sell out first.", n:-3});
  if(langFlag(f)==="non-en") rows.push({label:"Non-English dialogue", why:"Subtitled shows draw slimmer crowds.", n:6});
  var wInfo = {};
  var wd = weatherRushDeltaFor(s, wInfo);
  if(wd) rows.push({label:wInfo.label, why:"Bad weather thins the rush line.", n:wd});
  return rows;
}
function rushChance(f, s){
  var rows = rushFactors(f, s);
  var sum = 53;
  if(String(s.OffSale)==="True"){ rows.push({label:"Sold out",why:"This screening is off sale — rush line only if seats free up.",n:-40}); }
  rows.forEach(function(r){ sum += r.n; });
  var pct = Math.max(5, Math.min(95, Math.round(sum)));
  return { pct: pct, rows: rows, offSale: String(s.OffSale)==="True" };
}
function rushTier(pct){
  if(pct>=65) return {label:"Easy", color:"#46d369"};
  if(pct>=55) return {label:"Fair", color:"#7acf8d"};
  if(pct>=45) return {label:"Moderate", color:"#f5a623"};
  if(pct>=35) return {label:"Hard", color:"#e84848"};
  return {label:"Very Hard", color:"#c23b3b"};
}
function rushColor(pct){ return rushTier(pct).color; }
var TIER_GUIDE = {
  "Very Hard": {why:"World/Canadian premieres, galas and Cannes picks in tight rooms — demand far exceeds seats, so most sell out and the line rarely moves.",
                tip:"Very likely sold out. Arrive ~90 minutes early if you try, and strongly consider another film.", warn:true},
  "Hard":     {why:"Premieres and buzzy titles where the rush line is the real shot — seats free up, but not many.",
                tip:"Plan to arrive ~90 minutes early for the rush line, or have a backup film in mind.", warn:true},
  "Moderate": {why:"Solid demand with a realistic rush pool — booking alone doesn't fill it.",
                tip:"Rush is doable; arriving a little early improves your odds."},
  "Fair":     {why:"Lower-premiere slots and more available showings keep the rush line short.",
                tip:"Fairly easy to rush — lining up near showtime usually works."},
  "Easy":     {why:"Plenty of screenings and modest demand mean seats almost always open up.",
                tip:"Easy to rush — no need to line up extra early."}
};
function rushCardHTML(f, s){
  var r = rushChance(f, s);
  var tier = rushTier(r.pct);
  var guide = TIER_GUIDE[tier.label] || TIER_GUIDE["Moderate"];
  if(r.offSale){
    guide = {why:"This screening is sold out — rush line only if seats free up. Demand is extreme and seats are extremely limited.",
              tip:"Very likely sold out. Arrive ~90+ minutes early if you try, and strongly consider another film.", warn:true};
  }
  var sheet = s.RushScore!=null
    ? '<div class="rush-sheet">festival sheet · <b>'+esc(Number(s.RushScore).toFixed(0))+'%</b> · '+esc(String(s.RushDifficulty||"").trim()||"—")+'</div>' : "";
  var pressNote = !String(s.AudienceType||"").match(/general public/i)
    ? '<div class="rush-note">Press &amp; Market screening — rush lines apply mainly to public screenings.</div>' : "";
  var soldNote = r.offSale
    ? '<div class="rush-note" style="color:#c23b3b;font-weight:600">⚠ Sold out — rush is the only option.</div>' : "";
  var advice = guide.warn
    ? '<div class="rush-advice warn"><b>Why '+esc(tier.label)+'?</b> '+esc(guide.why)+
      '<span class="rus-a-tip">⏱ '+esc(guide.tip)+'</span>'+
      '<button class="rus-a-alt" type="button" data-alt-scroll>See same-venue alternates later today ↓</button></div>'
    : '<div class="rush-advice light"><b>Why '+esc(tier.label)+'?</b> '+esc(guide.why)+'<span class="rus-a-tip">'+esc(guide.tip)+'</span></div>';
  var breakdown = r.rows.length
    ? '<div class="rush-factors-title">What drives this</div><div class="rush-factors">'+
      r.rows.map(function(x){
        var c = x.n>0 ? "#46d369" : "#e84848";
        var sign = x.n>0 ? "+" : "";
        return '<div class="rf-row"><span class="rf-main"><span class="rf-label">'+esc(x.label)+'</span>'+
          (x.why?'<span class="rf-why">'+esc(x.why)+'</span>':'')+'</span>'+
          '<b style="color:'+c+'">'+sign+x.n+'</b></div>';
      }).join("")+'</div>' : "";
  return '<div class="rush-card">'+
    '<div class="rush-top"><span class="rt-label">Projected rush odds</span><span class="rt-pct" style="color:'+tier.color+'">'+r.pct+'%</span></div>'+
    '<div class="rush-gauge"><div class="rg-bar" style="width:'+Math.max(3,Math.min(100,r.pct))+'%;background:'+tier.color+'"></div></div>'+
    '<div class="rush-meta"><b style="color:'+tier.color+'">'+esc(tier.label)+'</b><span style="color:var(--muted)">· higher % = better odds when seats free up</span></div>'+
    advice+breakdown+sheet+soldNote+pressNote+
  '</div>';
}

function altSection(ev){
  var st = timeMin(ev.s.StartTime);
  var one = singleScreenVenue(ev.s.Venue);
  var rows = [];
  FILMS.forEach(function(g){
    (g.screenings||[]).forEach(function(x){
      if(!pmToggle && !String(x.AudienceType).match(/general public/i)) return;
      if(String(x.Date)!==String(ev.s.Date)) return;
      if(!one && String(x.Venue)!==String(ev.s.Venue)) return;
      if(timeMin(x.StartTime) <= st) return;
      var same = g.slug===ev.film.slug && String(x.Date)===String(ev.s.Date) &&
        String(x.StartTime)===String(ev.s.StartTime) && String(x.Venue)===String(ev.s.Venue) &&
        String(x.Room||"")===String(ev.s.Room||"");
      if(same) return;
      rows.push({film:g, s:x});
    });
  });
  if(!rows.length) return '<div class="alt-empty">No other screenings run later today'+(one?' at any venue.':' at this venue.')+'</div>';
  var byVenue = {};
  rows.forEach(function(a){ (byVenue[a.s.Venue]=byVenue[a.s.Venue]||[]).push(a); });
  var groups = Object.keys(byVenue).map(function(v){
    var list = byVenue[v].sort(function(a,b){ return timeMin(a.s.StartTime)-timeMin(b.s.StartTime) || String(a.s.Room||"").localeCompare(String(b.s.Room||"")); });
    return {venue:v, earliest:timeMin(list[0].s.StartTime), list:list};
  }).sort(function(a,b){ return a.earliest-b.earliest; });
  var out = "";
  groups.forEach(function(gr){
    out += '<div class="alt-day"><h4>'+esc(venueShort(gr.venue))+' · later today</h4>';
    gr.list.forEach(function(a){
      var rr = rushChance(a.film, a.s).pct;
      out += '<button class="alt-row" data-slug="'+esc(a.film.slug)+'" data-date="'+esc(a.s.Date)+'" data-start="'+esc(a.s.StartTime)+'" data-venue="'+esc(a.s.Venue)+'" data-room="'+esc(a.s.Room||"")+'" title="Open this screening\u2019s overview">'+
        '<span class="alt-time">'+fmt12(a.s.StartTime)+'</span>'+
        '<img loading="lazy" data-src="'+esc(imageUrl(a.film))+'" alt="">'+
        '<span class="alt-info"><span class="alt-title">'+esc(a.film.title)+(a.film.slug===ev.film.slug?'<em class="alt-own">own film</em>':'')+'</span>'+
        '<span class="alt-meta"><span class="alt-dot" style="background:'+catColor(a.film.category)+'"></span><span>'+esc(venueShort(a.s.Venue))+(a.s.Room?' · '+esc(a.s.Room):'')+'</span></span></span>'+
        '<span class="alt-side">'+(picks.has(a.film.slug)?'♥ ':'')+'<span style="color:'+rushColor(rr)+'">rush '+rr+'%</span></span>'+
      '</button>';
    });
    out += '</div>';
  });
  return out;
}

function buildOverviewBody(ev){
  var f = ev.film, s = ev.s;
  var isPick = picks.has(f.slug);
  var cap = s.Capacity ? '<span class="cap">'+esc(s.Capacity)+' seats</span>' : "";
  var aud = String(s.AudienceType||"").match(/general public/i) ? '<span class="aud aud-public">Public</span>' : '<span class="aud aud-pm">Press</span>';
  var prem = f.premiere ? '<span class="badge badge-premiere">'+esc(f.premiere)+'</span>' : "";
  var hero = imageUrl(f,true);
  document.getElementById("ovContent").innerHTML =
    '<div class="ov-hero">'+(hero?'<img src="'+esc(hero)+'" alt="">':'')+'<div class="overlay"></div>'+
      '<button class="ov-close" id="ovClose" title="Close">✕</button>'+
      '<div class="ov-head"><h2>'+esc(f.title)+'</h2>'+
        '<div class="ov-sub">'+prem+'<span class="badge badge-cat">'+esc(f.category)+'</span>'+
        '<span style="color:var(--muted)">'+esc(f.director||"")+'</span>'+
        '<button data-heart="'+esc(f.slug)+'" class="fheart '+(isPick?"on":"")+'" title="Add to my schedule" style="position:static;width:30px;height:30px;background:rgba(8,8,14,.45)">'+heartSVG()+'</button></div></div>'+
    '</div>'+
    '<div class="ov-obody">'+
      '<div class="ov-sec"><div class="ov-sec-title">Screening</div>'+
        '<div class="ov-screening"><div class="date">'+esc(s.Date)+'</div><div class="time">'+fmt12(s.StartTime)+'–'+fmt12(s.EndTime)+'</div>'+
        '<div class="place">'+esc(s.Venue)+(s.Room?' · '+esc(s.Room):'')+'</div>'+cap+aud+'</div></div>'+
      '<div class="ov-sec"><div class="ov-sec-title">Weather during screening</div><div id="ovWx"><div class="wx-loading">Loading weather…</div></div></div>'+
      '<div class="ov-sec"><div class="ov-sec-title">Rush</div><div id="ovRush">'+rushCardHTML(f,s)+'</div></div>'+
      '<div class="ov-sec" id="ovAlts"><div class="ov-sec-title">Alternates — later today'+(singleScreenVenue(s.Venue)?' at <b>any venue</b>':' at <b>'+esc(venueShort(s.Venue))+'</b>')+' after <b>'+fmt12(s.StartTime)+'</b></div>'+altSection(ev)+'</div>'+
      '<button class="ov-close-btn" id="ovClose2">✕ Close</button>'+
    '</div>';
  var vis = document.getElementById("ovContent");
  vis.querySelectorAll("img[data-src]").forEach(function(im){ im.onerror = function(){ im.style.display = "none"; }; });
  bindLazy(vis);
  loadWeather(s);
}

// ---------- weather (Open-Meteo: forecast → last year → typical table) ----------
var weatherCache = {};
var wxCacheKey = "tiff26_wx_v1";
try { var wxSaved = JSON.parse(localStorage.getItem(wxCacheKey) || "{}"); if(wxSaved && typeof wxSaved==="object") weatherCache = wxSaved; } catch(e){}
function persistWxCache(){ try { localStorage.setItem(wxCacheKey, JSON.stringify(weatherCache)); } catch(e){} }

var WMO = {
  0:["☀️","Clear"],1:["🌤","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
  45:["🌫","Fog"],48:["🌫","Icy fog"],51:["🌦","Light drizzle"],53:["🌦","Drizzle"],55:["🌧","Dense drizzle"],
  61:["🌧","Light rain"],63:["🌧","Rain"],65:["🌧","Heavy rain"],
  66:["❄️","Freezing drizzle"],67:["❄️","Freezing rain"],71:["🌨","Light snow"],73:["🌨","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],
  80:["🌦","Light showers"],81:["🌧","Showers"],82:["⛈","Heavy showers"],85:["🌨","Snow showers"],86:["🌨","Snow showers"],
  95:["⛈","Thunderstorm"],96:["⛈","Thunderstorm + hail"],99:["⛈","Severe storm"]
};
function wxCond(code){ var w=WMO[code]; return w || ["🌡","—"]; }

var TYPICAL_WX = {
  10:[21,13,2,25],11:[22,14,2,20],12:[21,13,61,60],13:[20,13,61,55],
  14:[22,14,3,40],15:[23,14,2,30],16:[22,14,3,40],17:[20,12,61,60],
  18:[20,12,3,30],19:[19,11,61,60],20:[20,12,2,25]
};

function wxDateFor(s, year){
  var m = String(s.Date).match(/^\S+\s+([A-Za-z]+)\s+(\d+)/);
  if(!m) return "";
  var mo = MONTHS[m[1]] || "09";
  return (year||"2026")+"-"+mo+"-"+m[2].padStart(2,"0");
}
function wxHourIdx(s){ return parseInt(String(s.StartTime).split(":")[0],10); }

function embeddedWx(s){
  var d = parseDateNum(s.Date);
  var t = TYPICAL_WX[d%100] || TYPICAL_WX[10];
  var hours = [];
  for(var h=0; h<24; h++){
    var temp = Math.round(t[0] + (t[1]-t[0]) * (0.5 + 0.45*Math.cos((h-15)*Math.PI/12)));
    hours.push({hour:h, temp:temp, feels:temp-1, code:t[2], precip:t[3], wind:12});
  }
  return {source:"typical", hi:t[0], lo:t[1], dayPrecip:t[3], code:t[2], hours:hours};
}
function normWx(j, year, source){
  var hrs = (j.hourly||{}).time||[], hT=j.hourly.temperature_2m, hF=j.hourly.apparent_temperature,
      hC=j.hourly.weather_code, hP=j.hourly.precipitation_probability, hW=j.hourly.wind_speed_10m;
  var hours = [];
  for(var i=0;i<hrs.length;i++){
    var hh = parseInt(String(hrs[i]).slice(11,13),10);
    if(isNaN(hh)) continue;
    hours.push({hour:hh, temp:hT&&hT[i], feels:hF&&hF[i], code:hC&&hC[i], precip:hP&&hP[i], wind:hW&&hW[i]});
  }
  var d = (j.daily||{}), di=0;
  return {source:source, hi:(d.temperature_2m_max||[])[di], lo:(d.temperature_2m_min||[])[di],
    dayPrecip:(d.precipitation_probability_max||[])[di], code:null, hours:hours};
}
function findHour(wx, hh){
  for(var i=0;i<wx.hours.length;i++) if(wx.hours[i].hour===hh) return wx.hours[i];
  return wx.hours[0];
}
function sourceLabel(src){
  if(src==="forecast") return "Forecast";
  if(src==="last-year") return "This date, last year";
  return "Typical (climate normals)";
}
function buildWxUrl(base, ds){
  return base+"?latitude=43.656&longitude=-79.381&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FToronto&start_date="+ds+"&end_date="+ds;
}
function hasHour(j, ds, hh){
  if(!j || !j.hourly || !j.hourly.time) return false;
  var want = ds.slice(0,10)+"T"+String(hh).padStart(2,"0");
  return j.hourly.time.some(function(t){ return String(t).slice(0,13)===want; });
}
function loadWeather(s){
  var sc = document.getElementById("ovWx");
  if(!sc) return;
  var ds = wxDateFor(s);
  var hh = wxHourIdx(s);
  if(!ds){ renderWx(sc, embeddedWx(s), hh); return; }
  if(weatherCache[ds]){ renderWx(sc, weatherCache[ds], hh); refreshRushFor(ds); return; }
  var finish = function(wx){
    weatherCache[ds] = wx; persistWxCache();
    var node = document.getElementById("ovWx");
    if(node) renderWx(node, wx, hh);
    refreshRushFor(ds);
  };
  var tryFetch = function(url, year){
    return fetch(url).then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(function(j){ if(!hasHour(j, year+ds.slice(4), hh)) throw new Error("no hour"); return j; });
  };
  tryFetch(buildWxUrl("https://api.open-meteo.com/v1/forecast", ds), 2026)
    .then(function(j){ finish(normWx(j, 2026, "forecast")); })
    .catch(function(){
      var py = 2025+ds.slice(4);
      tryFetch(buildWxUrl("https://archive-api.open-meteo.com/v1/archive", py), 2025)
        .then(function(j){ finish(normWx(j, 2025, "last-year")); })
        .catch(function(){ seedTypicalAll(); persistWxCache(); finish(weatherCache[ds]||embeddedWx(s)); });
    });
}
function refreshRushFor(ds){
  if(!overviewIsOpen() || !currentOverview) return;
  if(wxDateFor(currentOverview.s)===ds){
    var node = document.getElementById("ovRush");
    if(node) node.innerHTML = rushCardHTML(currentOverview.film, currentOverview.s);
  }
}
function buildWxWindowUrl(base, startDS, endDS){
  return base+"?latitude=43.656&longitude=-79.381&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FToronto&start_date="+startDS+"&end_date="+endDS;
}
function seedCache(j, source){
  var hourly = j.hourly||{}, times = hourly.time||[], hT=hourly.temperature_2m, hF=hourly.apparent_temperature,
      hC=hourly.weather_code, hP=hourly.precipitation_probability, hW=hourly.wind_speed_10m;
  var dailies = ((j.daily||{}).time)||[];
  var dayIdx = {}; dailies.forEach(function(d,i){ dayIdx[d]=i; });
  var byDate = {};
  times.forEach(function(t,i){
    var d = String(t).slice(0,10); if(!d) return;
    if(!byDate[d]) byDate[d] = [];
    byDate[d].push({hour:parseInt(String(t).slice(11,13),10), temp:hT&&hT[i], feels:hF&&hF[i], code:hC&&hC[i], precip:hP&&hP[i], wind:hW&&hW[i]});
  });
  Object.keys(byDate).forEach(function(d){
    var key = d.slice(0,4)==="2026" ? d : "2026"+d.slice(4);
    var di = dayIdx[d]!=null ? dayIdx[d] : 0;
    weatherCache[key] = {
      source:source,
      hi:((j.daily||{}).temperature_2m_max||[])[di],
      lo:((j.daily||{}).temperature_2m_min||[])[di],
      dayPrecip:((j.daily||{}).precipitation_probability_max||[])[di],
      code:null, hours:byDate[d]
    };
  });
}
function seedTypicalAll(){
  for(var d=10; d<=20; d++){
    var key = "2026-09-"+String(d).padStart(2,"0");
    var t = TYPICAL_WX[d] || TYPICAL_WX[10];
    var hours = [];
    for(var h=0; h<24; h++){
      var temp = Math.round(t[0]+(t[1]-t[0])*(0.5+0.45*Math.cos((h-15)*Math.PI/12)));
      hours.push({hour:h, temp:temp, feels:temp-1, code:t[2], precip:t[3], wind:12});
    }
    weatherCache[key] = {source:"typical", hi:t[0], lo:t[1], dayPrecip:t[3], code:t[2], hours:hours};
  }
}
function prewarmWeather(){
  if(prewarmWeather.done) return;
  prewarmWeather.done = true;
  var done = function(){ persistWxCache(); if(overviewIsOpen() && currentOverview) refreshRushFor(wxDateFor(currentOverview.s)); };
  fetch(buildWxWindowUrl("https://api.open-meteo.com/v1/forecast","2026-09-10","2026-09-20"))
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
    .then(function(j){ if(!(j.hourly&&j.hourly.time&&j.hourly.time.length)) throw new Error("empty"); seedCache(j,"forecast"); done(); })
    .catch(function(){
      return fetch(buildWxWindowUrl("https://archive-api.open-meteo.com/v1/archive","2025-09-10","2025-09-20"))
        .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
        .then(function(j){ if(!(j.hourly&&j.hourly.time&&j.hourly.time.length)) throw new Error("empty"); seedCache(j,"last-year"); done(); })
        .catch(function(){ seedTypicalAll(); done(); });
    });
}
function renderWx(sc, wx, hh){
  var hr = findHour(wx, hh);
  if(!hr) { sc.innerHTML = '<div class="wx-loading">Weather unavailable for this slot.</div>'; return; }
  var cond = wxCond(hr.code);
  var hi = (wx.hi!=null)? Math.round(Number(wx.hi))+"°" : "—";
  var lo = (wx.lo!=null)? Math.round(Number(wx.lo))+"°" : "—";
  sc.innerHTML =
    '<div class="wx-card">'+
      '<div class="wx-top"><span class="wt-label">'+(fmtHH(hh==null?hr.hour:hh))+'</span><span class="wx-src">'+sourceLabel(wx.source)+'</span></div>'+
      '<div class="wx-main">'+
        '<span class="wx-cond">'+cond[0]+'</span>'+
        '<span class="wx-temp">'+(hr.temp!=null?Math.round(Number(hr.temp))+'°':'—')+'</span>'+
        '<div><div class="wx-meta">'+
          '<span>'+(hr.feels!=null?'feels '+Math.round(Number(hr.feels))+'°':'')+'</span>'+
          '<span>'+(hr.precip!=null?'💧 rain '+hr.precip+'%':'')+'</span>'+
          '<span>'+(hr.wind!=null?'💨 '+Math.round(Number(hr.wind))+' km/h':'')+'</span>'+
          '<span>'+cond[1]+'</span>'+
        '</div></div>'+
        '<div class="wx-hilo"><div>Hi <b>'+hi+'</b></div><div>Lo <b>'+lo+'</b></div></div>'+
      '</div>'+
    '</div>';
}

// ---------- events ----------
document.addEventListener("click", function(e){
  var heart = e.target.closest("[data-heart]");
  if(heart){
    e.stopPropagation();
    var slug = heart.dataset.heart;
    if(picks.has(slug)) picks.delete(slug); else picks.add(slug);
    savePicks();
    heart.classList.toggle("on", picks.has(slug));
    refreshCounts();
    if(activeCat==="picks"){ renderWish(); buildCats(); bindLazy(document.getElementById("wishSections")); }
    if(overviewIsOpen() && currentOverview){ buildOverviewBody(currentOverview); bindLazy(document.getElementById("ovContent")); }
    return;
  }
  var card = e.target.closest(".fcard");
  if(card){
    renderDrawer(card.dataset.slug);
    return;
  }
  var chip = e.target.closest(".chip");
  if(chip){
    activeCat = chip.dataset.cat;
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c.dataset.cat===activeCat); });
    renderWish();
    buildCats();
    bindLazy(document.getElementById("wishSections"));
    var win = document.getElementById("wishSections");
    if(activeCat==="picks" || activeCat!=="all") win.scrollIntoView({block:"start"});
    return;
  }
  var vtab = e.target.closest(".vtab");
  if(vtab){
    var scope = e.target.closest(".page");
    var inPlan = scope && scope.id==="page-plan";
    var st = inPlan ? planState : schedState;
    st.view = vtab.dataset.view;
    scope.querySelectorAll(".vtab").forEach(function(t){ t.classList.toggle("active", t.dataset.view===st.view); });
    if(inPlan) dayPicksRender(); else renderSched();
    return;
  }
  var daytab = e.target.closest(".daytab");
  if(daytab && daytab.dataset.day){
    var scope = e.target.closest(".page");
    var inPlan = scope && scope.id==="page-plan";
    var st = inPlan ? planState : schedState;
    st.day = daytab.dataset.day;
    if(inPlan) dayPicksRender(); else renderSched();
    return;
  }
  var vchip = e.target.closest(".vchip");
  if(vchip){
    var scope = e.target.closest(".page");
    var inPlan = scope && scope.id==="page-plan";
    var st = inPlan ? planState : schedState;
    st.venue = vchip.dataset.venue;
    if(inPlan) dayPicksRender(); else renderSched();
    return;
  }
  var sblock = e.target.closest(".sblock");
  if(sblock){
    var sbev = screeningFromEl(sblock);
    if(sbev) openOverview(sbev);
    return;
  }
  var asbtn = e.target.closest("[data-alt-scroll]");
  if(asbtn){
    var ovAlts = document.getElementById("ovAlts");
    if(ovAlts) ovAlts.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  var arow = e.target.closest(".alt-row");
  if(arow){
    var aev = screeningFromEl(arow);
    if(aev) openOverview(aev);
    return;
  }
  var schedrow = e.target.closest(".schedrow");
  if(schedrow){
    var sev = screeningFromEl(schedrow);
    if(sev) openOverview(sev);
    return;
  }
  var srow = e.target.closest(".srow");
  if(srow){
    var rev = screeningFromEl(srow);
    if(rev) openOverview(rev);
    return;
  }
  var tab = e.target.closest(".tab");
  if(tab){
    var page = tab.dataset.page;
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.page===page); });
    document.querySelectorAll(".page").forEach(function(p){ p.classList.toggle("active", p.id==="page-"+page); });
    if(page==="plan"){ dayPicksRender(); }
    else if(page==="sched"){ renderSched(); }
    else { bindLazy(document.getElementById("wishSections")); }
    return;
  }
  if(e.target.closest("#ovClose") || e.target.closest("#ovClose2") || e.target.id==="ovBackdrop"){
    closeOverview();
    return;
  }
  if(e.target.closest("#drawerClose") || e.target.id==="drawerBackdrop") closeDrawer();
});

document.getElementById("searchInput").addEventListener("input", function(){
  searchQ = this.value.trim().toLowerCase();
  renderWish(); buildCats(); bindLazy(document.getElementById("wishSections"));
});
document.getElementById("pmToggle").addEventListener("change", function(){
  pmToggle = this.checked;
  renderWish(); buildCats();
  if(document.getElementById("page-plan").classList.contains("active")) { planCfg=null; dayPicksRender(); }
  if(document.getElementById("page-sched").classList.contains("active")) { schedCfg=null; renderSched(); }
  bindLazy(document.getElementById("wishSections"));
});
document.getElementById("clearPicksBtn").addEventListener("click", function(){
  picks.clear(); savePicks(); renderWish(); buildCats();
  planCfg=null; dayPicksRender(); renderSched();
});

// ---------- export / import favorites ----------
function tell(msg){ if(typeof window.alert === "function") window.alert(msg); }
function exportPicks(){
  var data = { app:"tiff26-planner", version:1, exported:new Date().toISOString().slice(0,10), slugs:Array.from(picks) };
  var blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
  var a = document.createElement("a");
  var url = URL.createObjectURL(blob);
  a.href = url;
  a.download = "tiff26-picks-"+data.exported+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function applyImported(slugs){
  var known = [];
  slugs.forEach(function(s){
    var k = String(s);
    if(FILMS.some(function(x){ return x.slug===k; })) known.push(k);
  });
  if(!known.length){ tell("That file contains no films from this festival."); return; }
  if(typeof window.confirm !== "function" || window.confirm("Replace your "+picks.size+" favorite"+(picks.size===1?"":"s")+" with "+known.length+" from the file?")){
    picks.clear();
    known.forEach(function(k){ picks.add(k); });
    savePicks(); refreshCounts();
    renderWish(); buildCats();
    bindLazy(document.getElementById("wishSections"));
    planCfg=null; schedCfg=null;
    dayPicksRender(); renderSched();
  }
}
document.getElementById("exportPicks").addEventListener("click", exportPicks);
document.getElementById("importPicks").addEventListener("change", function(e){
  var f = (e.target && e.target.files && e.target.files[0]);
  if(f){
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var doc = JSON.parse(String(rd.result));
        var slugs = Array.isArray(doc) ? doc : (doc && Array.isArray(doc.slugs) ? doc.slugs : null);
        if(!slugs){ tell("No favorites found in that file — expected a JSON list of film slugs."); return; }
        applyImported(slugs);
      } catch(err){ tell("Could not read that file — expected a JSON list of film slugs."); }
    };
    rd.readAsText(f);
  }
  if(e.target) e.target.value = "";
});
function forceListView(pageId, state, renderFn){
  var page = document.getElementById(pageId);
  if(!page || !page.classList.contains("active")) return;
  if(state.view !== "grid") return;
  state.view = "list";
  if(renderFn) renderFn();
  page.querySelectorAll(".vtab").forEach(function(t){ t.classList.toggle("active", t.dataset.view===state.view); });
}
if(typeof window.matchMedia === "function"){
  var mqMobile = window.matchMedia("(max-width:720px)");
  function onMobile(mql){ if(!mql.matches) return; forceListView("page-plan", planState, dayPicksRender); forceListView("page-sched", schedState, renderSched); }
  if(mqMobile.addEventListener) mqMobile.addEventListener("change", onMobile);
  else if(mqMobile.addListener) mqMobile.addListener(onMobile);
}

document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ if(overviewIsOpen()) closeOverview(); else closeDrawer(); } });

// ---------- init ----------
var FILTER_CATS = FILMS.length ? CAT_ORDER.filter(function(c){ return FILMS.some(function(f){ return f.categorySlug===c; }); }) : CAT_ORDER;
renderWish();
buildCats();
bindLazy(document.getElementById("wishSections"));
refreshCounts();
prewarmWeather();
})();
</script>
