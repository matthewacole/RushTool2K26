<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFF26 — All Films &amp; Planner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#0a0a0f; --bg2:#111118; --card:#16161f; --card2:#1d1d28; --border:#262633;
  --txt:#f2f2f5; --sub:#a2a2b3; --muted:#6c6c80;
  --gold:#d4a853; --gold2:#e8c97a; --red:#e50914; --green:#46d369; --orange:#f5a623;
  --blue:#56b6ff; --purple:#b066ff;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
html,body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif; line-height:1.5;}
img{display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select{font-family:inherit;}

/* Header */
.topbar{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#141014 0%,var(--bg) 100%); border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1500px; margin:0 auto; padding:14px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-logo{width:38px; height:38px; border-radius:50%; background:var(--gold); color:#0a0a0a; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:20px;}
.brand h1{font-size:1.15rem; font-weight:800; letter-spacing:.5px;}
.brand p{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
.search-wrap{flex:1 1 220px; position:relative; max-width:420px;}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted);}
#searchInput{width:100%; background:var(--card); border:1px solid var(--border); color:var(--txt); border-radius:999px; padding:9px 14px 9px 34px; font-size:.88rem; outline:none;}
#searchInput:focus{border-color:var(--gold);}
.controls{display:flex; align-items:center; gap:14px; margin-left:auto;}
.toggle-row{display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--sub); user-select:none;}
.switch{position:relative; width:38px; height:20px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--card2); border:1px solid var(--border); border-radius:999px; transition:.2s;}
.slider:before{content:""; position:absolute; width:14px; height:14px; left:2px; top:2px; background:#8a8a9a; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--gold); border-color:var(--gold);}
.switch input:checked + .slider:before{transform:translateX(18px); background:#0a0a0a;}
.stat{font-size:.82rem; color:var(--sub);}
.stat b{color:var(--gold); font-weight:700;}
.picktools{display:flex; align-items:center; gap:6px;}
.picktools button,.picktools label{font-size:.74rem; font-weight:600; color:var(--sub); border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; display:inline-block;}
.picktools button:hover,.picktools label:hover{color:var(--txt); border-color:var(--gold);}

/* Tabs */
.tabs{max-width:1500px; margin:0 auto; padding:16px 22px 0; display:flex; gap:8px; border-bottom:1px solid var(--border);}
.tab{padding:10px 22px; border-radius:10px 10px 0 0; font-weight:600; font-size:.92rem; color:var(--sub); border:1px solid transparent; border-bottom:none;}
.tab.active{color:var(--txt); background:var(--bg2); border-color:var(--border); position:relative; top:1px;}
.tab .cnt{display:inline-block; background:var(--card2); border-radius:999px; padding:1px 8px; font-size:.72rem; margin-left:6px; color:var(--gold);}
.tab.active .cnt{background:#262633;}

/* Main */
main{max-width:1500px; margin:0 auto; padding:20px 22px 80px;}
.page{display:none;}
.page.active{display:block;}

/* Category filter */
.catbar{display:none; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.page.wish.active .catbar{display:flex;}
.chip{padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:.8rem; font-weight:600;}
.chip:hover{color:var(--txt); border-color:var(--gold);}
.chip.on{background:var(--gold); color:#0a0a0a; border-color:var(--gold);}

/* Category sections */
.catsec{margin-bottom:34px;}
.cathead{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border);}
.cathead h2{font-size:1.15rem; font-weight:700; letter-spacing:.3px;}
.cathead .n{color:var(--muted); font-size:.82rem;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px;}

/* Film card */
.fcard{background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:transform .15s ease, border-color .15s ease; display:flex; flex-direction:column; position:relative;}
.fcard:hover{transform:translateY(-3px); border-color:#3a3a4d;}
.fcard.loading .fimg-wrap{background:var(--card2);}
.fimg-wrap{position:relative; aspect-ratio:16/9; background:var(--card2);}
.fimg-wrap img{width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s;}
.fimg-wrap img.loaded{opacity:1;}
.fheart{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; background:rgba(8,8,14,.62); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; font-size:16px; transition:transform .15s;}
.fheart:hover{transform:scale(1.15);}
.fheart.on svg{fill:var(--red); stroke:var(--red);}
.fheart svg{width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2;}
.pm-badge{position:absolute; left:10px; bottom:10px; font-size:.62rem; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:999px; background:#1c1c2a; color:var(--sub);}
.fbody{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
.ftitle{font-weight:700; font-size:.95rem; line-height:1.3;}
.fmeta{font-size:.76rem; color:var(--sub); display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.fdir{color:var(--muted);}
.badge{font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:2px 8px; border-radius:4px;}
.badge-premiere{background:#3a2a0a; color:var(--gold2);}
.badge-cat{background:var(--card2); color:var(--sub);}
.fblurb{font-size:.78rem; color:var(--sub); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px;}
.fsched{margin-top:auto; padding-top:8px; display:flex; align-items:center; gap:8px; font-size:.74rem; color:var(--muted);}
.fsched .dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex:0 0 auto;}
.fsched b{color:var(--green); font-weight:600;}

/* Detail drawer */
.drawer-backdrop{position:fixed; inset:0; background:rgba(5,5,10,.72); z-index:90; display:none;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed; inset:0 auto 0 0; width:min(620px,92vw); background:var(--bg2); z-index:95; transform:translateX(-102%); transition:transform .25s ease; overflow-y:auto; border-right:1px solid var(--border); box-shadow:var(--shadow);}
.drawer.open{transform:translateX(0);}
.drawer::-webkit-scrollbar{width:8px;}
.drawer::-webkit-scrollbar-thumb{background:#333344; border-radius:4px;}
.drawer-hero{position:relative; aspect-ratio:16/9;}
.drawer-hero img{width:100%; height:100%; object-fit:cover;}
.drawer-hero .overlay{position:absolute; inset:0; background:linear-gradient(180deg,transparent 30%,rgba(8,8,14,.95) 100%);}
.drawer-close{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(8,8,14,.65); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; z-index:2;}
.drawer-body{padding:20px 24px 40px;}
.dtitle{font-size:1.5rem; font-weight:800; line-height:1.25;}
.dsub{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center;}
.dsyn{margin-top:14px; font-size:.9rem; color:var(--sub);}
.dsyn b{color:var(--txt);}
.sec-title{font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:24px 0 10px; font-weight:700;}
.slist{display:flex; flex-direction:column; gap:8px;}
.srow{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px;}
.srow.when{flex:0 0 auto;}
.srow .date{font-weight:700; font-size:.86rem;}
.srow .time{color:var(--gold); font-size:.84rem; font-weight:600;}
.srow .venue{color:var(--sub); font-size:.8rem; flex:1;}
.srow .aud{font-size:.62rem; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:.5px;}
.aud-public{background:#14241a; color:var(--green);}
.aud-pm{background:#241d14; color:var(--orange);}
.srow .rush{font-size:.72rem; color:var(--muted); flex:0 0 auto;}
.srow::-webkit-scrollbar{height:6px;}

/* Empty state */
.empty{text-align:center; padding:70px 20px; color:var(--muted);}
.empty .big{font-size:2.4rem; margin-bottom:12px;}
.empty b{color:var(--txt);}

/* Planning */
.plan-head{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
.plan-head h2{font-size:1.2rem; font-weight:800;}
.plan-clear{font-size:.8rem; color:var(--sub); border:1px solid var(--border); padding:7px 14px; border-radius:999px; margin-left:auto;}
.plan-clear:hover{color:var(--red); border-color:var(--red);}
.viewtoggle{display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden;}
.vtab{font-size:.78rem; font-weight:600; padding:7px 16px; color:var(--sub); background:var(--card); border-right:1px solid var(--border);}
.vtab:last-child{border-right:none;}
.vtab.active{background:var(--gold); color:#0a0a0a;}
.plan-meta{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.daytabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
.daytab{flex:0 0 auto; padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); text-align:center; font-size:.82rem; font-weight:600;}
.daytab .dt-dow{display:block; font-size:.62rem; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700;}
.daytab .dt-date{display:block; color:var(--txt); font-size:.95rem; font-weight:800;}
.daytab .dt-count{display:block; font-size:.66rem; color:var(--gold); margin-top:2px;}
.daytab.on{background:var(--gold); border-color:var(--gold);}
.daytab.on .dt-dow{color:#0a0a0a; opacity:.7;}
.daytab.on .dt-date{color:#0a0a0a;}
.daytab.on .dt-count{color:#0a0a0a; opacity:.8;}
.venuebar{display:flex; gap:6px; flex-wrap:wrap;}
.vchip{padding:4px 11px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:.72rem; font-weight:600;}
.vchip .vdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px;}
.vchip.on{background:var(--card2); color:var(--txt); border-color:#4a4a5e;}
.cat-legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.cat-legend.hidden{display:none;}
.cat-legend .lgi{display:flex; align-items:center; gap:6px; font-size:.68rem; color:var(--muted);}
.cat-legend .lgi .sw{width:10px; height:10px; border-radius:3px;}

/* Grid schedule view (theatre rows × time columns) */
.sched-grid{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg2);}
.sched-scroll{overflow-x:auto; overflow-y:auto; max-height:68vh;}
.sched-scroll::-webkit-scrollbar{width:8px; height:8px;}
.sched-scroll::-webkit-scrollbar-thumb{background:#34344a; border-radius:4px;}
.sched-inner{min-width:max-content;}
.sched-head{display:flex; position:sticky; top:0; z-index:30; background:var(--card);}
.shed-corner{position:sticky; left:0; z-index:40; width:176px; flex:0 0 176px; border-right:1px solid var(--border); padding:8px 12px; font-weight:800; font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; background:var(--card); display:flex; align-items:center;}
.shed-hours{position:relative; height:36px;}
.shed-hours .hour{position:absolute; top:9px; transform:translateX(-50%); font-size:.68rem; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
.sched-row{display:flex; border-top:1px solid var(--border);}
.srow-lbl{position:sticky; left:0; z-index:10; width:176px; flex:0 0 176px; border-right:1px solid var(--border); background:var(--bg2); padding:0 12px; display:flex; flex-direction:column; justify-content:center; gap:1px;}
.srow-lbl .rv-name{font-weight:800; font-size:.78rem; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.srow-lbl .rv-room{font-size:.62rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.srow-track{position:relative; min-height:56px;}
.srow-track .endline{position:absolute; left:0; right:0; top:0; border-top:1px solid rgba(255,255,255,.05);}
.sblock{position:absolute; border-radius:7px; padding:5px 8px; overflow:hidden; cursor:pointer; border:1px solid rgba(255,255,255,.08); transition:transform .1s, filter .1s; box-shadow:0 2px 8px rgba(0,0,0,.35); min-width:22px;}
.sblock:hover{filter:brightness(1.15); z-index:30;}
.sblock .sb-time{font-size:.6rem; font-weight:800; letter-spacing:.3px; color:rgba(0,0,0,.75); white-space:nowrap;}
.sblock .sb-title{font-weight:700; font-size:.76rem; line-height:1.2; margin-top:2px; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sblock .sb-venue{font-size:.62rem; color:rgba(0,0,0,.7); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sblock.conflict{outline:3px solid var(--red); outline-offset:1px; z-index:40; box-shadow:0 0 0 3px rgba(229,9,20,.25);}
.sblock .sb-cf{position:absolute; top:5px; right:6px; font-size:.56rem; font-weight:800; color:#fff; background:var(--red); padding:1px 6px; border-radius:4px;}
.sblock .sb-heart{font-size:.62rem; vertical-align:1px; margin-left:4px;}
.sblock.small{font-size:0;}
.sblock.small .sb-title{font-size:.6rem; line-height:1.1; white-space:nowrap; overflow:hidden;}
.sblock.small .sb-time{font-size:.54rem;}
.sched-legend{display:flex; gap:10px; flex-wrap:wrap; padding:10px 4px 4px;}

/* List view */
.day-group{margin-bottom:30px;}
.day-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);}
.day-head h3{font-size:1.05rem; font-weight:700;}
.day-head .picks{font-size:.76rem; color:var(--muted);}
.conflict-banner{background:#2a1414; border:1px solid #4a1a1a; color:#ff8a8a; font-size:.8rem; padding:8px 14px; border-radius:8px; margin-bottom:10px;}
.schedrow{background:var(--card); border:1px solid var(--border); border-left:3px solid var(--card2); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:center;}
.schedrow.conflict{border-left-color:var(--red); background:#1d1113;}
.sr-time{grid-row:span 2; text-align:right;}
.sr-time .t{font-weight:800; font-size:.9rem; color:var(--gold);}
.sr-time .d{font-size:.7rem; color:var(--muted);}
.sr-title{font-weight:700; font-size:.9rem;}
.sr-meta{font-size:.78rem; color:var(--sub); display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.sr-meta .v{color:var(--muted);}
.sr-cf{font-size:.68rem; font-weight:700; color:var(--red); background:#3a1010; padding:2px 8px; border-radius:4px;}
.no-plan{text-align:center; padding:60px 20px; color:var(--muted);}
.no-plan b{color:var(--txt); display:block; font-size:1rem; margin-bottom:6px;}

/* Favorites filter button */
.fav-btn{border-color:#4a1a1a; color:var(--red);}
.fav-btn .favn{opacity:.65;}
.fav-btn.on{background:var(--red); color:#fff; border-color:var(--red);}
.fav-btn.on .favn{opacity:.8;}
.fav-btn.dim{opacity:.5;}

/* Screening overview modal */
.ov-backdrop{position:fixed; inset:0; background:rgba(5,5,10,.8); z-index:120; display:none;}
.ov-backdrop.open{display:block;}
.ov-modal{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(780px,96vw); max-height:92vh; background:var(--bg2); border:1px solid var(--border); border-radius:16px; z-index:130; box-shadow:var(--shadow); display:none; flex-direction:column; overflow:hidden;}
.ov-modal.open{display:flex;}
.ov-scroll{overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
.ov-hero{position:relative; aspect-ratio:16/9; flex:0 0 auto; background:var(--card2);}
.ov-hero img{width:100%; height:100%; object-fit:cover;}
.ov-hero .overlay{position:absolute; inset:0; background:linear-gradient(180deg,rgba(5,5,10,.25) 0%,rgba(5,5,10,.05) 45%,rgba(10,10,15,.98) 100%);}
.ov-close{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(8,8,14,.65); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; z-index:3;}
.ov-head{position:absolute; left:24px; bottom:12px; right:68px; z-index:2;}
.ov-head h2{font-size:1.45rem; font-weight:800; line-height:1.2; text-shadow:0 1px 6px rgba(0,0,0,.5);}
.ov-head .ov-sub{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; font-size:.8rem; color:var(--sub);}
.ov-obody{padding:16px 24px 22px;}
.ov-sec{margin-bottom:16px;}
.ov-sec-title{font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; margin-bottom:8px;}
.ov-sec-title b{color:var(--gold);}
.ov-screening{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.ov-screening .date{font-weight:800; font-size:.95rem;}
.ov-screening .time{color:var(--gold); font-weight:700; font-size:.9rem;}
.ov-screening .place{color:var(--sub); font-size:.82rem; flex:1; min-width:140px;}
.ov-screening .cap{font-size:.7rem; color:var(--muted); border:1px solid var(--border); padding:3px 9px; border-radius:999px;}
.wx-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px;}
.wx-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
.wx-top .wt-label{font-weight:700; font-size:.85rem;}
.wx-src{font-size:.62rem; text-transform:uppercase; letter-spacing:.8px; color:var(--gold); font-weight:700;}
.wx-main{display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap;}
.wx-cond{font-size:1.7rem; line-height:1;}
.wx-temp{font-size:1.6rem; font-weight:800;}
.wx-meta{color:var(--sub); font-size:.8rem; display:flex; gap:12px; flex-wrap:wrap;}
.wx-hilo{margin-left:auto; text-align:right; color:var(--sub); font-size:.8rem; white-space:nowrap;}
.wx-hilo b{color:var(--gold);}
.wx-loading{color:var(--muted); font-size:.85rem; padding:12px 0;}
.rush-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px;}
.rush-top{display:flex; justify-content:space-between; align-items:baseline;}
.rush-top .rt-label{font-weight:700; font-size:.85rem;}
.rush-top .rt-pct{font-weight:800; font-size:1.15rem;}
.rush-gauge{height:12px; background:var(--card2); border-radius:999px; overflow:hidden; margin-top:10px;}
.rush-gauge .rg-bar{height:100%; border-radius:999px;}
.rush-meta{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:.82rem;}
.rush-meta b{font-size:1rem;}
.rush-note{font-size:.72rem; color:var(--muted); margin-top:8px;}
.rush-factors-title{font-size:.68rem; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700; margin-top:12px; margin-bottom:6px;}
.rush-factors{display:flex; flex-direction:column; gap:3px;}
.rf-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:.74rem; color:var(--sub);}
.rf-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.rf-why{font-size:.66rem; color:var(--muted); line-height:1.35;}
.rf-row b{font-variant-numeric:tabular-nums; font-weight:700; flex:0 0 auto; margin-top:1px;}
.rush-sheet{font-size:.72rem; color:var(--muted); margin-top:12px; border-top:1px solid var(--border); padding-top:8px;}
.rush-sheet b{color:var(--txt);}
.rush-advice{margin-top:12px; font-size:.74rem; line-height:1.5; color:var(--sub); border-left:3px solid var(--gold); padding:8px 10px; background:var(--card2); border-radius:8px;}
.rush-advice b{color:var(--txt);}
.rush-advice.warn{border-left-color:#e84848; background:#1d1113;}
.rush-advice.light{border-left-color:#46d369; background:#0f1912;}
.rush-advice .rus-a-tip{display:block; margin-top:5px; color:var(--txt);}
.rush-advice .rus-a-alt{display:inline-block; margin-top:6px; font-size:.7rem; font-weight:700; color:var(--gold); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-align:left;}
.alt-day{margin-bottom:12px;}
.alt-day h4{font-size:.78rem; color:var(--gold); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px;}
.alt-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:6px; cursor:pointer; width:100%; text-align:left; transition:border-color .15s;}
.alt-row:hover{border-color:var(--gold);}
.alt-row img{width:64px; height:38px; object-fit:cover; border-radius:6px; flex:0 0 auto; background:var(--card2);}
.alt-time{font-weight:800; font-size:.8rem; color:var(--gold); flex:0 0 auto; width:60px; font-variant-numeric:tabular-nums;}
.alt-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.alt-title{font-weight:600; font-size:.85rem; line-height:1.25; color:var(--txt);}
.alt-own{font-style:normal; font-size:.6rem; color:var(--muted); margin-left:6px;}
.alt-meta{font-size:.68rem; color:var(--sub); display:flex; gap:6px; align-items:center;}
.alt-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.alt-side{flex:0 0 auto; font-size:.7rem; font-weight:700; color:var(--gold); white-space:nowrap;}
.alt-empty{color:var(--muted); font-size:.85rem;}
.ov-close-btn{display:block; margin:2px auto 4px; font-size:.8rem; color:var(--sub); border:1px solid var(--border); padding:8px 22px; border-radius:999px;}
.ov-close-btn:hover{color:var(--txt); border-color:var(--gold);}

/* clickable screening rows */
.srow{cursor:pointer;}
.srow:hover{border-color:var(--gold);}
.srow.offsale{opacity:.55;cursor:default;border-left:3px solid #c23b3b;}
.srow.offsale:hover{border-color:#c23b3b;}
.srow-arrow{flex:0 0 auto; font-size:1.15rem; color:var(--muted);}
.schedrow{cursor:pointer;}
.schedrow:hover{border-color:var(--gold);}

@media (max-width:1024px){
  .srow-lbl{width:132px; flex:0 0 132px; padding:0 10px;}
  .shed-corner{width:132px; flex:0 0 132px; padding-left:10px;}
}

  body{-webkit-tap-highlight-color:rgba(0,0,0,0);}

  .controls{margin-left:auto;}
  .stat{font-size:.76rem;}
  .daytab{padding:9px 14px;}
  .vchip{padding:7px 12px;}
  .chip{padding:8px 13px;}
  .fheart{width:40px; height:40px;}
  .ov-close,.drawer-close{width:40px; height:40px; font-size:20px;}
  #searchInput{font-size:16px;}
  .ov-obody{padding:12px 14px 20px;}
  .ov-close-btn{padding:10px 22px;}
}
@media (max-width:480px){

  .brand h1{font-size:1rem;}
  .brand-logo{width:34px; height:34px; font-size:18px;}
  .ov-modal{width:100vw; max-height:100vh; border-radius:0; border:none;}

  .ov-head h2{font-size:1.2rem;}

  .alt-row img{width:52px; height:32px;}
  .alt-time{width:54px; font-size:.78rem;}
}

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">T</div>
      <div>
        <h1>TIFF 26 Planner</h1>
        <p>All Films &amp; Schedule · Toronto · Sep 10–20, 2026</p>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="searchInput" type="text" placeholder="Search films, directors, cast...">
    </div>
    <div class="controls">
      <div class="toggle-row">
        <span>Press &amp; Market</span>
        <label class="switch"><input type="checkbox" id="pmToggle"><span class="slider"></span></label>
      </div>
      <div class="stat"><b id="statCount">0</b> films · <b id="statPicks">0</b> ❤</div>
      <div class="picktools">
        <button id="exportPicks" type="button" title="Download your favorites as a JSON file">Export ♥</button>
        <label class="pickimp" title="Import favorites / schedule from a JSON file">Import<input type="file" id="importPicks" accept=".json,application/json" hidden></label>
      </div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-page="wish">All Films<span class="cnt" id="tabWishCnt">244</span></button>
  <button class="tab" data-page="plan">My Schedule<span class="cnt" id="tabPlanCnt">0</span></button>
  <button class="tab" data-page="sched">Full Schedule<span class="cnt" id="tabSchedCnt">0</span></button>
</div>

<main>
  <!-- WISHLIST PAGE -->
  <section class="page wish active" id="page-wish">
    <div class="catbar" id="catbar"></div>

    <div id="wishEmpty" class="empty" style="display:none;">
      <div class="big" id="wishEmptyBig">🎬</div>
      <p><b id="wishEmptyHead">No films match</b><span id="wishEmptyMsg">Try adjusting your search or category filter.</span></p>
    </div>

    <div id="wishSections"></div>
  </section>

  <!-- PLANNING PAGE -->
  <section class="page plan" id="page-plan">
    <div class="plan-head">
      <h2>My Festival Schedule</h2>
      <span class="stat" style="color:var(--muted)">your ❤ picks only · theatre × time <span style="color:var(--red)">■</span> = overlap</span>
      <div class="viewtoggle">
        <button class="vtab active" data-view="grid">Schedule</button>
        <button class="vtab" data-view="list">List</button>
      </div>
      <button class="plan-clear" id="clearPicksBtn">Clear Schedule (0)</button>
    </div>
    <div class="plan-meta">

      <div class="venuebar" id="venueBar"></div>
    </div>
    <div class="cat-legend" id="catLegend"></div>
    <div id="planContent"></div>
  </section>

  <!-- FULL SCHEDULE PAGE -->
  <section class="page plan" id="page-sched">
    <div class="plan-head">
      <h2>Full Festival Schedule</h2>
      <span class="stat" style="color:var(--muted)">every public screening · one day at a time</span>
      <div class="viewtoggle">
        <button class="vtab active" data-view="grid">Schedule</button>
        <button class="vtab" data-view="list">List</button>
      </div>
    </div>
    <div class="plan-meta">
      <div class="daytabs" id="schedDayTabs"></div>
      <div class="venuebar" id="schedVenueBar"></div>
    </div>
    <div class="cat-legend" id="schedLegend"></div>
    <div id="schedContent"></div>
  </section>
</main>

<!-- Detail drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div id="drawerContent"></div>
</aside>

<div class="ov-backdrop" id="ovBackdrop"></div>
<div class="ov-modal" id="ovModal" role="dialog" aria-modal="true">

</div>

sier, Benoît Gouin, Maxime Genois","image":"https://images.ctfassets.net/22n7d68fswlw/4DBbVRN3gDmnjCFHpTbuJF/5c39611e3f572124ee645aa1bff451bd/L-AUTRE_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4DBbVRN3gDmnjCFHpTbuJF/5c39611e3f572124ee645aa1bff451bd/L-AUTRE_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Wild delusions and genuine dangers threaten a patient recovering from cancer surgery in this visceral and darkly comedic thriller by Quebec’s Alexandre Franchi.","synopsis":"An actor most recently seen by Festival audiences in Monia Chokri’s The Nature of Love (TIFF ’23), Pierre-Yves Cardinal stars as Stan, an ad man and aspiring fantasy author who’s recovering in a hospital in Quebec from a surgery to remove a cancerous section of bone in his leg. Addled by pain medication and largely immobilized due to his struggle to adapt to his metal knee prosthesis, Stan spends his waking hours weathering the many intrusive visits from doctors, nurses, and concerned loved ones like his girlfriend Bénédicte (Karine Gonthier-Hyndman, Falcon Lake , TIFF ’22) and her sardonic sister Fleur (Nahéma Ricci, Antigone , TIFF ’19).","screenings":[{"Title":"L\u0027AUTRE","Director":"Alexandre Franchi","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 12","StartTime":"12:05","EndTime":"13:43","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"L\u0027AUTRE","Director":"Alexandre Franchi","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 12","StartTime":"18:55","EndTime":"21:03","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"L\u0027AUTRE","Director":"Alexandre Franchi","Blurb":"","Category":"Centrepiece","Date":"Mon Sep 14","StartTime":"12:30","EndTime":"14 ose own decisions had life-changing repercussions.","screenings":[{"Title":"The Betrayers","Director":"David Bezmozgis","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 12","StartTime":"18:10","EndTime":"20:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Betrayers","Director":"David Bezmozgis","Blurb":"","Category":"Centrepiece","Date":"Sun Sep 13","StartTime":"17:50","EndTime":"19:20","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Betrayers","Director":"David Bezmozgis","Blurb":"","Category":"Centrepiece","Date":"Mon Sep 14","StartTime":"21:30","EndTime":"23:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Betrayers","Director":"David Bezmozgis","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 17","StartTime":"09:00","EndTime":"10:30","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The bovine with the curved horns","slug":"the-bovine-with-the-curved-horns","category":"Centrepiece","categorySlug":"centrepiece","director":"Omar E. Ospina Giraldo","premiere":"World Premiere","cast":"Carlos Fernández, Jose David Sierra, Amanda Maldonado, Jose Sandoval, Jesus David Reyes","image":"https://images.ctfassets.net/22n7d68fswlw/6Q2p2C2XKtWM5uM7Nc8Zd7/a9818cfd54c5def5ade04c449eb4a3cf/the_bovine_with_the_curved_horns_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6Q2p2C2XKtWM5uM7Nc8Zd7/a9818cfd54c5def5ade04c449eb4a3cf/the_bovine_with_the_curved_horns_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Blending Caribbean fantasy, magical realism, and Colombia’s painful history, \u003cem\u003eThe bovine with the curved horns\u003c/em\u003e follows a boy searching for his missing father through a landscape where myth and violence coexist. A haunting, poetic debut of remarkable beauty and emotional power.","synopsis":"The historic abandonment of entire regions and populations by the Colombian establishment has led to different armed actors taking over the functions of the state and subjugating civilians in rural areas. In the case of the northern areas surrounding the Ciénaga Grande de Santa Marta’s vast swamps, far-right, narco-trafficking-associated, and extremely cruel paramilitary groups dominated during the 1990s and to this day. This is the setting for The bovine with the curved horns , but the film is a mix of Caribbean fantasy and magical realism, telling its story through the eyes of a child, and letting imagination take them to a safer place.","screenings":[{"Title":"The bovine with the curved horns","Director":"Omar E. Ospina Giraldo","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 11","StartTime":"15:15","EndTime":"16:35","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The bovine with the curved horns","Director":"Omar E. Ospina Giraldo","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 12","StartTime":"18:30","EndTime":"20:20","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The bovine with the curved horns","Director":"Omar E. Ospina Giraldo","Blurb":"","Category":"Centrepiece","Date":"Mon Sep 14","StartTime":"21:00","EndTime":"22:50","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Pub udy follows a young man trying to care for his family while forging his own path as a rapper in Bangui.","synopsis":"Congo Boy balances its story of youthful ambition with a bold sense of place and circumstance. We get a feel for what it’s like for Robert to placate a guard, hitch a ride, or traverse a checkpoint. Adrien Lallau’s handheld camera generates an immediacy, while César Simonot’s editing establishes the film’s singular rhythms in tandem with Robert’s rapping, which is where this inspiring film reveals its colossal heart.","screenings":[{"Title":"Congo Boy","Director":"Rafiki Fariala","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"15:20","EndTime":"16:51","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Congo Boy","Director":"Rafiki Fariala","Blurb":"","Category":"Centrepiece","Date":"Tue Sep 15","StartTime":"15:10","EndTime":"17:11","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Congo Boy","Director":"Rafiki Fariala","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 18","StartTime":"20:20","EndTime":"22:21","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Congo Boy","Director":"Rafiki Fariala","Blurb":"","Category":"Centrepiece","Date":"Sun Sep 20","StartTime":"10:15","EndTime":"12:16","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Conversation With The Sea","slug":"conversation-with-the-sea","category":"Centrepiece","categorySlug":"centrepiece","director":"Muayad Alayan","premiere":"North American Premier ill_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Winner of the Jury Prize in the competition section of the Cannes Film Festival, \u003cem\u003eThe Dreamed Adventure\u003c/em\u003e is German auteur Valeska Grisebach\u0027s highly anticipated and exceptional follow up to \u003cem\u003eWestern\u003c/em\u003e (TIFF ’17).","synopsis":"In a mountainous Bulgarian border region, amidst a turf war between gangsters involved in smuggling, we meet Said (Syuleyman Letifov), a man living on the fringes of society, crossing into Turkey with a cargo of diesel. There, he encounters a former colleague, Veska (Yana Radeva), an archaeologist who grew up not far from the dusty site. Veska has a past with both Said and local kingpin, Ilya (Stoicho Kostadinov), whose underground business is facing competition from a newcomer called Raven. After turning down Raven’s offer to help with a lucrative and expanding people-trafficking network, Said (and his car) are nowhere to be found, and Veska, whose past includes associating with uncouth networks, takes it upon herself to sell the contraband materials that Said was bootlegging. At the same time, she intends to confront Ilya, whose illegal dealings threaten to involve a teenage girl working on her site. These plot points, dreamed, or, as real as it gets , are blips in something bigger and more nebulous taking place inside this masterful slow-burn, which unearths the past and along with it, memory, local lore, regional history, as well as unspoken and ever-shifting rules of engagement that a passerby could miss with the blink of an eye.","screenings":[{"Title":"The Dreamed Adventure","Director":"Valeska Grisebach","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 11","StartTime":"09:15","EndTime":"11:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Dreamed Adventure","Director":"Valesk 0\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2thvCDUqNphgqgl5vWXBNa/e7978ec1a3962c834c498947a569fdf2/Elephants-in-the-Fog_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"A village matriarch (Puspa Thing Lama) must choose between her heart’s desires and her duty to her community when a young woman disappears into the forest in this delicate, riveting thriller.","synopsis":"In a Nepalese village surrounded by lush forests and wild elephants, Pirati (Puspa Thing Lama) is the matriarch of a Kinnar community — a guru-led society populated by third-gender individuals with their own rites and rituals. New members, or daughters, are initiated into their chosen families through a ceremony in which they take a vow of chastity and a commitment of care to each other. These rules, along with her obligations as a mother, complicate things for Pirati, who has fallen in love with a local man (Aashant Sharma) and wishes to run away to Delhi.","screenings":[{"Title":"Elephants in the Fog","Director":"Abinash Bikram Shah","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"12:25","EndTime":"14:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elephants in the Fog","Director":"Abinash Bikram Shah","Blurb":"","Category":"Centrepiece","Date":"Sun Sep 13","StartTime":"18:30","EndTime":"20:48","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elephants in the Fog","Director":"Abinash Bikram Shah","Blurb":"","Category":"Centrepiece","Date":"Tue Sep 15","StartTime":"11:30","EndTime":"13:48","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Elephants se they have no choice, perhaps because it’s the only way to survive.","screenings":[{"Title":"Everytime","Director":"Sandra Wollner","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"11:30","EndTime":"13:29","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everytime","Director":"Sandra Wollner","Blurb":"","Category":"Centrepiece","Date":"Tue Sep 15","StartTime":"15:25","EndTime":"17:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Everytime","Director":"Sandra Wollner","Blurb":"","Category":"Centrepiece","Date":"Wed Sep 16","StartTime":"14:30","EndTime":"16:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Flies","slug":"flies","category":"Centrepiece","categorySlug":"centrepiece","director":"Fernando Eimbcke","premiere":"North American Premiere","cast":"Teresita Sanchez, Bastian Escobar, Hugo Ramírez, Enrique Arreola","image":"https://images.ctfassets.net/22n7d68fswlw/4hepTgdAoW2gEtGrWQg1f6/1f6cb33cf898441113dabdf2a0bdaa8c/Flies_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4hepTgdAoW2gEtGrWQg1f6/1f6cb33cf898441113dabdf2a0bdaa8c/Flies_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"When a lonely woman rents a room to a father with a hospitalized relative, she forms an unexpected bond with his young son, in Fernando Eimbcke’s tender story about care, connection, and quiet transformation.","synopsis":"Olga (Mexican contemporary indie cinema mainstay Teresita Sánchez) is a mature, single woman who leads a mostly unhurried — but rather lonely — life in a middle-class apartment complex across from a big, busy hospital. To support herself she decides to rent out a room in her apartment to a father (Hugo Ramírez) who has a relative at the hospital. Unexpectedly, she forms an unlikely bond with his nine-year-old son, Cristian (Bastian Escobar), whose quiet resilience gradually disrupts her routines and opens the door to a profound emotional transformation she didn’t anticipate.","screenings":[{"Title":"Flies","Director":"Fernando Eimbcke","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"09:10","EndTime":"10:51","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Flies","Director":"Fernando Eimbcke","Blurb":"","Category":"Centrepiece","Date":"Wed Sep 16","StartTime":"17:30","EndTime":"19:41","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Flies","Director":"Fernando Eimbcke","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 18","StartTime":"11:00","EndTime":"13:11","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Flies","Director":"Fernando Eimbcke","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 19","StartTime":"14:15","EndTime":"16:26","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Four Seasons in Java","slug":"four-seasons-in-java","category":"Centrepiece","categorySlug":"centrepiece","director":"Kamila Andini","premiere":"World Premiere","cast":"Putri Marino, Christine Hakim, Arya Saloka, Hana Malasan, Dwika Pradnyana, Hargi Sundari, Iswadi Pratama, Sofia Shireen, Totos Risti, Donikus, Nagra Pakusadewo","image":"https://images.ctfassets.net/22n7d68fswlw/kNYZ3oM1gskPCD30SGPPz/35937c0ac2a3280f647e18562f1be953/Four-Seasons-In-Java_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/kNYZ3oM1gskPCD30SGPPz/35937c0ac2a3280f647e18562f1be953/Four-Seasons-In-Java_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Kamila Andini, the brilliant mind behind TIFF ’21 Platform Award winner \u003cem\u003eYuni\u003c/em\u003e, returns with another polished and picturesque film with a strong women\u0027s narrative, starring Indonesia’s biggest talents Putri Marino, Christine Hakim, and Arya Saloka.","synopsis":"Pertiwi (Putri Marino) returns to her remote hometown after 20 years to rebuild her life. The introduction of electricity seemed hopeful for the village at the time of her departure, but to her surprise, it hasn’t done much for the place. In fact, the village is darker than ever. Her best friend married her ex-boyfriend; her parents are hostile about her return; and a motherly figure she often found comfort in was ousted. The worst of it all is that the men responsible for sending her to prison are now the most powerful. When a deaf-mute girl is found mirroring her past, Pertiwi struggles to stop the cycle of violence and mobilises an army of the broken and marginalised to shine light on the monster that has long been festering.","screenings":[{"Title":"Four Seasons in Java","Director":"Kamila Andini","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 11","StartTime":"18:20","EndTime":"20:37","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Four Seasons in Java","Director":"Kamila Andini","Blurb":"","Category":"Centrepiece","Date":"Sun Sep 13","StartTime":"17:30","EndTime":"20:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","Audi ing the personal with the political, the film unfolds in five chapters, each devoted to a figure who shaped Ahangarani’s life: her revolutionary filmmaker father, Jamshid Ahangarani; her beloved teacher, Shermin Sarra; her uncle, Rashid; her close friend, Amir; with the final section dedicated to her young daughter, Lily. Each chapter confronts seismic turning points in Iranian history — moments when hope and the promise of change were palpable — from the 1997 election of Mohammad Khatami and the 2009 protests to the persistent oppression of the current regime and the ongoing destruction from U.S. and Israeli missiles.","screenings":[{"Title":"Rehearsals for a Revolution","Director":"Pegah Ahangarani","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"20:30","EndTime":"22:08","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Rehearsals for a Revolution","Director":"Pegah Ahangarani","Blurb":"","Category":"Centrepiece","Date":"Tue Sep 15","StartTime":"19:00","EndTime":"21:08","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Rehearsals for a Revolution","Director":"Pegah Ahangarani","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 17","StartTime":"21:00","EndTime":"23:08","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Rehearsals for a Revolution","Director":"Pegah Ahangarani","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 19","StartTime":"17:50","EndTime":"19:58","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Secret Lives of Baba Segi\u0027s Wives","slug":"the-secret-lives-of-baba-segi-s-wives","category":"Centrepiece","categorySlug":"centrepiece","director":"Daniel Oriahi","premiere":"World Premiere","cast":"Odunlade Adekola, Omowunmi Dada, Iyabo Ojo, Mercy Aigbe, Bimbo Ademoye","image":"https://images.ctfassets.net/22n7d68fswlw/5ye2bPjfpF7HSwRaq034R0/c118094fddd4e9e440d642229e1a3cb8/The-Secret-Lives-of-Baba-Segs-Wives_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5ye2bPjfpF7HSwRaq034R0/c118094fddd4e9e440d642229e1a3cb8/The-Secret-Lives-of-Baba-Segs-Wives_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"A wealthy patriarch’s fragile household unravels when the youngest of his four wives fails to conceive. Blending sharp Nollywood wit with tenderness, this deeply satisfying drama explores topics of infertility, gendered inheritance, and shifting family power.","synopsis":"Baba Segi (Odunlade Adekola), a wealthy and haughty patriarch, has spent years building a household, marrying several women in the process: first wife Iya Segi (Iyabo Ojo), second wife Iya Tope (Mercy Aigbe), third wife Iya Femi (Bimbo Ademoye), and the most recent and youngest, university-educated yet naïve Bolanle (Omowunmi Dada). The new wife upsets the tentative balance struck by the first three wives, who have been locked into rivalries, secrets, and mutual survival strategies, each trying to solidify their own status. When Bolanle fails to conceive, Baba Segi enlists doctors to find out what is wrong with her, setting off a chain of revelations that unravel the fragile order holding the household together.","screenings":[{"Title":"The Secret Lives of Baba Segi\u0027s Wives","Director":"Daniel Oriahi","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 11","StartTime":"21:00","EndTime":"23:29","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Th enbach returns for his third animated feature with a reimagining of Bizet’s opera Carmen . Told through the eyes of Sevillian children, the tragic story — in which the free-spirited Carmen is killed by the soldier Don José in a jealous rage — has the opportunity to be rewritten when the youngsters try to stop her fatal conclusion. Despite the vibrance of this world rendered with expressive brushstrokes, the weight of the original material is still deeply felt, providing a striking contrast to the violence of the narrative.","screenings":[{"Title":"Viva Carmen","Director":"Sébastien Laudenbach","Blurb":"","Category":"Centrepiece","Date":"Thu Sep 10","StartTime":"08:55","EndTime":"10:25","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Viva Carmen","Director":"Sébastien Laudenbach","Blurb":"","Category":"Centrepiece","Date":"Fri Sep 11","StartTime":"18:00","EndTime":"20:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Viva Carmen","Director":"Sébastien Laudenbach","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 12","StartTime":"18:25","EndTime":"20:25","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Viva Carmen","Director":"Sébastien Laudenbach","Blurb":"","Category":"Centrepiece","Date":"Sat Sep 19","StartTime":"15:00","EndTime":"17:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"We Are All Strangers","slug":"we-are-all-strangers","category":"Centrepiece","categorySlug":"centrepiece","director":"Anthony Chen","premiere":"North Amer 455a930cff8fd03d/Bedford-Park-Still-1.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/bdcLuIkjs2mQAQGkwL1nm/ba24dbf77789d641455a930cff8fd03d/Bedford-Park-Still-1.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Writer-director Stephanie Ahn’s feature debut explores the complexities of diasporic experience through a chance encounter between two thirtysomething, second-generation Korean Americans, tracking their relationship as it moves from circumstantial to friendly to romantic.","synopsis":"Eli (Son Sukku, My Liberation Notes ) and Audrey (Moon Choi, Now, We Are Breaking Up ) meet when Eli gets into a car accident with Audrey’s mother. They come to know each other when Audrey, as a way to make amends, volunteers to drive Eli to work. On the surface, their lives couldn’t appear more different: Eli was adopted by a white woman, raised with little connection to his roots, and works as a mall security guard, while Audrey grew up in a tumultuous household with her Korean-born parents, and is a physical therapist. Yet both characters seek to make peace with their present lives by reckoning with their respective pasts. For Eli, this means facing fatherhood, while Audrey struggles to free herself from her mother’s unreasonable expectations.","screenings":[{"Title":"Bedford Park","Director":"Stephanie Ahn","Blurb":"","Category":"Discovery","Date":"Thu Sep 10","StartTime":"18:40","EndTime":"20:41","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bedford Park","Director":"Stephanie Ahn","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime":"14:30","EndTime":"17:01","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bedford Park","Director":"Stephanie Ahn","Blurb":"","Ca ad only just been mended, as their extended social circles react to the fallout. After strong performances in El Yousfi’s festival-touring short, César-nominated actor Mélissa Guers and Ava Baya return for a propulsive study of how external structures of gender, power, and politics affect our intimate lives despite our best attempts to connect.","screenings":[{"Title":"The Daughters of Abraham","Director":"Hanaël El Yousfi","Blurb":"","Category":"Discovery","Date":"Sun Sep 13","StartTime":"18:45","EndTime":"20:49","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Daughters of Abraham","Director":"Hanaël El Yousfi","Blurb":"","Category":"Discovery","Date":"Mon Sep 14","StartTime":"12:00","EndTime":"13:34","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Daughters of Abraham","Director":"Hanaël El Yousfi","Blurb":"","Category":"Discovery","Date":"Tue Sep 15","StartTime":"21:45","EndTime":"23:49","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Daughters of Abraham","Director":"Hanaël El Yousfi","Blurb":"","Category":"Discovery","Date":"Sun Sep 20","StartTime":"18:50","EndTime":"20:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Drifter","slug":"drifter","category":"Discovery","categorySlug":"discovery","director":"Sung Kang","premiere":"World Premiere","cast":"Sung Kang, Tamara Braun, Michael Nehring, Grant Sullivan, McCaleb Burnett, Gregory Cruz, James Pumphrey, Adam LZ, Shane Johnson, Rutledge Wood, Jully Lee, Jo Sung, Taeon Chung, Ilia Smolov, Nikita Rushmanov","image":"https://images.ctfassets.net/22n7d68fswlw/5vS2zMRaXdtZHTRpR0gADQ/acbf18f9c34d35dace3b003aeb112a0a/Drifter_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5vS2zMRaXdtZHTRpR0gADQ/acbf18f9c34d35dace3b003aeb112a0a/Drifter_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eFast \u0026amp; Furious\u003c/em\u003e alum Sung Kang directs and stars in this alternately melancholy and exhilarating character study of a lonesome racetrack custodian with a secret talent for drifting.","synopsis":"A solitary custodian at Rosamond, California’s Willow Springs Raceway, Tree (Kang) is used to keeping a low profile. Haunted by a tragic past and saddled with generational debt, he avoids getting close to others, preferring to use his off hours behind the wheel of his battered but beloved vintage Toyota AE86 Corolla — which he’s nicknamed Lola — and drifting in the desert twilight. Tree’s immense talent is eventually noticed and he’s granted a chance to compete in a pro drifting event. But is talent alone enough to win? In order to realize his secret dream, Tree must learn to overcome his aversion to others and seek out a mentor — which also means coming to terms with the ghosts he’s spent his life trying to keep at bay.","screenings":[{"Title":"Drifter","Director":"Sung Kang","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime":"20:45","EndTime":"23:42","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Drifter","Director":"Sung Kang","Blurb":"","Category":"Discovery","Date":"Mon Sep 14","StartTime":"08:40","EndTime":"11:07","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Drifter","Director":"Su "Iranian filmmaker Ghasideh Golmakani’s absurd and sharply satirical debut feature explores what happens when a female director forces male actors to wear skirts and headscarves.","synopsis":"In this \"film within a film\" structure, Ghasideh Golmakani tackles not only the way women are portrayed by her fellow male directors but also their place in Iranian society. Using all the questions she had, Golmakani makes a brilliant use of humour to depict the relationships between men and women. “I’m not torturing you,” says Bahar to an uncooperative actor. “We’re recreating a perfectly normal situation with costumes used in our cinema.”","screenings":[{"Title":"Head to Head","Director":"Ghasideh Golmakani","Blurb":"","Category":"Discovery","Date":"Sun Sep 13","StartTime":"14:00","EndTime":"15:50","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Head to Head","Director":"Ghasideh Golmakani","Blurb":"","Category":"Discovery","Date":"Mon Sep 14","StartTime":"08:30","EndTime":"09:50","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Head to Head","Director":"Ghasideh Golmakani","Blurb":"","Category":"Discovery","Date":"Tue Sep 15","StartTime":"15:20","EndTime":"17:10","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Head to Head","Director":"Ghasideh Golmakani","Blurb":"","Category":"Discovery","Date":"Sun Sep 20","StartTime":"15:30","EndTime":"17:20","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"I Am Mario","slug":"i-am-mario","category":"Discovery","categorySlug":"discovery","director":"Sharon Kleinberg","premiere":"International Premiere","cast":"Oustin De León, Héctor Kotsifakis, Mayra Batalla, Ruth Ramos, Krystian Ferrer, Fermín Martínez, Fernanda Rivera, Mercedes Hernández","image":"https://images.ctfassets.net/22n7d68fswlw/6KhyDf9wsHNBjIXfz00WZo/6133dd44bf1e26426d93a611ab71c7d0/Still-Soy-Mario-hero.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/6KhyDf9wsHNBjIXfz00WZo/6133dd44bf1e26426d93a611ab71c7d0/Still-Soy-Mario-hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"A transgender taxi driver’s dream of fatherhood becomes a reality when he gets pregnant, forcing him to confront his own notions of masculinity while navigating unexpected social, moral, and emotional consequences.","synopsis":"Mario (Oustin de León) is a gentle forty-year-old transgender taxi driver working in a big city in present-day México. He has bonded with his colleagues and has a relationship with his family — his mother and two sisters — that is caring and mostly stable. When he unexpectedly becomes pregnant, he finally has the opportunity to fulfill a long-held and intimate desire to become a father. But the news also shakes what he thought were the solid foundations of many of his own beliefs and expectations, particularly those regarding his masculinity. Mario’s questioning leads him to painful decisions and a sense of being completely cornered by life. Before exposing himself to his colleagues and facing social prejudices, he must confront himself.","screenings":[{"Title":"I Am Mario","Director":"Sharon Kleinberg","Blurb":"","Category":"Discovery","Date":"Thu Sep 10","StartTime":"15:15","EndTime":"16:53","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"I Am Mario","Director":"Sharon Kleinberg","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime a60262/Krux_Still_Hero.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"The feature debut of writer-director Tony Vahl delivers a powerful and stark portrait of moral collapse, societal panic, and the consequences of being on the wrong side of history.","synopsis":"With haunting visuals from celebrated director of photography Piotr Sobociński Jr. ( Corpus Christi , TIFF ‘19) and balanced by Lorenz Dangel’s resonating original score, the fortified debut of writer-director Tony Vahl delivers a stark portrait of moral collapse, societal panic, and the consequences — mostly to be endured by those who bore no arms — of standing on the wrong side of history. As humanity frays and propaganda spills beyond borders, Krux leaves little space for moral quandary, where the so-called perpetrators await their fates like lambs to the slaughter.","screenings":[{"Title":"Krux","Director":"Tony Vahl","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime":"08:30","EndTime":"10:02","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Krux","Director":"Tony Vahl","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime":"15:00","EndTime":"17:02","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Krux","Director":"Tony Vahl","Blurb":"","Category":"Discovery","Date":"Sun Sep 13","StartTime":"14:00","EndTime":"16:02","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Krux","Director":"Tony Vahl","Blurb":"","Category":"Discovery","Date":"Fri Sep 18","StartTime":"14:30","EndTime":"16:32","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Magazine","slug":"magazine","category":"Discovery","categorySlug":"discovery","director":"Alexandra Pechman","premiere":"World Premiere","cast":"Lily McInerny, Joshuah Melnick, Lukita Maxwell, AnnaSophia Robb, Daniel Zolghadri, Ruby Cruz, Jake Lacy, Iris Apatow, Delaney Rowe, Alex Edelman, Sasha Bhasin","image":"https://images.ctfassets.net/22n7d68fswlw/1qLN60U1YX6pi7NfJUEPpX/34279663d0ba5e294627070931fc1936/Magazine_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/1qLN60U1YX6pi7NfJUEPpX/34279663d0ba5e294627070931fc1936/Magazine_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Set in New York’s cliquish literary scene, writer-director Alexandra Pechman’s feature debut chronicles the sentimental education of an aspiring poet (Lily McInerny, TIFF ’24’s \u003cem\u003eBonjour Tristesse\u003c/em\u003e) who becomes tangled in a web of eros, cultural gatekeeping, and office intrigue.","synopsis":"Newly transplanted from Arizona, Nora (Lily McInerny, TIFF ’24’s Bonjour Tristesse ) is excited to begin an internship at the tastemaking literary journal, Platen . Her duties include reading slush-pile submissions, making coffee, and tending to the needs of high-profile guests during Platen ’s many exclusive fêtes. While snobbery and name-dropping dominate, Nora’s feeling of alienation is tempered by her crush on associate editor Thomas (Joshuah Melnick) who, though only slightly older, seems to know everything about piloting the scene. Nora gradually comes to comprehend the advice of Platen publisher Mickey ( Carol ’s Jake Lacy): the most important thing for interns to know is when to leave the party.","screenings":[{"Title":"Magazine","Director":"Alexandra Pechman","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"12:15","EndTime":"14:30","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","Rus h could now be sold to relieve the family’s financial difficulties — have been left to the city-dwelling student. Frieda’s laconic mother Joahanna, in the footsteps of the late family matriarch, whose life was marked by responsibilities and physical labour, has always subordinated her needs to farm and family, and harbours strong feelings about their resources. However, upon evaluating the landscape of her inheritance, which, due to a rampant bark beetle infestation may be worthless, the bewildered granddaughter, bearing a sense of obligation to her legacy and to the forest that bore witness to generations of sacrifice, must now make a choice between her origins and her envisioned future.","screenings":[{"Title":"Memories of a Forest","Director":"Katharina Rabl","Blurb":"","Category":"Discovery","Date":"Tue Sep 15","StartTime":"09:05","EndTime":"10:36","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Memories of a Forest","Director":"Katharina Rabl","Blurb":"","Category":"Discovery","Date":"Wed Sep 16","StartTime":"18:40","EndTime":"20:41","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 9","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Memories of a Forest","Director":"Katharina Rabl","Blurb":"","Category":"Discovery","Date":"Thu Sep 17","StartTime":"18:30","EndTime":"20:31","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Nosotros","slug":"nosotros","category":"Discovery","categorySlug":"discovery","director":"Joaquín Ruano","premiere":"World Premiere","cast":"Lola Vásquez, Josef Coxaj, Mayra Salvador","image":"https://images.ctfassets.net/22n7d68fswlw/4slwjHJw5W2UU0SrT7d5OE/bfac48a93822e4841de54536cc9a8e8f/NOSOTROS-Still--1?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4slwjHJw5W2UU0SrT7d5OE/bfac48a93822e4841de54536cc9a8e8f/NOSOTROS-Still--1?w=1280\u0026h=720\u0026fit=thumb","blurb":"After leaving his Indigenous family for work in Guatemala City, a lonely security guard falls for a business owner at the mall he patrols, discovering an unexpected refuge and a new sense of self in a world not yet ready to make space for them.","synopsis":"In his feature directorial debut, director Joaquín Ruano carefully deploys a cinematic language of nuance, restraint, and clarity. As Romero and Nubia’s developing relationship blooms in the midst of perils and tensions, Ruano quietly opens new ways to witness this unexpected intimacy. Romero finds refuge where he least expected — and even without knowing he was desperately searching for it — and discovers an affection that is as fragile as it is tender. Inside the safe space Nubia creates for both of them, Romero finds a version of himself he wasn’t aware had previously existed. The harsh world around them may never truly leave them alone.","screenings":[{"Title":"Nosotros","Director":"Joaquín Ruano","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"21:40","EndTime":"22:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Nosotros","Director":"Joaquín Ruano","Blurb":"","Category":"Discovery","Date":"Sat Sep 12","StartTime":"18:30","EndTime":"20:19","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Nosotros","Director":"Joaquín Ruano","Blurb":"","Category":"Discovery","Date":"Mon Sep 14","StartTime":"15:15","EndTime":"17:04","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","Aud nexpectedly heartfelt romances.","synopsis":"Jodie Comer (TIFF ’23’s The End We Start From ) is sensational as the fiercely independent Araminta. She is matched beat for beat by Harry Melling (TIFF ’23’s Shoshana ), whose fearless performance transforms Bernie into one of the year’s most endearing screen oddballs. Under Rhys’ confident direction, the duo give the film its beating heart, grounding even its wildest flights of imagination in genuine longing, humour, and tenderness as the story spirals toward an unforgettable conclusion. Co-writer and composer Joss Holden-Rea\u0027s wonderfully idiosyncratic songs weave seamlessly into the narrative, creating a musical language as bold and adventurous as the film itself.","screenings":[{"Title":"Stuffed","Director":"Theo Rhys","Blurb":"","Category":"Discovery","Date":"Thu Sep 10","StartTime":"17:30","EndTime":"19:57","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Stuffed","Director":"Theo Rhys","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"11:50","EndTime":"13:47","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Stuffed","Director":"Theo Rhys","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"21:20","EndTime":"23:47","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Stuffed","Director":"Theo Rhys","Blurb":"","Category":"Discovery","Date":"Sun Sep 20","StartTime":"19:00","EndTime":"21:27","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Voices","slug":"voices","category":"Discovery","categorySlug":"discovery","director":"Deanté Gray","premiere":"International Premiere","cast":"Francis Edemobi, Ezekiel Ajeigbe, Raél Ba, Pedro Louis, Joe Maye, Jamal Averett","image":"https://images.ctfassets.net/22n7d68fswlw/QttmH0UB67KKJhSxksToJ/e5d78c8913b4ddd31a3e0dc2bf518336/Voices_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/QttmH0UB67KKJhSxksToJ/e5d78c8913b4ddd31a3e0dc2bf518336/Voices_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"A starry-eyed bellhop (Francis Edemobi) enlists his friends to help him exploit an unsavoury opportunity that could secure them fame and fortune in Deantè Gray’s soulful, suspenseful 1960s-set musical chamber thriller.","synopsis":"Set almost entirely within the claustrophobic confines of a motel suite, director Deantè Gray’s remarkable and resourceful feature debut insightfully reflects the anxieties and frustrations of every artist who has the passion, but lacks the means. Further interrogating the pursuit of fame’s corrupting influence, Sam Buckner III and Charlie T. Savage’s nuanced and noir-ish script is profoundly enlivened by a riveting breakout performance from Edemobi, and supported by the terrific Ezekiel Ajeigbe and Raél Ba who portray reluctant co-conspirators to Jordan’s desperate con. Ajeigebe and Ba especially shine in the film’s infectious musical reveries composed by Buckner with Marcus Shaky and Kev Keys. These numbers endearingly crystalize the character’s emotions as any good musical should, and they are also certifiable bangers that effectively inhabit the soulful sound of the era.","screenings":[{"Title":"Voices","Director":"Deanté Gray","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"11:45","EndTime":"13:24","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Tit
