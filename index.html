ave people living on the edge. Its title reflects a compassionate conviction: these characters are not inherently bad, but worn down by grief, anger, and exhaustion.","screenings":[{"Title":"We Are Born Good","Director":"Leung Chuen Yeung","Blurb":"","Category":"Discovery","Date":"Thu Sep 10","StartTime":"18:00","EndTime":"19:36","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"We Are Born Good","Director":"Leung Chuen Yeung","Blurb":"","Category":"Discovery","Date":"Sun Sep 13","StartTime":"15:10","EndTime":"17:16","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"We Are Born Good","Director":"Leung Chuen Yeung","Blurb":"","Category":"Discovery","Date":"Tue Sep 15","StartTime":"11:00","EndTime":"13:06","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"We Are Born Good","Director":"Leung Chuen Yeung","Blurb":"","Category":"Discovery","Date":"Sun Sep 20","StartTime":"10:15","EndTime":"12:21","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"What Lies Between Us","slug":"what-lies-between-us","category":"Discovery","categorySlug":"discovery","director":"Amalie Næsby Fick","premiere":"World Premiere","cast":"Sidse Babett Knudsen, Sofie Gråbøl, Asta Kamma August","image":"https://images.ctfassets.net/22n7d68fswlw/4m4bhimkWG4uRMf6Qv8Fyi/59b40bda4fcdf2e5faf0776fa394c5d8/WHAT_LIES_BETWEEN_US_still_HERO.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4m4bhimkWG4uRMf6Qv8Fyi/59b40bda4fcdf2e5faf0776fa394c5d8/WHAT_LIES_BETWEEN_US_still_HERO.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"From Danish director Amalie Næsby Fick and a cast led by Sidse Babett Knudsen comes a compelling cautionary tale about the ethical and moral boundaries a parent may cross in order to protect a child.","synopsis":"One of Nordic cinema’s most formidable performers thanks to stellar work in the TV hit Borgen and films such as The Duke of Burgundy (TIFF ’14) and Limbo (TIFF ’20), Knudsen brings her customary fierceness and intelligence to a character whose maternal propensities drive her toward a moral breaking point. She’s matched at every turn by Gråbøl (TIFF ’25’s The Last Viking ) and August (also at this year’s Festival in Growth of the Soil) . Working from the layered yet expertly paced screenplay by Sara Jønsson and Nikolaj Arcel ( The Promised Land , TIFF ’23), Næsby Fick makes a confident transition from animation and television to live-action features. With What Lies Between Us , she presents viewers with a compelling, timely story about the boundaries of love, ethics, and loyalty.","screenings":[{"Title":"What Lies Between Us","Director":"Amalie Næsby Fick","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"17:30","EndTime":"19:15","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"What Lies Between Us","Director":"Amalie Næsby Fick","Blurb":"","Category":"Discovery","Date":"Fri Sep 11","StartTime":"20:30","EndTime":"22:45","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"What Lies Between Us","Director":"Amalie Næsby Fick","Blurb":"","Category":"Discovery","Date":"Sun Sep 13","StartTime":"21:00","EndTime":"23:15","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"What Lies Between Us","Director":"Amalie Næsby Fick","Blurb":"","Category":"Discovery","Date":"Sat Sep 19","StartTime":"21:30","EndTime":"23:45","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Zjili: A Story of Sisterhood and The Burdens of Excess","slug":"zjili-a-story-of-sisterhood-and-the-burdens-of-excess","category":"Discovery","categorySlug":"discovery","director":"Hajara Musah Chambas, Christine Boateng","premiere":"World Premiere","cast":"Esinam Semordzi, Zaharawu Fuseini, Rahana Abdallah","image":"https://images.ctfassets.net/22n7d68fswlw/7BF1actRMhXnNrz0CTeHQ6/6e94955468c4396d6d2a31378bc024cf/Zjili_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/7BF1actRMhXnNrz0CTeHQ6/6e94955468c4396d6d2a31378bc024cf/Zjili_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"In their poignant debut feature, co-directors Christine Boateng and Hajara Musah Chambas depict the journey of three Ghanaian women eking out a living as \u003cem\u003ekayayei\u003c/em\u003e or porters in the trenches of the world’s largest secondhand clothing market.","synopsis":"In Zjili: A Story of Sisterhood and the Burden of Excess — “zjili” means “heavy” in Dagbani, spoken in northern Ghana — ambitious teenager Zoya (Abdullah Rahana) leaves her village by herself and settles in Old Fadama, a precarious settlement in Accra straddling both the world’s largest secondhand clothing market and an enormous e-waste dumpsite. There, Zoya hopes to earn enough money to continue her education. She meets Teiya (Esinam Semordzi), a young mother and part-time kayayo who dreams of owning a hairdressing salon, and Charpang (Zarahawu Fuseini), a landlady haunted by painful memories. The three, drawn together by the harsh realities of urban life,  powerfully represent intergenerational threads connecting women.","screenings":[{"Title":"Zjili: A Story of Sisterhood and The Burdens of Excess","Director":"Hajara Musah Chambas, Christine Boateng","Blurb":"","Category":"Discovery","Date":"Thu Sep 10","StartTime":"18:00","EndTime":"19:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Zjili: A Story of Sisterhood and The Burdens of Excess","Director":"Hajara Musah Chambas, Christine Boateng","Blurb":"","Category":"Discovery","Date":"Mon Sep 14","StartTime":"18:30","EndTime":"20:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Zjili: A Story of Sisterhood and The Burdens of Excess","Director":"Hajara Musah Chambas, Christine Boateng","Blurb":"","Category":"Discovery","Date":"Wed Sep 16","StartTime":"20:30","EndTime":"22:59","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 8","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Zjili: A Story of Sisterhood and The Burdens of Excess","Director":"Hajara Musah Chambas, Christine Boateng","Blurb":"","Category":"Discovery","Date":"Fri Sep 18","StartTime":"12:25","EndTime":"14:54","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"All About Corinne","slug":"all-about-corinne","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Marc Fitoussi","premiere":"North American Premiere","cast":"Isabelle Huppert, Sandrine Kiberlain, Anne Marivin, Emmanuelle Bercot, Ana Girardot, Diane Kruger","image":"https://images.ctfassets.net/22n7d68fswlw/4SEShEDzwyWdFmH7o5mbTU/aff49c91e53f8798b450fd1436855069/All-About-Corinne_Hero.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4SEShEDzwyWdFmH7o5mbTU/aff49c91e53f8798b450fd1436855069/All-About-Corinne_Hero.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cem\u003eParis Follies\u003c/em\u003e writer-director Marc Fitoussi re-teams with the inimitable, Oscar-nominated Isabelle Huppert (TIFF ’16’s \u003cem\u003eElle\u003c/em\u003e) for this delectable comedy about a veteran background actor who spies a belated chance to break into the fickle family of \u003cem\u003ele cinéma français\u003c/em\u003e.","synopsis":"Playful, absorbing, and rife with insider wit, All About Corinne allows us to root for the underdog while rubbing elbows with royalty. Echoing the meta-hijinks of hit satire Call My Agent! ( Dix pour cent ), for which Fitoussi directed six episodes, the film features a grand assemblage of beloved stars — Kiberlain, Emmanuelle Bercot, Anne Marivin ,  Ana Girardot, Vincent Dedienne, and Thomas Jolly — playing themselves. This makes the irony of casting Huppert, one of the world’s boldest and most versatile actors, as a cinematic minion that much more delicious. If she can’t make it, no one can.","screenings":[{"Title":"All About Corinne","Director":"Marc Fitoussi","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 10","StartTime":"08:50","EndTime":"10:45","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"All About Corinne","Director":"Marc Fitoussi","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"17:30","EndTime":"19:55","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"All About Corinne","Director":"Marc Fitoussi","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15"," e about to get an opportunity for some serious field study. Having just left her husband Luke (Stevens), their pal Eliza (Kate Berlant, TIFF ’25’s Maddie’s Secret ) comes to stay while she looks for a new home — and brings her young daughter along with her. Will witnessing the joys and sorrows of parenting up close tip the scales one way or another? Will ambivalence reign until Annie and Aaron simply age out?","screenings":[{"Title":"Babies","Director":"Lauren Miller Rogen","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 12","StartTime":"17:30","EndTime":"19:36","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Babies","Director":"Lauren Miller Rogen","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"11:45","EndTime":"13:21","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Babies","Director":"Lauren Miller Rogen","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"18:10","EndTime":"20:16","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Babies","Director":"Lauren Miller Rogen","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"09:15","EndTime":"11:21","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Being Heumann","slug":"being-heumann","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Siân Heder","premiere":"World Premiere","cast":"Ruth Madeley, Madeline Delp, Mark Ruffalo, Dylan O\u0026#39;Brien, Rob Delaney, Daniel Durant, Roberta Colindrez, Antwan Tolliver, Jon Beavers, Ray Fisher, Andrew Pilkington, Michael Patrick Thornton, Russell Harvard, Charlie Rush-Reese, Rio Finnegan, D\u0026#39;Arcee Charrington Neal, Will Brill, Matthew August Jeffers, Sienna Rafter, Rein Barcel","image":"https://images.ctfassets.net/22n7d68fswlw/4q5Noi2FPfc74G9Imwts8C/707a8c9034ae6caafb135ece937335d8/Being_Heumann_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4q5Noi2FPfc74G9Imwts8C/707a8c9034ae6caafb135ece937335d8/Being_Heumann_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Featuring a breakout performance by Ruth Madeley and Oscar nominee Mark Ruffalo (TIFF ’15’s \u003cem\u003eSpotlight\u003c/em\u003e), this inspiring historical drama from Oscar-winning filmmaker Siân Heder (\u003cem\u003eCODA\u003c/em\u003e) celebrates the paradigm-shifting activist Judy Heumann, “Mother of the Disability Rights Movement.”","synopsis":"The year is 1977. Raised in Brooklyn by German Jewish immigrants, and using a wheelchair since a childhood case of polio, Judy Heumann (Ruth Madeley) knows it takes grit and tenacity to get things done. So when Secretary of Health, Education and Welfare Joseph Califano (Mark Ruffalo) refuses to sign meaningful regulations for Section 504 of the Rehabilitation Act of 1973, the first national civil rights legislation designed to provide protections for people with disabilities, Judy devises a plan to force his hand, beginning with the occupation of a federal building in San Francisco, before going all the way to DC — and Califano’s front door — with a diverse team of self-described “radical crips,” creating solidarity through coalitions of marginalized groups.","screenings":[{"Title":"Being Heumann","Director":"Siân Heder","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 10","StartTime":"18:00","EndTime":"20:37","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capac enegger","image":"https://images.ctfassets.net/22n7d68fswlw/19a2QFScU4D6qn3TYXhOGx/9e38e5ab25497ead866000bd45e5f88e/BUNKER-HRO?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/19a2QFScU4D6qn3TYXhOGx/9e38e5ab25497ead866000bd45e5f88e/BUNKER-HRO?w=1280\u0026h=720\u0026fit=thumb","blurb":"Oscar winners Penélope Cruz and Javier Bardem play a couple whose bond is tested when a mysterious billionaire’s proposal prompts an ethical impasse in the latest from Oscar-winning writer-director Florian Zeller (TIFF ’20’s \u003cem\u003eThe Father\u003c/em\u003e).","synopsis":"In 17 years of marriage, literary agent Sofia (Cruz, also at this year’s Festival in La Bola Negra ) has never resented her “starchitect” husband Miguel (Bardem, also at this year’s Festival in The Beloved ) for uprooting the family from Madrid to London, where he rose to prominence. Fissures appear in their foundation, however, when a mysterious billionaire (Paul Dano, TIFF ’25’s The Wizard of the Kremlin ) asks Miguel to design a luxury bunker where a tiny cluster of the ultra-wealthy can take shelter in an apocalypse.","screenings":[{"Title":"Bunker","Director":"Florian Zeller","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"21:30","EndTime":"00:06","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"Bunker","Director":"Florian Zeller","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15","StartTime":"08:00","EndTime":"10:06","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Bunker","Director":"Florian Zeller","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15","StartTime":"11:00","EndTime":"13:36","Venue":"VISA Screening Room at the Princess of Wales Theatre", unt, Danielle Macdonald, and Thomas Michael Allen. For all the stranger-than-fiction, psychopathic twists, the story’s greatest mystery might be the invincible affection of the wildly disturbed kind-of couple at the peak of this pyramid of ruin.","screenings":[{"Title":"Evil Genius","Director":"Courteney Cox","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 12","StartTime":"14:00","EndTime":"16:04","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Evil Genius","Director":"Courteney Cox","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"08:15","EndTime":"09:49","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Evil Genius","Director":"Courteney Cox","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"14:00","EndTime":"16:04","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Evil Genius","Director":"Courteney Cox","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"21:20","EndTime":"23:24","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Evil Genius","Director":"Courteney Cox","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 20","StartTime":"18:00","EndTime":"20:04","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 13","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Girl Group","slug":"girl-group","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Rebel Wilson","premiere":"World Premiere","cast":"Rebel Wilson, Randall Park, Sheridan Smith, Melanie Chisholm, Nicole Scherzinger, Jamie-Lee O\u0026#39;Donnell, Shaznay Lewis, Ashley Roberts, Judi Love, Guz Khan, Chabely Ponce, Daniela Couso, Lilah Pate, Mia Kaplan, Bailey Stender, Loren Gray, Miracle Washington, Ana Yi Puig, Keith Duffy, Chris Colfer, Bechill, Jolene, Sally Hawkins, Jennifer Coolidge","image":"https://images.ctfassets.net/22n7d68fswlw/59MT2nFv2OsdTHMeJD6XLQ/fd2d66260dde813823874979606a089d/girl-group.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/59MT2nFv2OsdTHMeJD6XLQ/fd2d66260dde813823874979606a089d/girl-group.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Rebel Wilson writes, directs, and stars in this story of a pop star who, following a downward spiral, finds a new sense of purpose by assembling a bunch of young up-and-comers to form a group of their own.","synopsis":"At first, there’s apprehension from all sides as the group struggles to find their voices and to establish a connection with their reluctant mentor. But as Tassie lets her guard down and gets to know each girl\u0027s story, the group starts to gel and even the jaded pop-star burnout begins to see new glimmers of light in her life. Tassie just might be the mentor she never had. Wilson assembles a hilarious cast of comedians and entertainers including Jennifer Coolidge, Randall Park, Nicole Scherzinger, Judi Love, and Sally Hawkins. True to the genre, the energized girl group is full of fresh faces, talent, and personality. With a fantastic soundtrack that includes classic earworms and original songs, this is at once an ode to some of our favourite pop acts and vibrant proof that the hits just keep on coming.","screenings":[{"Title":"Girl Group","Director":"Rebel Wilson","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"17:30","EndTime":"19:38","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","Au is inspired comedy about a woman on the road to magic-cube mastery is a story of galvanizing gamesmanship and ageless defiance.","synopsis":"The rebellious Zhao Yanhong (Yeoh) was not meant for life in a nursing home — so she causes a commotion every chance she gets. Her days of mind-numbing routine and placating caregivers get a welcome shake-up when she meets Gen-Z slacker Wu Youwei (Liu Haoran), a one-time magic-cubing champion now reduced to performing cheap tricks in night markets. Determined to learn the art of the magic cube, Zhao enlists this humbled whiz kid as her mentor — and the pair discover an unlikely chemistry. With every leap in skill, however, Zhao unexpectedly finds herself confronting a personal history freighted with unfinished business and regrets. As she readies herself for the World Cubing Championship, our hero will have to bring all her inner resources to the stage — which means reckoning with the past as a means of mastering the present.","screenings":[{"Title":"It\u0027s My Time","Director":"Bai Xue","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15","StartTime":"12:15","EndTime":"14:02","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"It\u0027s My Time","Director":"Bai Xue","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 17","StartTime":"21:30","EndTime":"23:47","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"It\u0027s My Time","Director":"Bai Xue","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"15:20","EndTime":"17:37","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"It\u0027s My Time","Director":"Bai Xue","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 20","StartTime":"09:30","EndTime":"11:47","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Life and Deaths of Wilson Shedd","slug":"the-life-and-deaths-of-wilson-shedd","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Tim Blake Nelson","premiere":"World Premiere","cast":"Amanda Seyfried, Scoot McNairy, Wunmi Mosaku, Devyn Tyler, Missi Pyle, Grant Harvey, William Jackson Harper, Tim Blake Nelson, Elizabeth Marvel","image":"https://images.ctfassets.net/22n7d68fswlw/7iW38kmB1aL2T39RINkin3/af2b806f012a1f2389b0c68bdd0ff7ca/Life_and_Deaths_of_Wilson_Shedd_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/7iW38kmB1aL2T39RINkin3/af2b806f012a1f2389b0c68bdd0ff7ca/Life_and_Deaths_of_Wilson_Shedd_01.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eStarring Oscar nominee Amanda Seyfried (\u003cem\u003eThe Testament of Ann Lee\u003c/em\u003e, TIFF ’25) and Scoot McNairy (\u003cem\u003eNightbitch\u003c/em\u003e, TIFF ’24), the latest from Tim Blake Nelson is a psychologically rich prison story about crime, punishment, and love.\u003c/p\u003e","synopsis":"Set in Nelson’s home state of Oklahoma, The Life and Deaths of Wilson Shedd poses tough questions regarding American justice and the moral purpose of incarceration. The film is also the finest example yet of the writer-director-actor’s singular ability to follow troubled characters as they tumble headlong into unfathomable dilemmas. In Seyfried’s brilliant depiction, Karen brims with emotional complexity, while McNairy immerses himself in a demanding role, one that keeps us wondering how much we can ever really surmise about someone else’s inner life — and how we survey the limits of our own humanity.","screenings":[{"Title":"The Life and Deaths p?w=1280\u0026h=720\u0026fit=thumb","blurb":"This galvanizing portrait celebrates Rick Hansen, the great Canadian athlete and activist. It chronicles his 26-month Man In Motion World Tour: a 40,000-kilometre wheelchair journey that raised millions to eliminate accessibility barriers and transform public perception of people with disabilities.","synopsis":"Rick Hansen grew up playing sports, but a car accident at age 15 paralyzed him from the waist down. Remarkably, Hansen turned this life-altering event into a catalyst. He became the first student with a disability to graduate from the University of British Columbia with a degree in physical education, captured national championships in wheelchair volleyball and basketball, and went on to win six Paralympic medals in wheelchair racing. In 1985, galvanized by his friend Terry Fox’s Marathon of Hope — the subject of fellow Gala Presentation Run Terry Run — Hansen undertook the 26-month Man in Motion World Tour, traversing 40,075 km across 34 countries in his wheelchair, raising $26 million for the removal of barriers, forever changing public perception of people with disabilities, and inspiring David Foster and John Parr’s massive hit “St. Elmo\u0027s Fire (Man in Motion).”","screenings":[{"Title":"Man in Motion: The Rick Hansen Story","Director":"Adrian Buitenhuis","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"13:30","EndTime":"15:36","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Man in Motion: The Rick Hansen Story","Director":"Adrian Buitenhuis","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 12","StartTime":"08:45","EndTime":"10:21","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Man in Motion: The Rick Hansen Story","D h bipolar disorder, who gets into serious trouble. As pressure to procure funds mounts, Misty finds herself considering an offer by her former flame (Driver) that’s simultaneously heinous and lucrative beyond her wildest dreams.","screenings":[{"Title":"Misty Green","Director":"Chris Rock","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 12","StartTime":"21:30","EndTime":"23:43","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"Misty Green","Director":"Chris Rock","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"08:40","EndTime":"10:23","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Misty Green","Director":"Chris Rock","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"21:00","EndTime":"23:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Misty Green","Director":"Chris Rock","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"12:10","EndTime":"14:23","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Misty Green","Director":"Chris Rock","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"15:00","EndTime":"17:13","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Only Living Pickpocket in New York","slug":"the-only-living-pickpocket-in-new-york","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Noah Segan","premiere":"Canadian Premiere","cast":"John Turturro, Giancarlo Esposito, Will Price, Tatiana Maslany, Steve Buscemi","image":"https://images.ctfassets.net/22n7d68fswlw/3mI6pfAhH5hleUSzmBmGzX/9eab27c5cbaa0d1d58b4192a3f7c8084/TheOnlyLivingPickpocketinNewYork_still_HERO.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3mI6pfAhH5hleUSzmBmGzX/9eab27c5cbaa0d1d58b4192a3f7c8084/TheOnlyLivingPickpocketinNewYork_still_HERO.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"\u003cp\u003eAnchored by John Turturro’s charismatic performance, this low-key crime drama from Noah Segan (\u003cem\u003eBlood Relatives\u003c/em\u003e) harkens back to the character-driven films of 1970s New Hollywood.\u003c/p\u003e","synopsis":"A craftsman pickpocket from the old school, Harry (Turturro) adheres to a routine, operates alone, and doesn’t own a smartphone. He works mainly on public transport, sells his spoils to his pawnbroker pal Ben (Buscemi, also at this year’s Festival in Wild Horse Nine ), and goes home to his Bronx apartment every night to look after his ailing spouse. But hubris gets the best of Harry: he winds up stealing from Dylan (Will Price, TIFF ’25’s Eleanor the Great ), the insufferable scion of a connected crime family, and must traverse the city in an attempt to crawl out of a potentially deadly bind before the day is through.","screenings":[{"Title":"The Only Living Pickpocket in New York","Director":"Noah Segan","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 10","StartTime":"15:10","EndTime":"16:38","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Only Living Pickpocket in New York","Director":"Noah Segan","Blurb":"","Category":"Gala Presentations","Date":"Wed Sep 16","StartTime":"17:30","EndTime":"19:28","Venue":"Roy Thomson Hall","Room":"Roy Th r his employment. But as time passes — those “five good years” their neurologist prognosed — their lives increasingly intersect, most especially at the Parkinson ballet class, where they find community — and each other.","screenings":[{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 10","StartTime":"09:05","EndTime":"10:55","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Buyer","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"11:50","EndTime":"13:40","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 6","Capacity":"","IsPremium":"False","AudienceType":"Buyer","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"14:00","EndTime":"16:25","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"08:40","EndTime":"10:35","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"18:20","EndTime":"20:45","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Onwards and Sideways","Director":"John Madden","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime" zie Miller’s globally acclaimed play that examines what happens when an ambitious barrister who primarily defends those accused of sex crimes unexpectedly becomes the accuser in a sexual assault case.","synopsis":"Having risen from a working-class background to a successful career in law, Tessa (Erivo) does not suffer fools. She is a formidable presence in the courtroom, expertly dismantling opposing arguments, uncovering vulnerabilities, and holding her adversaries to the highest standards of jurisprudence. For Tessa, the nature of a client’s alleged crime is irrelevant: she believes the legal system operates optimally when all parties are given the strongest possible representation. However, her life is turned upside down when she is sexually assaulted by a colleague, forcing her to experience first-hand just how merciless — and misogynistic — the law can be toward already-traumatized women who are merely seeking justice.","screenings":[{"Title":"Prima Facie","Director":"Susanna White","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"17:45","EndTime":"20:01","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Prima Facie","Director":"Susanna White","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"09:00","EndTime":"10:46","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Prima Facie","Director":"Susanna White","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"12:10","EndTime":"14:26","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Prima Facie","Director":"Susanna White","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"18:45","EndTime":"21:01","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Prima Facie","Director":"Susanna White","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"21:00","EndTime":"23:16","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Run Terry Run","slug":"run-terry-run","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Sean Menard","premiere":"","cast":"Terry Fox, Darrell Fox, Doug Alward, Leslie Scrivener, Darryl Sittler, Bill Vigars","image":"https://images.ctfassets.net/22n7d68fswlw/2Fy8OMsgQ2lElUkcQCYmpD/0cd160dd05ddfad28505d7a0e2cef0d2/Run-Terry-Run_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/2Fy8OMsgQ2lElUkcQCYmpD/0cd160dd05ddfad28505d7a0e2cef0d2/Run-Terry-Run_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"This intimate and inspiring portrait from filmmaker Sean Menard (TIFF ’17’s \u003cem\u003eThe Carter Effect\u003c/em\u003e) draws upon never-before-seen footage to reveal the arduous process and profound commitment behind Terry Fox’s Marathon of Hope to raise awareness and money for cancer research.","synopsis":"It’s a story every Canadian child learns at school: in April 1980, 21-year-old Terrance Stanley Fox set out from St. John’s, Newfoundland and Labrador, to raise awareness and funding for cancer research. Having an amputated right leg due to osteosarcoma, Fox was forced to use a poorly fitted, off-the-shelf artificial limb (advanced running prosthetics did not yet exist). Nevertheless, over 143 days, he ran a full marathon every day, traversing more than 5,000 kilometres. Fox made it all the way to Thunder Bay, Ontario, where unfortunately, the cancer had spread to his lungs, forcing him to stop. Fox died ten months later. Every year since, the Terry Fox Run honours his legacy and inspires millions of participants, now in upwards of 60 countries, to continue running for the cause.","screenings":[{"Title":"Run Terry Run","Director":"Sean Menard","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"08:30","EndTime":"10:18","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Run Terry Run","Director":"Sean Menard","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"15:25","EndTime":"17:13","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Run Terry Run","Director":"Sean Menard","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"16:15","EndTime":"18:33","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Run Terry Run","Director":"Sean Menard","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 20","StartTime":"10:00","EndTime":"12:18","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Spirit Guardians: The Last Secret of the First Emperor","slug":"spirit-guardians-the-last-secret-of-the-first-emperor","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Nguyễn Phan Quang Binh","premiere":"International Premiere","cast":"Tuan Tran, Tran Thien Tu, Johnny Tri Nguyen, Tu Long, Quach Ngoc Ngoan, Do Thi Hai Yen, Le Vu Long, Hua Vi Van, Le Minh Thuan, Danis Nguyen, Dang Tran, Tran Quang Loc, Hien Ngo, Diep Quang Binh, Thai Tran","image":"https://images.ctfassets.net/22n7d68fswlw/27uFfCVhm8c6oVwFW1U971/5a4359fed9a71385d396d3a835aa9dd9/Spirit-Guardians-The-Last-Secret-of-the-First-Emperor_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/27uFfCVhm8c6oVwFW1U971/5a4359fed9a71385d396d3a835aa9dd9/Spirit-Guardians-The-Last-Secret-of-the-First-Emperor_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"The largest production in Vietnamese history, this sweeping epic from Nguyễn Phan Quang Binh (\u003cem\u003eThe Floating Lives\u003c/em\u003e) transports us to the Đinh dynasty, when a band of fearless warriors set out on a secret mission to safeguard a sacred mystery.","synopsis":"The largest production in the history of Vietnamese cinema, this sweeping epic from director Nguyễn Phan Quang Binh ( The Floating Lives ) transports us to the era of the Đinh dynasty, when a diverse band of fearless warriors set out on a secret mission to safeguard a sacred mystery. Featuring an ensemble cast led by Tuấn Trần ( Mai ), Johnny Trí Nguyễn (Spike Lee’s Da 5 Bloods ), and Đỗ Thị Hải Yến (TIFF ’02’s The Quiet American ), Spirit Guardians: The Last Secret of the First Emperor is a spectacular tale of heroism and sacrifice.","screenings":[{"Title":"Spirit Guardians: The Last Secret of the First Emperor","Director":"Nguyễn Phan Quang Binh","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"12:45","EndTime":"15:16","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Spirit Guardians: The Last Secret of the First Emperor","Director":"Nguyễn Phan Quang Binh","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"17:30","EndTime":"20:31","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False"," me novels were the source material for such classic films as Hitchcock’s Strangers on a Train and The Talented Mr. Ripley . Adapted by Joanna Murray-Smith from her play Switzerland and starring Alden Ehrenreich (TIFF ’23’s Fair Play ), Olivia Cooke (TIFF ’19’s Sound of Metal ; also at this year’s Festival in Slow Horses ) and Oscar winner Helen Mirren, A Talent For Murder pits ruthless careerism against dark genius in a slippery battle of wills.","screenings":[{"Title":"A Talent for Murder","Director":"Anton Corbijn","Blurb":"","Category":"Gala Presentations","Date":"Mon Sep 14","StartTime":"13:30","EndTime":"15:46","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"A Talent for Murder","Director":"Anton Corbijn","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15","StartTime":"12:00","EndTime":"13:46","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"A Talent for Murder","Director":"Anton Corbijn","Blurb":"","Category":"Gala Presentations","Date":"Tue Sep 15","StartTime":"15:20","EndTime":"17:36","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Tenzing","slug":"tenzing","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Jennifer Peedom","premiere":"Canadian Premiere","cast":"Genden Phuntsok, Tom Hiddleston, Willem Dafoe, Caitríona Balfe, Tenzin Dalha, Thinley Lhamo","image":"https://images.ctfassets.net/22n7d68fswlw/4ks8LBaDSAHlOwXFLPdEYK/c71ab3b6df2236342cce3de898cf6fba/tenzing_01.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4ks8LBaDSAHlOwXFLPdEYK/c71ab3b6df2236342cce3de898cf6fba/tenzing_01.web orm of leukemia, but that, given the nature of Rose’s genetic disorder, their best bet at keeping the child healthy and alive is to for Álvaro and Saffron to produce a second child who could provide a transfusion. The ex-spouses balk at the idea — and their new partners don’t fancy it either — but they may have no choice but to bury the hatchet (in bed).","screenings":[{"Title":"Up Against It","Director":"Trudie Styler","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 12","StartTime":"08:15","EndTime":"10:17","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Up Against It","Director":"Trudie Styler","Blurb":"","Category":"Gala Presentations","Date":"Thu Sep 17","StartTime":"17:30","EndTime":"20:02","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Up Against It","Director":"Trudie Styler","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 18","StartTime":"15:10","EndTime":"17:42","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Up Against It","Director":"Trudie Styler","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"18:45","EndTime":"21:17","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Villeneuve: The Rise of a Legend","slug":"villeneuve-the-rise-of-a-legend","category":"Gala Presentations","categorySlug":"gala-presentations","director":"Yan Lanouette Turgeon","premiere":"World Premiere","cast":"Rémi Goulet, Rosalie Bonenfant, Patrice Robitaille, Anick Lemay, Luc Picard, Fabien Cloutier, Hubert Proulx, Étienne Galloy, Joe Cobden, Neil Webb, Frank Crudele","image":"https://images.ctfassets.net/22n7d68fswlw/5qhW0fnkCeuAPtXJFaNGeT/87e395e401c4641c7e00b267b00cb607/Villeneuve-The-Rise-of-a-Legend_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5qhW0fnkCeuAPtXJFaNGeT/87e395e401c4641c7e00b267b00cb607/Villeneuve-The-Rise-of-a-Legend_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Chronicling the exhilarating career of Gilles Villeneuve, one of Canada’s foremost athletes, this biopic from director Yan Lanouette Turgeon stars Rémi Goulet as the kid from Quebec who changed Formula One.","synopsis":"In 1970 he marries Joann (Rosalie Bonenfant), with whom he will go on to have two children, but Gilles is not one to settle down. While the upper echelons of competitive racing seem elusive, the exclusive domain of the elite, Gilles persists. He finally makes his Formula One debut at the 1977 British Grand Prix, where he impresses famed entrepreneur and driver Enzo Ferrari (Frank Crudele, TIFF ’04’s Saint Ralph , who helps Gilles take the fast track to his dreams.","screenings":[{"Title":"Villeneuve: The Rise of a Legend","Director":"Yan Lanouette Turgeon","Blurb":"","Category":"Gala Presentations","Date":"Fri Sep 11","StartTime":"19:15","EndTime":"20:57","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 7","Capacity":"","IsPremium":"False","AudienceType":"Buyer","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Villeneuve: The Rise of a Legend","Director":"Yan Lanouette Turgeon","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 13","StartTime":"09:15","EndTime":"10:57","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Villeneuve: The Rise of a Legend","Director":"Yan Lanouette Turgeon","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"18:00","EndTime":"20:12","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Villeneuve: The Rise of a Legend","Director":"Yan Lanouette Turgeon","Blurb":"","Category":"Gala Presentations","Date":"Sat Sep 19","StartTime":"20:00","EndTime":"22:12","Venue":"Roy Thomson Hall","Room":"Roy Thomson Hall","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Villeneuve: The Rise of a Legend","Director":"Yan Lanouette Turgeon","Blurb":"","Category":"Gala Presentations","Date":"Sun Sep 20","StartTime":"12:50","EndTime":"15:02","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"In Conversation With... Andrew Scott","slug":"in-conversation-with-andrew-scott","category":"In Conversation With...","categorySlug":"in-conversation-with","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/3SrdeiSmTr2h4wSWW2pBsX/6b238bb1c0e31c948ddbf6539d920d1f/Andrew-Scott_Headshot.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3SrdeiSmTr2h4wSWW2pBsX/6b238bb1c0e31c948ddbf6539d920d1f/Andrew-Scott_Headshot.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Looks like there\u0027s no summary for this.","synopsis":"Here at TIFF ’26 with one of the standout performances of the year in Elsinore , Andrew Scott proves once and for all that he’s one of the most versatile and captivating performers of our time. While his role as the charismatic priest in Phoebe Waller-Bridge’s Fleabag introduced Scott to a wider audience, devoted fans had been following his work for years, including his electrifying turn as Moriarty in Sherlock , where he transformed the iconic villain into a captivating force of chaos. Scott first came to the Festival in 2014 with Matthew Warchus’ Pride , as part of an ensemble cast celebrating the history of LGBTQ+ activism in the UK, and returned most recently in 2025 as part of the acclaimed Knives Out franchise with Wake Up Dead Man: A Knives Out Mystery and Richard Linklater’s celebrated Blue Moon . Scott has emerged as one of the leading actors bringing complex queer experiences to the screen — from Andrew Haigh’s All of Us Strangers , an intimate meditation on longing, grief, family, and memory, to his chilling transformation in Netflix’s Ripley , a dark reimagining of The Talented Mr. Ripley . In Elsinore , a film he also produced, Scott delivers a deeply personal and powerful performance as actor Ian Charleson, who in his final years summons exceptional courage to overcome immense physical challenges and deliver a defining performance of Hamlet at London’s National Theatre while living with AIDS. The conversation will explore the remarkable range of Scott’s career and celebrate this extraordinary new performance.","screenings":[{"Title":"In Conversation With... Andrew Scott","Director":"","Blurb":"","Category":"In Conversation With...","Date":"Sat Sep 12","StartTime":"14:30","EndTime":"16:00","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"In Conversation With... Chris Rock","slug":"in-conversation-with-chris-rock","category":"In Conversation With...","categorySlug":"in-conversation-with","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/5KfZB98aEw7wB4XPBBBSoK/57c48697b5e2f1f77fadde85a36387fc/ICW_CRock.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/5KfZB98aEw7wB4XPBBBSoK/57c48697b5e2f1f77fadde85a36387fc/ICW_CRock.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Looks like there\u0027s no summary for this.","synopsis":"As he presents the TIFF ’26 World Premiere of his latest film Misty Green , Emmy and Grammy Award–winning director, writer, actor, producer, and comedian Chris Rock joins us for a conversation about his multi-faceted career in front of and behind the camera. After his breakthrough on Saturday Night Live in the early 1990s — as part of an iconic cast that included Adam Sandler, Chris Farley, and David Spade — Rock re-defined the landscape of stand-up comedy with his sharp, incisive special Bring the Pain (1996). The groundbreaking set catapulted him to superstardom and earned him two Emmys. Tackling socio-political issues like race relations, class division, and the justice system with piercing fervor, Rock has crafted an indelible onstage persona over the past three decades. Beyond stand-up, his career spans Hollywood blockbusters, hit television series, and acclaimed independent filmmaking. He produced and starred in the lauded documentary Good Hair (TIFF ’09), which won the Special Jury Prize Documentary at Sundance, and later moved into the director’s chair for the deeply personal Top Five (TIFF ’14). He returns to the Festival with Misty Green , a film destined to further cement his status as one of Hollywood’s most original creative voices.","screenings":[{"Title":"In Conversation With... Chris Rock","Director":"","Blurb":"","Category":"In Conversation With...","Date":"Sun Sep 13","StartTime":"11:45","EndTime":"13:15","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"In Conversation With... Lee Min-ho","slug":"in-conversation-with-lee-min-ho","category":"In Conversation With...","categorySlug":"in-conversation-with","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/4yLb9hFVVPE3F9e3FCC9ei/6649c0caab51ab227da99678cfa44530/Lee-Min-Ho_Headshot-_Landscape_.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/4yLb9hFVVPE3F9e3FCC9ei/6649c0caab51ab227da99678cfa44530/Lee-Min-Ho_Headshot-_Landscape_.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Looks like there\u0027s no summary for this.","synopsis":"Paging all devoted Minoz (미노즈): Join us at TIFF ’26 for an exclusive event celebrating the extraordinary career of global Hallyu icon Lee Min-ho. Here in Toronto for the World Premiere of his new film, The Assassin(s ), co-starring Yoo Hai-jin ( Exhuma ) and Park Hae-il ( Decision to Leave , TIFF ’22), and directed by Hur Jin-ho (A Normal Family , TIFF ’23). For nearly two decades, Lee Min-ho has been one of the defining figures of Korean popular culture, introducing generations of global audiences to the world of K-content. His iconic portrayals of Gu Jun-pyo in Boys Over Flowers (2009) and Kim Tan in The Heirs (2013) helped shape the global K-drama phenomenon, while City Hunter (2011) and the historical fantasy Faith (2012) showcased his remarkable versatility, moving effortlessly between stylish action and period drama. He made a successful transition to the big screen with his first leading film role in Gangnam Blues (2015), before further cementing his global popularity as “the king of fantasy romance” through The Legend of the Blue Sea (2016) and The King: Eternal Monarch (2020), captivating audiences worldwide. Pushing the boundaries of his craft, Lee joined the acclaimed Apple TV+ series Pachinko (2022–present), earning an Independent Spirit Award alongside the ensemble cast and widespread critical recognition. Named the most popular Korean actor in the Overseas Hallyu Survey for 13 consecutive years and recipient of 13 SBS Drama Awards, the undisputed “Hallyu King” regularly sells out arenas across Asia. Now, Lee joins us for his first North American onstage appearance in over a decade to discuss his defining career journey and his highly anticipated new film, The Assassin(s).","screenings":[{"Title":"In Conversation With... Lee Min-ho","Director":"","Blurb":"","Category":"In Conversation With...","Date":"Thu Sep 17","StartTime":"18:00","EndTime":"19:30","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"In Conversation With... Rachel Morrison","slug":"in-conversation-with-rachel-morrison","category":"In Conversation With...","categorySlug":"in-conversation-with","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/45O5FoMj7ZTaZuaVNiu84y/f84a789da3dbc66958a4033cc1a50cf3/Rachel-Morrison_Headshot.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/45O5FoMj7ZTaZuaVNiu84y/f84a789da3dbc66958a4033cc1a50cf3/Rachel-Morrison_Headshot.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Looks like there\u0027s no summary for this.","synopsis":"Following the acclaimed premiere of her feature directorial debut, The Fire Inside , at TIFF ’24, Academy Award–nominated cinematographer and filmmaker Rachel Morrison returns to the Festival for the World Premiere of her highly anticipated sophomore feature, Love of Your Life — a romantic drama from Amazon MGM Studios starring Margaret Qualley, Aaron Pierre, Patrick Schwarzenegger, Gabriel Basso, and Catherine Keener, and produced by Ryan Gosling and Jessie Henderson. Grounded in photography and backed by formidable technical craft, Morrison has spent two decades moving seamlessly across film, television, fiction, and documentary, establishing herself as a premier visual storyteller. After gaining recognition for her haunting, arresting cinematography on indie highlights like Ryan Coogler’s Fruitvale Station and Dee Rees’ Mudbound (TIFF ’17) — where she made history as the first woman nominated for an Oscar in cinematography — she re-teamed with Coogler to shape the visual identity of Black Panther . Morrison further honed her directorial voice on hit series like The Morning Show and The Mandalorian before bringing the story of boxing legend Claressa Shields to the screen in The Fire Inside, a film celebrated for transcending sports tropes by foregrounding the human weight of victory. Morrison joins us to discuss her remarkable journey from NYU’s Tisch School of the Arts to shooting and directing award-winning indies and major studio blockbusters.","screenings":[{"Title":"In Conversation With... Rachel Morrison","Director":"","Blurb":"","Category":"In Conversation With...","Date":"Tue Sep 15","StartTime":"15:30","EndTime":"17:00","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Making Waves With... Hudson Williams","slug":"making-waves-with-hudson-williams","category":"In Conversation With...","categorySlug":"in-conversation-with","director":"","premiere":"","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/7LL1nJeLhwhaGMFKTEDd4Q/4c7f80400bd4bcd1fa4923cb6de4ebc1/Hudson-Williams_Headshot.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/7LL1nJeLhwhaGMFKTEDd4Q/4c7f80400bd4bcd1fa4923cb6de4ebc1/Hudson-Williams_Headshot.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Looks like there\u0027s no summary for this.","synopsis":"As part of TIFF Next Wave, our year-round initiative empowering young people through the art of cinema, join us for an intimate conversation with Hudson Williams, one of the stars of the Festival Primetime series YAGA from Kat Sandler. Born and raised in British Columbia, Williams spent his youth balancing the arts and sports — training in theatre, music, and dance while simultaneously playing competitive basketball and practicing mixed martial arts. After graduating from Vancouver\u0027s Langara College Film Arts program in 2020, he continued to dive deep into his craft with professional theatre classes. Williams began navigating the Canadian film and television industry while at the same time being a disruptor by writing, directing, producing, and starring in independent short films with a close-knit circle of creative collaborators. His massive breakthrough came when he was cast as Shane Hollander in Jacob Tierney’s award-winning series Heated Rivalry , adapted from the bestselling novels by Rachel Reid. Since its debut in fall 2025, the series has become a global phenomenon, catapulting Williams to international stardom. Williams joins us to discuss his roles in the Crave Original series YAGA and Heated Rivalry , as well as the upcoming independent feature Apparatus . The conversation will explore his cinematic and cultural inspirations and reflect on the early short films, community, and collaborations that helped shape his unique artistic voice.","screenings":[{"Title":"Making Waves With... Hudson Williams","Director":"","Blurb":"","Category":"In Conversation With...","Date":"Thu Sep 17","StartTime":"16:00","EndTime":"17:30","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"Anchors Aweigh","slug":"anchors-aweigh","category":"Midnight Madness","categorySlug":"midnight-madness","director":"Matt Barats","premiere":"International Premiere","cast":"Matt Barats, Serena Profaci, Mike Holt, Felipe Di Poi, Elizabeth Cappucino, Ana Fabrega","image":"https://images.ctfassets.net/22n7d68fswlw/3q0cHXbDCjXxF6yg2hJprl/7b308d6209c70cc568138acfd84ee72a/AnchorsAweigh_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3q0cHXbDCjXxF6yg2hJprl/7b308d6209c70cc568138acfd84ee72a/AnchorsAweigh_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"After a thwarted marriage proposal, alt-comedian Matt Barats spirals into an existential crisis in this semi-autobiographical blend of deadpan absurdism and unexpected poignancy told in a first-person, confessional style à la Ross McElwee or John Wilson.","synopsis":"When an overeager artist (Matt Barats) proposes to his Broadway-bound girlfriend, her perturbed appeal that they “take space” sends him spiralling into a reverie of desperate nostalgia and pitiable self-reflection. Impulsively moving into a sailboat moored by a New York airport, our jilted lover seeks solace by sifting through a stack of home movies, only to be confronted by his own arrested adolescence and the creeping dread that he might indeed be a loveless loser. Such anxiety festers across a series of increasingly surreal vignettes, which Barats stoically narrates with incisive comic precision as his persona wrestles with all the ennui, alienation, and cringe that comes with existence.","screenings":[{"Title":"Anchors Aweigh","Director":"Matt Barats","Blurb":"","Category":"Midnight Madness","Date":"Mon Sep 14","StartTime":"12:15","EndTime":"13:26","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 7","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Anchors Aweigh","Director":"Matt Barats","Blurb":"","Category":"Midnight Madness","Date":"Wed Sep 16","StartTime":"23:59","EndTime":"01:40","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Anchors Aweigh","Director":"Matt Barats","Blurb":"","Category":"Midnight Madness","Date":"Thu Sep 17","StartTime":"16:00","EndTime":"17:41","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Anchors Aweigh","Director":"Matt Barats","Blurb":"","Category":"Midnight Madness","Date":" 0026h=720\u0026fit=thumb","blurb":"Looking to prolong their night of partying, four youths are plunged into paranoid pandemonium after crossing a mobster’s volatile son in Nick Kozakis’ bloody ripper of a siege thriller.","synopsis":"Torn between taking care of her sickly sister and tying one on with her mates, Eden (Markella Kavenagh) succumbs to peer pressure and embarks on an all-night rager. Looking to prolong their revelry with some recreational stimulants, they soon find themselves dropping in on Ray (Nikolai Nikolaeff), a notorious mobster’s volatile son, who runs a drug den atop a dilapidated high-rise in a malignant Melbourne neighbourhood. But what was supposed to be a simple score quickly plummets into paranoid pandemonium as a rash decision triggers a spot of homicide with far too many witnesses. Now, Eden and her friends must fight to survive the night in what transforms into a bloody ripper of a siege thriller.","screenings":[{"Title":"Kick On","Director":"Nick Kozakis","Blurb":"","Category":"Midnight Madness","Date":"Mon Sep 14","StartTime":"23:59","EndTime":"02:00","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Kick On","Director":"Nick Kozakis","Blurb":"","Category":"Midnight Madness","Date":"Tue Sep 15","StartTime":"09:15","EndTime":"10:46","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Kick On","Director":"Nick Kozakis","Blurb":"","Category":"Midnight Madness","Date":"Wed Sep 16","StartTime":"18:45","EndTime":"20:46","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Kick On","Director":"Nick Kozakis","Blurb":"","Category":"Midnight Madness","Date":"Fri Sep 18","StartTime":"20:50","EndTime":"22:51","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 11","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Ladies and Gentlemen, Brian Mulroney","slug":"ladies-and-gentlemen-brian-mulroney","category":"Midnight Madness","categorySlug":"midnight-madness","director":"Matthew Rankin","premiere":"World Premiere","cast":"","image":"https://images.ctfassets.net/22n7d68fswlw/64pLhpBuon5ZL4VSLvs6q4/6008b7e066cfe2bbd46bf310a13d264f/LADIES-AND-GENTLEMEN_-BRIAN-MULRONEY_still_03.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/64pLhpBuon5ZL4VSLvs6q4/6008b7e066cfe2bbd46bf310a13d264f/LADIES-AND-GENTLEMEN_-BRIAN-MULRONEY_still_03.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"This kaleidoscopic culture jam from visionary filmmaker Matthew Rankin (\u003cem\u003eThe Twentieth Century\u003c/em\u003e, \u003cem\u003eUniversal Language\u003c/em\u003e) details the rise of Canada’s 18th prime minister through a satirical collage of archival footage, television nostalgia, and national mythmaking.","synopsis":"Through an episodic remix that transforms thousands of hours of archival footage, Rankin astutely tracks the political maneuvering that took place during the 1976 Progressive Conservative leadership convention and into the 1980s Canadian landscape right before Mulroney’s clinching the title of prime minister. Only he infuses this political soup with nostalgic intrusions of Canadian television and outlandish dramatizations, from Mulroney conferencing with a former PM’s pickled brain to Pierre Trudeau despotically ruling the country as a floating head like TRON ’s Master Control Program. The result is reminiscent of Rankin’s debut feature, The Twentieth Century (TIFF ’19), which reimagined the ascension of William Lyon MacKenzie King as a German Expressionist farce, and especially his early collage work .","screening assets.net/22n7d68fswlw/49597njh3nhiVDHXLa2izo/1bb3be3be005747f1897f2d7d9bc80a6/River_Still_HERO.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/49597njh3nhiVDHXLa2izo/1bb3be3be005747f1897f2d7d9bc80a6/River_Still_HERO.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Joshua Giuliano makes an audacious debut with a suspenseful slasher that sets three embittered siblings adrift along a rural waterway, and in the sights of a masked killer.","synopsis":"Having convened to scatter the ashes of their late father from a family motorboat, embittered sisters (Jane Levy, TIFF ’14’s Bang Bang Baby , and Jessica Rothe, TIFF ’23’s Boy Kills World ), and their younger brother (Max Mattern, television’s Cape Fear ) stall out beneath a derelict bridge along a rural waterway. Familial wounds are provoked, and fingers are pointed, first at each other, but soon at the sudden appearance of a strange man (Dane DiLiegro, Prey ) eerily staring from the shoreline. Tall and statuesque, the figure’s face is seemingly without features or emotion, just a palpable, anonymous malevolence. And when he stops merely staring, the family must come together and start surviving.","screenings":[{"Title":"River","Director":"Joshua Giuliano","Blurb":"","Category":"Midnight Madness","Date":"Thu Sep 10","StartTime":"23:59","EndTime":"02:01","Venue":"Royal Alexandra Theatre","Room":"Royal Alexandra Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"River","Director":"Joshua Giuliano","Blurb":"","Category":"Midnight Madness","Date":"Fri Sep 11","StartTime":"08:50","EndTime":"10:22","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 4","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"River","Director":"Joshua Giuliano","Blurb":"","Category":"Midnight Madness","Date":"Fri Sep 11","StartTime":"21:40","EndTime" tz, Berlin.","synopsis":"Based on these real events, Blindspot Berlin imagines the months leading up to the attack. Detective Frank Laudin (Albrecht Schuch, All Quiet on the Western Front , TIFF ’22) has been monitoring worrying activity through his networks of informants and surveillance, assisted by the translation efforts of newly-recruited, Iraqi-born police officer Isra Al-Husseini (Bayan Layla, Elaha ). Laudin forms a special unit to investigate further, looking to convince his higher ups the threat is real. He recruits a well-connected informant, Murat Cem (Tamer Tıraşoğlu), who is well connected but inscrutable. When Murat Cem embeds within a particular group of men, his reports become more alarming each day — especially concerning one young man who seems ready to do absolutely anything he’s asked.","screenings":[{"Title":"Blindspot Berlin","Director":"David Nawrath","Blurb":"","Category":"Primetime","Date":"Thu Sep 10","StartTime":"21:40","EndTime":"23:09","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 14","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Blindspot Berlin","Director":"David Nawrath","Blurb":"","Category":"Primetime","Date":"Sun Sep 13","StartTime":"18:00","EndTime":"20:04","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"Blindspot Berlin","Director":"David Nawrath","Blurb":"","Category":"Primetime","Date":"Tue Sep 15","StartTime":"20:30","EndTime":"22:29","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 5","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Carrie","slug":"carrie","category":"Primetime","categorySlug":"primetime","director":"Mike Flanagan","premiere":"World Premiere","cast":"Amber Midthunder, Matthew Lillard, Samantha Sloyan, Samant s a rollicking momentum with the elasticity of a Tex Avery cartoon or Hideki Kamiya video game as he propels his hayseed protagonists through a crucible of harrowing and hilarious daring do and dumb. And when all his enigmatic cards are finally turned over in a series of revelations, both sobering (and scatological), an epic tragedy finally emerges, but one whose semi-parodic connotations rocket to cosmic heights.All ye who enter: hold on to your butts.","screenings":[{"Title":"Hope","Director":"Na Hong-jin","Blurb":"","Category":"Special Events","Date":"Wed Sep 09","StartTime":"18:30","EndTime":"21:17","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"Obsession","slug":"obsession","category":"Special Events","categorySlug":"special-events","director":"Curry Barker","premiere":"N/A","cast":"Michael Johnston, Inde Navarrette, Cooper Tomlinson, Megan Lawless","image":"https://images.ctfassets.net/22n7d68fswlw/7kYKDz4F1pU2D59PmWX1i0/8f9f9b6378222534faf95285bec51eac/Obsession_Still_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/7kYKDz4F1pU2D59PmWX1i0/8f9f9b6378222534faf95285bec51eac/Obsession_Still_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"When a hopeless romantic makes a wish that his long-time crush falls in love with him, a sinister enchantment ensues in writer-director Curry Barker’s freaky and frightening feature debut.","synopsis":"As with that auspicious debut, Barker’s first feature preserves an uncomfortable relatability in its hyperbolic scenario. Though literally featuring a customer service call from (and possibly to) Hell, Obsession cuts to the quick as it lays bare the innate violence in romantic objectification with an unforgiving candidness. That\u0027s made all the more disarming, thanks to exceptionally nuanced performances, particularly from Navarrette whose “Freaky Nikki” oscillates between doe-eyed desire and devastating torment that will chill you to the bone.","screenings":[{"Title":"Obsession","Director":"Curry Barker","Blurb":"","Category":"Special Events","Date":"Fri Sep 11","StartTime":"18:30","EndTime":"20:48","Venue":"Metro Toronto Convention Centre","Room":"John Bassett Theatre","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"The Age of Goodbyes","slug":"the-age-of-goodbyes","category":"Special Presentations","categorySlug":"special-presentations","director":"Edmund Yeo","premiere":"World Premiere","cast":"Vivian Sung, Stanley Yau, Troy Liu, Lixuan Siow","image":"https://images.ctfassets.net/22n7d68fswlw/35c51ROwh3HwIRWNwFYE6t/60a7fe454f61e3b65442a13fe77e5b2d/The-Age-Of-Goodbyes_06.webp?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/35c51ROwh3HwIRWNwFYE6t/60a7fe454f61e3b65442a13fe77e5b2d/The-Age-Of-Goodbyes_06.webp?w=1280\u0026h=720\u0026fit=thumb","blurb":"Vivian Sung stars as the ravishing Du Li An in a breathtaking cinematic adaptation of Li Zi Shu’s \u003cem\u003eThe Age of Goodbyes\u003c/em\u003e, a story about memory, loss, love, doppelgängers, and hidden truths.","synopsis":"Once considered unfilmable, the story’s non-linear timeline could make it challenging to follow. But this is a unique and visually stunning cinematic experience that will reward multiple viewings. Malaysian filmmaker Edmund Yeo infuses his adaptation with his personal fascination with the way experiences turn into narratives. As stories are passed down through generations, they take on lives of their own, intertwining history and myth. And, similarly, as Du Li An’s story gets passed along through screenings of The Age of Goodbyes , so shall it take on a life of its own.","screenings":[{"Title":"The Age of Goodbyes","Director":"Edmund Yeo","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"09:05", open, and more humane.","synopsis":"At the centre of Ryûsuke Hamaguchi’s latest film, his first shot largely in French, is an extended exchange between Marie-Lou (Virginie Efira, TIFF ’25’s A Private Life ), the newly appointed director of a Parisian elderly-care facility, and Mari (Tao Okamoto), a Japanese theatre director living with terminal cancer. Their conversation moves across languages and ideas — from capitalism, demographic decline, and social exhaustion, to illness, caregiving, and art itself — yet Hamaguchi uses dialogue less as exposition than as an ethical practice: a way of listening, testing thought, and reaching toward another person.","screenings":[{"Title":"All of a Sudden","Director":"Ryûsuke Hamaguchi","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"09:00","EndTime":"12:16","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"All of a Sudden","Director":"Ryûsuke Hamaguchi","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"12:30","EndTime":"16:16","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 2","Capacity":"","IsPremium":"True","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"},{"Title":"All of a Sudden","Director":"Ryûsuke Hamaguchi","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"14:15","EndTime":"18:01","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 10","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":"","OffSale":"True"}]},{"title":"All That She Wants","slug":"all-that-she-wants","category":"Special Presentations","categorySlug":"special-presentations","director":"Scarlett Bermingham, Andrew Rhymer","premiere":"World Premiere","cast":"Annie Murphy, Cooper Raiff, Zosia Mamet, Christine Baranski, John Gemberling, Bill Irwin, ng actor — and his long-estranged daughter. Esteban offers Emilia a role in his next film, a Sahara-set historical drama about the Sahrawi uprising against their Spanish colonizers. Esteban and Emilia have not seen each other in 13 years and their reunion is tense: when Emilia tries to remind her father of their difficult past, he tells her she remembers it all wrong. Nevertheless, Emilia takes the role, and soon father and daughter are on location, where, surrounded by cast and crew, a kind of emotional showdown unfolds, one rife with cruelty, manipulation, and the reopening of old wounds.","screenings":[{"Title":"The Beloved","Director":"Rodrigo Sorogoyen","Blurb":"","Category":"Special Presentations","Date":"Thu Sep 10","StartTime":"09:00","EndTime":"11:15","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 1","Capacity":"","IsPremium":"False","AudienceType":"Press \u0026 Market","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Beloved","Director":"Rodrigo Sorogoyen","Blurb":"","Category":"Special Presentations","Date":"Sun Sep 13","StartTime":"14:45","EndTime":"17:30","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Beloved","Director":"Rodrigo Sorogoyen","Blurb":"","Category":"Special Presentations","Date":"Mon Sep 14","StartTime":"11:15","EndTime":"14:00","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 2","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The Beloved","Director":"Rodrigo Sorogoyen","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 18","StartTime":"10:45","EndTime":"13:30","Venue":"TIFF Lightbox","Room":"TIFF Lightbox 3","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""},{"Title":"The ossi","Blurb":"","Category":"Special Presentations","Date":"Sat Sep 19","StartTime":"14:00","EndTime":"17:10","Venue":"VISA Screening Room at the Princess of Wales Theatre","Room":"VISA Screening Room at the Princess of Wales Theatre","Capacity":"","IsPremium":"False","AudienceType":"Public","RushScore":"0","RushDifficulty":"","Premiere":""}]},{"title":"Bucking Fastard","slug":"bucking-fastard","category":"Special Presentations","categorySlug":"special-presentations","director":"Werner Herzog","premiere":"Canadian Premiere","cast":"Rooney Mara, Kate Mara, Orlando Bloom, Domhnall Gleeson","image":"https://images.ctfassets.net/22n7d68fswlw/3gz5KG4Z6LDIvOFTLCkdZl/3a2912751968e2566890ce3b5c74a989/BuckingFastard_01.jpg?w=640\u0026h=360\u0026fit=thumb","heroImage":"https://images.ctfassets.net/22n7d68fswlw/3gz5KG4Z6LDIvOFTLCkdZl/3a2912751968e2566890ce3b5c74a989/BuckingFastard_01.jpg?w=1280\u0026h=720\u0026fit=thumb","blurb":"Director Werner Herzog and real-life sisters Kate and Rooney Mara enliven the wild true story of twin sisters who speak as one, fall in love with the same person, and eventually spiral in a peculiar case that grabbed national headlines in 1980s Britain.","synopsis":"Herzog’s filmic sisters, Jean and Joan Holbrooke, speak in unison, dress alike, have shared dreams, and, consequentially, fall in love with the same man (Orlando Bloom, The Cut , TIFF ’24). The sister’s obsession with their lover reaches a boiling point which ultimately must be resolved in court. Jean and Joan passionately defend themselves side by side as they have their whole lives, showing their unusual bond. A media frenzy, driven by the sisters’ strange and inextricably bound lives, inevitably ensues.","screenings":[{"Title":"Bucking Fastard","Director":"Werner Herzog","Blurb":"","Category":"Special Presentations","Date":"Fri Sep 11","StartTime":"16:00","EndTime":"17:49","Venue":"Scotiabank Theatre Toronto","Room":"Scotiabank 3","Capacity":"","IsPremium":"False","AudienceType":"Press
